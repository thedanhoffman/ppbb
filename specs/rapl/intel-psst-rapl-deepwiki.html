c/logger.c:336-428]()"])</script><script>self.__next_f.push([1,"1e:T27f6,"])</script><script>self.__next_f.push([1,"# Log File Format\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [README.md](README.md)\n- [src/logger.c](src/logger.c)\n- [src/logger.h](src/logger.h)\n\n\u003c/details\u003e\n\n\n\n## Purpose and Scope\n\nThis document details the format, structure, and content of log files generated by the PSST (Power Stress and Shaping Tool). It explains how PSST records and formats performance metrics, power consumption data, and thermal measurements. For information about the logging system architecture and implementation, see [Logging System](#3).\n\n## Overview\n\nPSST generates comma-separated value (CSV) log files that contain performance and power metrics collected during stress testing. These logs provide a detailed record of system behavior under various CPU load patterns, enabling analysis of power management, thermal behavior, and performance scaling.\n\n```mermaid\nflowchart LR\n    subgraph \"Log File Structure\"\n        Header[\"Column Headers Row\"]\n        Units[\"Units Row\"]\n        Data1[\"Data Row 1\"]\n        Data2[\"Data Row 2\"]\n        DataN[\"Data Row N\"]\n    end\n    \n    Header --\u003e Units\n    Units --\u003e Data1\n    Data1 --\u003e Data2\n    Data2 --\u003e DataN\n```\n\nSources: [src/logger.c:682-784]()\n\n## Header Format\n\nPSST log files contain two header rows:\n\n1. **Column Headers**: Names identifying each metric (e.g., \"Time\", \"Freq\", \"LoadRq\")\n2. **Units Row**: Measurement units for each column (e.g., \"[ms]\", \"[MHz]\", \"[C0_%]\")\n\nBoth header rows begin with a `#` character to denote them as metadata.\n\nExample of header rows:\n```\n#     Time,     Freq,     MaxCPU,    LoadRq,     Load,      ScaleF,     Qperf,      pwrPkg0,    pwrPkg1,    pwrPkg2,    pwrPkg3,    PwrCore,    PwrGpu,     PwrDram,    CpuDts,     SocDts\n#     [ms],     [MHz],    [#],       [C0_%],     [C0_%],    [%],        [perf/uS],  [mWatt],    [mWatt],    [mWatt],    [mWatt],    [mWatt],    [mWatt],    [mWatt],    [DegC],     [DegC]\n```\n\nSources: [src/logger.c:682-784](), [src/logger.h:33-50]()\n\n## Metrics and Columns\n\nThe following table describes the standard columns that may appear in PSST log files:\n\n| Column ID | Header | Unit | Description |\n|-----------|--------|------|-------------|\n| TIME_STAMP_MS | Time | [ms] | Timestamp in milliseconds since start |\n| FREQ_REALIZED | Freq | [MHz] | Average CPU frequency since last poll |\n| MAX_FREQ_CPU | MaxCPU | [#] | CPU ID with highest frequency in sample |\n| LOAD_REQUEST | LoadRq | [C0_%] | Requested CPU utilization by PSST |\n| LOAD_REALIZED | Load | [C0_%] | Actual CPU utilization measured |\n| SCALE_FACTOR | ScaleF | [%] | CPU workload scaling factor |\n| NORM_PERF | Qperf | [perf/uS] | Normalized productive performance |\n| PKG0_POWER_RAPL | pwrPkg0 | [mWatt] | Package 0 power consumption |\n| PKG1_POWER_RAPL | pwrPkg1 | [mWatt] | Package 1 power consumption |\n| PKG2_POWER_RAPL | pwrPkg2 | [mWatt] | Package 2 power consumption |\n| PKG3_POWER_RAPL | pwrPkg3 | [mWatt] | Package 3 power consumption |\n| PP0_POWER_RAPL | PwrCore | [mWatt] | Core power consumption |\n| PP1_POWER_RAPL | PwrGpu | [mWatt] | GPU/uncore power consumption |\n| DRAM_POWER_RAPL | PwrDram | [mWatt] | DRAM power consumption |\n| CPU_DTS | CpuDts | [DegC] | CPU die temperature |\n| SOC_DTS | SocDts | [DegC] | SoC die temperature |\n\nSources: [src/logger.c:51-83](), [src/logger.h:33-50]()\n\n## Column Availability\n\nNot all columns will appear in every log file. The availability of metrics depends on:\n\n1. Hardware support for specific measurements\n2. System configuration\n3. Kernel module availability (e.g., msr module)\n4. RAPL interface support for the CPU\n\nIf required interfaces are unavailable, PSST disables the corresponding columns at initialization time.\n\n```mermaid\nflowchart TD\n    Start[\"initialize_logger()\"]\n    CheckRAP[\"Check RAPL Interface Support\"]\n    CheckMSR[\"Check MSR Support\"]\n    CheckDTS[\"Check Temperature Sensors\"]\n    SetupFD[\"Set Up File Descriptors\"]\n    DisableCol[\"Disable Unsupported Columns\"]\n    \n    Start --\u003e CheckRAP\n    Start --\u003e CheckMSR\n    Start --\u003e CheckDTS\n    \n    CheckRAP --\u003e |\"Not Available\"| DisableCol\n    CheckMSR --\u003e |\"Not Available\"| DisableCol\n    CheckDTS --\u003e |\"Not Available\"| DisableCol\n    \n    CheckRAP --\u003e |\"Available\"| SetupFD\n    CheckMSR --\u003e |\"Available\"| SetupFD\n    CheckDTS --\u003e |\"Available\"| SetupFD\n```\n\nSources: [src/logger.c:336-427]()\n\n## Data Collection and Calculation\n\nThe log file data is collected and calculated through the `do_logging` function. Here's how different metrics are gathered:\n\n1. **Time-based metrics**: Calculated using the system's monotonic clock\n2. **MSR-based metrics**: Read from Model-Specific Registers (MSRs) when available\n3. **RAPL-based metrics**: Read from Intel's Running Average Power Limit interface\n4. **Temperature metrics**: Read from system temperature sensors\n\nKey calculations include:\n\n- **CPU Load**: Calculated as `(mperf_diff * 100) / tsc_diff`\n- **CPU Frequency**: Calculated as `(aperf_diff / mperf_diff) * cpu_hfm_mhz`\n- **Scale Factor**: Calculated as `(pperf_diff * 100) / aperf_diff`\n- **Power Values**: Derived from energy counters divided by the poll period\n\nSources: [src/logger.c:527-837]()\n\n## Enhanced Verbose Mode\n\nWhen the `super_verbose` option is enabled, the log file contains additional per-CPU metrics:\n\n- Per-CPU Scale Factor\n- Per-CPU Load\n- Per-CPU Frequency\n\nThese additional columns are appended after the standard columns and use the CPU ID as a suffix (e.g., \"ScaleF01\", \"Load01\", \"Freq01\").\n\nSources: [src/logger.c:703-773](), [src/logger.c:799-823]()\n\n## Log Data Flow Architecture\n\nThe following diagram illustrates how data flows from collection to the log file:\n\n```mermaid\nflowchart LR\n    subgraph \"Collection Process\"\n        MSR[\"MSR Registers\"]\n        RAPL[\"RAPL Interface\"]\n        Temp[\"Temperature Sensors\"]\n        Clock[\"System Clock\"]\n    end\n    \n    subgraph \"Processing\"\n        doLogging[\"do_logging() Function\"]\n        CalcMetrics[\"Calculate Metrics\"]\n    end\n    \n    subgraph \"Buffering Mechanism\"\n        ActiveBuffer[\"Active Buffer\"]\n        DirtyBuffer[\"Dirty Buffer\"]\n        SwapBuffers[\"Swap When Full\"]\n    end\n    \n    subgraph \"I/O Thread\"\n        IOThread[\"page_write_disk() Function\"]\n        WriteToFile[\"Write to Log File\"]\n    end\n    \n    MSR --\u003e doLogging\n    RAPL --\u003e doLogging\n    Temp --\u003e doLogging\n    Clock --\u003e doLogging\n    \n    doLogging --\u003e CalcMetrics\n    CalcMetrics --\u003e ActiveBuffer\n    \n    ActiveBuffer --\u003e |\"Buffer Full\"| SwapBuffers\n    SwapBuffers --\u003e DirtyBuffer\n    DirtyBuffer --\u003e IOThread\n    IOThread --\u003e WriteToFile\n```\n\nSources: [src/logger.c:221-332](), [src/logger.c:527-837]()\n\n## Double-Buffering Implementation\n\nPSST uses a double-buffering mechanism to efficiently write log data to disk without blocking the monitoring process:\n\n```mermaid\nsequenceDiagram\n    participant Main as \"Main/Worker Thread\"\n    participant Active as \"Active Buffer\"\n    participant Dirty as \"Dirty Buffer\"\n    participant IO as \"I/O Thread\"\n    participant File as \"Log File\"\n    \n    Main-\u003e\u003eActive: Fill active buffer with metrics\n    Note over Active: Buffer becomes full\n    Main-\u003e\u003eMain: Swap active and dirty buffers\n    Main-\u003e\u003eIO: Signal I/O thread (trigger_disk_io)\n    IO-\u003e\u003eDirty: Read dirty buffer\n    IO-\u003e\u003eFile: Write buffer contents to file\n    Main-\u003e\u003eActive: Continue filling new active buffer\n```\n\nSources: [src/logger.c:232-288](), [src/logger.c:290-332]()\n\n## Example Log File Content\n\nHere's an example of how a PSST log file might look:\n\n```\n#     Time,     Freq,     MaxCPU,    LoadRq,     Load,      ScaleF,     Qperf,      pwrPkg0,    PwrCore,    PwrGpu,     PwrDram,    CpuDts,     SocDts\n#     [ms],     [MHz],    [#],       [C0_%],     [C0_%],    [%],        [perf/uS],  [mWatt],    [mWatt],    [mWatt],    [mWatt],    [DegC],     [DegC]\n        0,      2914,     0,         0.10,       1.00,      99.80,      145.32,     0.00,       0.00,       0.00,       0.00,       24.00,      24.00\n      506,      2903,     0,         6.31,       6.56,      99.78,      149.55,     1466.67,    868.53,     0.00,       284.18,     24.00,      22.00\n     1015,      2901,     0,         2.75,       4.37,      99.76,      147.88,     1122.80,    572.63,     0.00,       283.08,     20.00,      21.00\n     1523,      2900,     1,         1.11,       2.00,      99.75,      146.91,     782.23,     251.71,     0.00,       281.98,     20.00,      21.00\n     2031,      2900,     0,         1.46,       1.46,      99.74,      145.98,     664.79,     134.03,     0.00,       279.91,     20.00,      21.00\n```\n\nSources: [README.md:52-60]()\n\n## Performance Considerations\n\nThe logging system is designed to minimize its impact on the system being monitored:\n\n1. **Asynchronous I/O**: Log writing happens in a separate thread to avoid slowing down metric collection\n2. **Double-buffering**: Prevents blocking when buffers need to be written to disk\n3. **Memory-efficient**: Buffers are sized to handle typical logging scenarios without excessive memory usage\n4. **Error handling**: Continues operation even if some metrics are unavailable\n\nSources: [src/logger.c:221-332]()\n\n## Practical Usage\n\nTo open and analyze log files:\n\n1. **Spreadsheet Software**: Import the CSV file into Excel, LibreOffice Calc, or similar software\n2. **Data Analysis Tools**: Process with Python (pandas), R, or other data analysis tools\n3. **Plotting**: Use gnuplot or other plotting tools to visualize the data\n\nExample gnuplot command to plot load vs. temperature:\n\n```\n$ gnuplot\ngnuplot\u003e set datafile separator ','\ngnuplot\u003e plot 'psst.csv' using 1:5 w lines title 'CPU Load', 'psst.csv' using 1:12 w lines title 'CPU Temperature'\n```\n\nSources: [README.md:67-77]()\n\n## Common Issues and Troubleshooting\n\n1. **Missing Columns**: If certain columns are missing, check if your system supports the corresponding metrics (e.g., RAPL might not be supported on all CPUs)\n2. **Empty Power Values**: May indicate that the kernel's RAPL driver doesn't support your CPU family/model\n3. **Zero Temperature Values**: Check if temperature sensors are accessible and supported\n4. **Inconsistent Load Values**: May occur if the system is under external load during testing\n\nSources: [README.md:13-24]()"])</script><script>self.__next_f.push([1,"1f:T286a,"])</script><script>self.__next_f.push([1,"# Configuration and Command Line Options\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [psst.1](psst.1)\n- [src/parse_config.c](src/parse_config.c)\n- [src/parse_config.h](src/parse_config.h)\n\n\u003c/details\u003e\n\n\n\nThis page documents the configuration options and command-line parameters available in PSST (Power Stress and Shaping Tool). PSST offers a flexible configuration system that allows users to control CPU utilization patterns, logging frequency, test duration, and other parameters. For information about the power shaping functions themselves, see [Power Shaping Functions](#5).\n\n## Configuration System Overview\n\nPSST uses a command-line interface for configuration, with sensible defaults for all parameters. The configuration system processes command-line arguments, populates a configuration structure, and makes this information available throughout the application.\n\n```mermaid\nflowchart LR\n    User[\"User Input\"] --\u003e |\"Command Line Args\"| ParseCmd[\"parse_cmd_config()\"]\n    ParseCmd --\u003e Config[\"struct config\"]\n    ParseCmd --\u003e |\"If shape_func specified\"| ParseShape[\"parse_power_shape()\"]\n    Config --\u003e PopulateDefaults[\"populate_default_config()\"]\n    PopulateDefaults --\u003e MainProg[\"Main Program\"]\n    ParseShape --\u003e |\"data_t *pst\"| MainProg\n```\n\nSources: [src/parse_config.c:257-324](), [src/parse_config.c:82-147](), [src/parse_config.c:356-467]()\n\n## Command Line Options\n\nPSST supports the following command-line options:\n\n| Option | Long Option | Description | Default |\n|--------|-------------|-------------|---------|\n| `-C` | `--cpumask` | Hex bit mask of CPUs to be selected | All online CPUs |\n| `-p` | `--poll-period` | Polling period for logging (ms) | 500 ms |\n| `-d` | `--duration` | Duration to run the tool (ms) | 3600000 ms (1 hour) |\n| `-l` | `--log-file` | Path to log file | `/var/log/psst.csv` (Linux) |\n| `-v` | `--verbose` | Enable verbose mode | Disabled (except when no args specified) |\n| `-S` | `--super-verbose` | Print per-core info to log file | Disabled |\n| `-V` | `--version` | Print version information | - |\n| `-s` | `--shape-func` | Power shape function and parameters | `single-step,0.1` |\n| `-h` | `--help` | Print usage information | - |\n\nSources: [src/parse_config.c:31-43](), [src/parse_config.c:45-77]()\n\n## Configuration Structure\n\nThe configuration options are stored in a `struct config` structure, defined in `parse_config.h`. This structure holds all settings used throughout the application.\n\n```mermaid\nclassDiagram\n    class \"struct config\" {\n        char v_unit\n        cpu_set_t cpumask\n        unsigned int gpumask\n        unsigned int memmask\n        unsigned int cpu_freq\n        unsigned int verbose\n        unsigned int super_verbose\n        unsigned int version\n        char log_file_name[80]\n        int log_file_fd\n        char shape_func[20]\n        int poll_period\n        int duration\n    }\n```\n\nSources: [src/parse_config.h:47-61]()\n\n## Configuration Process Flow\n\nWhen PSST starts, it processes command-line arguments and initializes the configuration structure through several steps:\n\n```mermaid\nsequenceDiagram\n    participant Main as \"Main Program\"\n    participant ParseCmd as \"parse_cmd_config()\"\n    participant PopDefaults as \"populate_default_config()\"\n    participant ParseShape as \"parse_power_shape()\"\n    participant Print as \"verbose_prints()\"\n    \n    Main-\u003e\u003eParseCmd: Call with argc, argv\n    ParseCmd-\u003e\u003eParseCmd: Initialize config struct\n    ParseCmd-\u003e\u003eParseCmd: Process command-line options\n    ParseCmd--\u003e\u003eMain: Return success/failure\n    \n    Main-\u003e\u003ePopDefaults: Call with config\n    PopDefaults-\u003e\u003ePopDefaults: Set defaults for unspecified options\n    PopDefaults-\u003e\u003ePopDefaults: Initialize logger\n    \n    alt verbose mode enabled\n        PopDefaults-\u003e\u003ePrint: Call with config\n        Print-\u003e\u003ePrint: Display configuration\n    end\n    \n    PopDefaults--\u003e\u003eMain: Return success/failure\n    \n    Main-\u003e\u003eParseShape: Call with shape_func string\n    ParseShape-\u003e\u003eParseShape: Parse shape function parameters\n    ParseShape--\u003e\u003eMain: Return success/failure\n```\n\nSources: [src/parse_config.c:257-324](), [src/parse_config.c:82-147](), [src/parse_config.c:356-467]()\n\n## CPU Mask Configuration\n\nThe CPU mask option (`-C|--cpumask`) allows users to specify which CPU cores should be used for testing. The mask is provided as a hexadecimal value, where each bit represents a CPU core.\n\nFor example:\n- `-C a1` selects CPU cores 0, 5, and 7 (binary representation: 10100001)\n- `-C f` selects CPU cores 0, 1, 2, and 3 (binary representation: 1111)\n\n```mermaid\nflowchart TD\n    Input[\"Input: -C a1\"] --\u003e ParseCmd[\"parse_cmd_config()\"]\n    ParseCmd --\u003e SetCPUMask[\"set_cpu_mask()\"]\n    SetCPUMask --\u003e ProcessHex[\"Process hex digits\"]\n    ProcessHex --\u003e SetBits[\"Set corresponding bits in cpumask\"]\n    SetBits --\u003e Special[\"Special handling for CPU0\"]\n    \n    subgraph \"CPU Mask Processing\"\n        ProcessHex\n        SetBits\n    end\n    \n    subgraph \"Special Cases\"\n        Special --\u003e Case1[\"If mask=0: only use CPU0 as submitter\"]\n        Special --\u003e Case2[\"If CPU0 not in mask: add it but don't stress\"]\n        Special --\u003e Case3[\"If GPU/MEM selected with CPU0: can't stress CPU0\"]\n    end\n```\n\nNotes:\n- CPU0 is special and is always enabled in the mask, even if not explicitly selected\n- If CPU0 is not explicitly selected, it's used only as a work submitter and not stressed\n\nSources: [src/parse_config.c:149-255](), [src/parse_config.c:82-147]()\n\n## Power Shaping Configuration\n\nThe `-s|--shape-func` option allows users to specify the power shaping function and its parameters. PSST supports several power shape functions, each with its own parameters.\n\n```mermaid\nflowchart LR\n    Input[\"Input: -s shape,params\"] --\u003e ParseCmd[\"parse_cmd_config()\"]\n    ParseCmd --\u003e Config[\"config.shape_func\"]\n    Config --\u003e ParseShape[\"parse_power_shape()\"]\n    \n    ParseShape --\u003e |\"Parse function type\"| ShapeType[\"Shape Function Type\"]\n    ParseShape --\u003e |\"Parse parameters\"| ShapeParams[\"Shape Parameters\"]\n    \n    ShapeType --\u003e Functions[\"Power Shape Functions\"]\n    ShapeParams --\u003e Functions\n    \n    Functions --\u003e SingleStep[\"SINGLE_STEP\"]\n    Functions --\u003e Sinusoid[\"SINOSOID\"]\n    Functions --\u003e Staircase[\"STAIR_CASE\"]\n    Functions --\u003e SinglePulse[\"SINGLE_PULSE\"]\n    Functions --\u003e LinearRamp[\"LINEAR_RAMP\"]\n    Functions --\u003e SawTooth[\"SAW_TOOTH\"]\n    \n    SingleStep --\u003e |\"v_units\"| SSParam[\"Step height\"]\n    Sinusoid --\u003e |\"x_wavelength, y_amplitude\"| SinParam[\"Wavelength, Amplitude\"]\n    Staircase --\u003e |\"y_height, x_length\"| SCParam[\"Step height, Step length\"]\n    SinglePulse --\u003e |\"y_height, x_length\"| SPParam[\"Pulse height, Pulse length\"]\n    LinearRamp --\u003e |\"slope_y_per_sec\"| LRParam[\"Slope\"]\n    SawTooth --\u003e |\"slope_y_per_sec, max_y\"| STParam[\"Slope, Max height\"]\n```\n\n### Supported Power Shape Functions\n\n| Function | Parameters | Description |\n|----------|------------|-------------|\n| `single-step` | `v` | Fixed load step height (default: 0.1) |\n| `sinosoid` | `w,a` | Sinusoidal wave with wavelength `w` seconds and max amplitude `a` |\n| `stair-case` | `v,u` | Step increases with height `v` and step length `u` seconds |\n| `single-pulse` | `v,u` | Single spike with height `v` and length `u` seconds |\n| `linear-ramp` | `m` | Linear increase with slope `m` (load %/sec) |\n| `saw-tooth` | `m,a` | Sawtooth pattern with slope `m` and max height `a` |\n\nSources: [src/parse_config.c:356-467](), [src/parse_config.c:45-77]()\n\n## Default Configuration\n\nWhen options are not explicitly specified, PSST applies the following defaults:\n\n```mermaid\nflowchart LR\n    PopulateDefaults[\"populate_default_config()\"] --\u003e Defaults\n\n    subgraph \"Defaults\"\n        ShapeFunc[\"shape_func = 'single-step,0.1'\"]\n        CPUMask[\"cpumask = all online CPUs\"]\n        GPUMask[\"gpumask = 0x0\"]\n        MemMask[\"memmask = 0x0\"]\n        LogFile[\"log_file = '/var/log/psst.csv'\"]\n        PollPeriod[\"poll_period = 500 ms\"]\n        Duration[\"duration = 3600000 ms (1 hour)\"]\n    end\n```\n\nSpecial handling:\n- If CPU0 is not specifically selected, it's still included but only used as a work submitter\n- If GPU or memory testing is selected, CPU0 cannot be stressed simultaneously\n\nSources: [src/parse_config.c:82-147]()\n\n## Command Line Processing\n\nThe command-line processing is handled by the `parse_cmd_config()` function, which uses the standard `getopt_long()` function to process both short and long options.\n\n```mermaid\nflowchart TD\n    Main[\"Main Program\"] --\u003e ParseCmd[\"parse_cmd_config()\"]\n    ParseCmd --\u003e Init[\"Initialize config structure\"]\n    Init --\u003e SetVerbose[\"Set verbose if no args\"]\n    SetVerbose --\u003e ProcessOpts[\"Process options with getopt_long()\"]\n    \n    ProcessOpts --\u003e |\"For each option\"| HandleOpt[\"Handle specific option\"]\n    HandleOpt --\u003e |\"More options?\"| ProcessOpts\n    HandleOpt --\u003e |\"Done\"| Validate[\"Validate configuration\"]\n    \n    Validate --\u003e |\"Valid\"| Return[\"Return success\"]\n    Validate --\u003e |\"Invalid\"| PrintUsage[\"Print usage and return failure\"]\n```\n\nSources: [src/parse_config.c:257-324]()\n\n## Examples\n\n### Basic Usage (Default Settings)\n\n```\nsudo psst\n```\n\nThis runs PSST with default settings:\n- All online CPUs with minimal load (single-step,0.1)\n- Logging to `/var/log/psst.csv` every 500ms\n- Running for 1 hour\n- Verbose mode enabled\n\n### Custom Power Shape\n\n```\nsudo psst -s linear-ramp,3 -p 700 -d 33000 -v\n```\n\nThis configuration:\n- Applies a linear ramp power shape with slope 3% per second\n- Logs data every 700ms\n- Runs for 33 seconds\n- Enables verbose output\n\n### Custom CPU Selection\n\n```\nsudo psst -C a1 -s saw-tooth,2,90 -d 60000\n```\n\nThis configuration:\n- Selects CPUs 0, 5, and 7 (hexadecimal a1 = binary 10100001)\n- Applies a saw-tooth power shape with slope 2% per second and max 90%\n- Runs for 60 seconds\n\nSources: [src/parse_config.c:45-77](), [psst.1:71-84]()\n\n## Configuration Error Handling\n\nPSST validates user inputs and provides feedback for configuration errors:\n\n- Invalid CPU mask formats trigger an error message\n- Invalid power shape functions or parameters are rejected\n- Incompatible option combinations (like stressing CPU0 with GPU testing) are detected\n\nIf invalid configuration is detected, PSST will print usage information and exit.\n\nSources: [src/parse_config.c:149-255](), [src/parse_config.c:356-467]()"])</script><script>self.__next_f.push([1,"20:T2d88,"])</script><script>self.__next_f.push([1,"# Power Shaping Functions\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [images/sinewave.png](images/sinewave.png)\n- [src/psst.c](src/psst.c)\n- [src/psst.h](src/psst.h)\n\n\u003c/details\u003e\n\n\n\n## Overview\n\nPower Shaping Functions in the PSST (Power Stress and Shaping Tool) provide mechanisms to control CPU utilization patterns over time. These functions enable creating reproducible, controlled load profiles that simulate various workload scenarios for testing system behavior, power management, and thermal characteristics of Intel SoCs.\n\nFor information on how to configure and run specific power shapes from the command line, see [Configuration and Command Line Options](#4). For visual examples and real-world use cases, see [Shape Function Examples](#5.1).\n\n## Function Principles\n\nPower shaping functions modify the CPU duty cycle (percentage of time the CPU is active versus idle) according to mathematical patterns. The duty cycle value directly controls the work/sleep cycles of CPU worker threads, creating controlled CPU utilization patterns.\n\n```mermaid\nflowchart TD\n    PS[\"power_shaping()\"] --\u003e |\"Calculates\"| DC[\"duty_cycle value\"]\n    DC --\u003e |\"Controls\"| OT[\"on_time_us = tick_usec * duty_cycle/100\"]\n    DC --\u003e |\"Controls\"| OfT[\"off_time_us = tick_usec - on_time_us\"]\n    OT --\u003e |\"Active time\"| Work[\"CPU performs work\"]\n    OfT --\u003e |\"Sleep time\"| Sleep[\"CPU idles\"]\n    Work --\u003e Loop[\"repeat cycle\"]\n    Sleep --\u003e Loop\n```\n\nSources: [src/psst.c:143-221](), [src/psst.c:285-287]()\n\n## Core Components\n\n### Power Shape Types\n\nPSST implements several power shape patterns, each defined in the `power_shape_name` enum:\n\n```mermaid\nclassDiagram\n    class \"enum power_shape_name\" {\n        SINGLE_STEP\n        SINOSOID\n        STAIR_CASE\n        SINGLE_PULSE\n        LINEAR_RAMP\n        SAW_TOOTH\n        GROWTH_CURVE*\n        DECAY_CURVE*\n        NONE\n    }\n    note for \"enum power_shape_name\" \"*Not implemented in current version\"\n```\n\nSources: [src/psst.h:35-45]()\n\n### Power Shape Parameters\n\nEach power shape type has specific parameters that define its behavior, stored in a union of structs:\n\n| Shape Type | Parameters | Description |\n|------------|------------|-------------|\n| SINGLE_STEP | v_units | Constant duty cycle value |\n| SINOSOID | y_amplitude, x_wavelength | Amplitude and wavelength of the sine wave |\n| STAIR_CASE | y_height, x_length | Step height and duration between steps |\n| SINGLE_PULSE | y_height, x_length | Pulse height and duration |\n| LINEAR_RAMP | slope_y_per_sec | Rate of change in duty cycle per second |\n| SAW_TOOTH | slope_y_per_sec, max_y | Rate of change and maximum value |\n\nSources: [src/psst.h:47-74](), [src/psst.c:142-222]()\n\n### Data Structures\n\nPower shape information is stored in two key structures:\n\n```mermaid\nclassDiagram\n    class \"ps_t\" {\n        enum power_shape_name psn\n        power_shape_attr_t psa\n        struct timespec last\n        struct timespec begin\n    }\n    \n    class \"data_t\" {\n        float duty_cycle\n        int affinity_pr\n        enum power_shape_name psn\n        power_shape_attr_t psa\n    }\n    \n    \"data_t\" --\u003e \"ps_t\" : Contains similar fields\n```\n\nSources: [src/psst.h:76-88]()\n\n## Power Shaping Algorithm\n\nThe central function implementing power shaping is `power_shaping()` which calculates duty cycle values based on the selected shape type and its parameters.\n\n```mermaid\nflowchart TD\n    PS[\"power_shaping()\"] --\u003e Check[\"Check shape type (ps-\u003epsn)\"]\n    Check --\u003e LR[\"LINEAR_RAMP\"]\n    Check --\u003e ST[\"SAW_TOOTH\"]\n    Check --\u003e SC[\"STAIR_CASE\"]\n    Check --\u003e SIN[\"SINOSOID\"]\n    Check --\u003e SP[\"SINGLE_PULSE\"]\n    Check --\u003e Default[\"Default (SINGLE_STEP)\"]\n    \n    LR --\u003e LRC[\"Calculate linear increase/decrease\"]\n    ST --\u003e STC[\"Calculate sawtooth pattern with reversal\"]\n    SC --\u003e SCC[\"Calculate step increase at intervals\"]\n    SIN --\u003e SINC[\"Calculate sine wave pattern\"]\n    SP --\u003e SPC[\"Generate single pulse then return to minimum\"]\n    Default --\u003e DEFC[\"Return constant duty cycle\"]\n    \n    LRC --\u003e UpdateTime[\"Update timestamp (ps-\u003elast)\"]\n    STC --\u003e UpdateTime\n    SCC --\u003e UpdateTime\n    SINC --\u003e UpdateTime\n    SPC --\u003e UpdateTime\n    DEFC --\u003e UpdateTime\n    \n    UpdateTime --\u003e Return[\"Return updated duty cycle\"]\n```\n\nSources: [src/psst.c:143-221]()\n\n## Power Shape Implementations\n\n### SINGLE_STEP\n\nThe simplest shape that maintains a constant duty cycle specified by the user.\n\n```mermaid\ngraph LR\n    subgraph \"SINGLE_STEP Implementation\"\n        SS[\"SINGLE_STEP\"] --\u003e |\"Returns\"| Const[\"Constant duty cycle (v_units)\"]\n    end\n```\n\nSources: [src/psst.c:212-214]()\n\n### LINEAR_RAMP\n\nCreates a linear increase or decrease in CPU utilization over time.\n\n```mermaid\ngraph TD\n    subgraph \"LINEAR_RAMP Implementation\"\n        LR[\"LINEAR_RAMP\"] --\u003e Check[\"Check time elapsed\"]\n        Check --\u003e |\"If interval passed\"| Calc[\"Calculate increment based on slope\"]\n        Calc --\u003e Add[\"Add increment to duty cycle\"]\n        Add --\u003e Cap[\"Cap at min/max limits\"]\n    end\n```\n\nSources: [src/psst.c:149-158]()\n\n### SAW_TOOTH\n\nSimilar to LINEAR_RAMP but reverses direction when reaching minimum or maximum values.\n\n```mermaid\ngraph TD\n    subgraph \"SAW_TOOTH Implementation\"\n        ST[\"SAW_TOOTH\"] --\u003e Check[\"Check time elapsed\"]\n        Check --\u003e |\"If interval passed\"| Limit[\"Check if at min/max\"]\n        Limit --\u003e |\"If at limit\"| Reverse[\"Reverse slope direction\"]\n        Limit --\u003e |\"Calculate\"| Calc[\"Calculate increment\"]\n        Reverse --\u003e Calc\n        Calc --\u003e Add[\"Add increment to duty cycle\"]\n        Add --\u003e Cap[\"Cap at min/max limits\"]\n    end\n```\n\nSources: [src/psst.c:159-170]()\n\n### STAIR_CASE\n\nIncreases the duty cycle in discrete steps at regular intervals.\n\n```mermaid\ngraph TD\n    subgraph \"STAIR_CASE Implementation\"\n        SC[\"STAIR_CASE\"] --\u003e Check[\"Check if step interval elapsed\"]\n        Check --\u003e |\"If interval passed\"| Add[\"Add step height to duty cycle\"]\n        Add --\u003e Cap[\"Cap at min/max limits\"]\n    end\n```\n\nSources: [src/psst.c:171-179]()\n\n### SINOSOID\n\nCreates a sinusoidal pattern in CPU utilization, useful for simulating oscillating workloads.\n\n```mermaid\ngraph TD\n    subgraph \"SINOSOID Implementation\"\n        SIN[\"SINOSOID\"] --\u003e Check[\"Check time elapsed\"]\n        Check --\u003e |\"If interval passed\"| Time[\"Calculate position in wave cycle\"]\n        Time --\u003e Sin[\"Apply sine function\"]\n        Sin --\u003e Scale[\"Scale to amplitude range\"]\n        Scale --\u003e Offset[\"Add minimum offset\"]\n    end\n```\n\nSources: [src/psst.c:180-192]()\n\n### SINGLE_PULSE\n\nGenerates a single high-duty-cycle pulse for a specified duration.\n\n```mermaid\ngraph TD\n    subgraph \"SINGLE_PULSE Implementation\"\n        SP[\"SINGLE_PULSE\"] --\u003e First[\"Check if first call\"]\n        First --\u003e |\"If first\"| Init[\"Initialize start time\"]\n        First --\u003e Time[\"Check if pulse duration elapsed\"]\n        Init --\u003e Time\n        Time --\u003e |\"If within duration\"| High[\"Set high duty cycle\"]\n        Time --\u003e |\"If duration passed\"| Low[\"Set minimum duty cycle\"]\n    end\n```\n\nSources: [src/psst.c:193-208]()\n\n## Integration with Worker Threads\n\nThe power shaping functions integrate with the worker thread system to create controlled CPU load patterns:\n\n```mermaid\nsequenceDiagram\n    participant MT as \"Main Thread\"\n    participant WT as \"Worker Thread\"\n    participant PS as \"power_shaping()\"\n    participant W as \"CPU Work\"\n    \n    MT-\u003e\u003eWT: Create thread with shape parameters\n    loop Until completion\n        WT-\u003e\u003ePS: Calculate duty cycle based on shape\n        PS-\u003e\u003eWT: Return updated duty cycle\n        WT-\u003e\u003eWT: Calculate on_time_us and off_time_us\n        WT-\u003e\u003eW: Perform work for on_time_us\n        WT-\u003e\u003eWT: Sleep for off_time_us\n    end\n```\n\nSources: [src/psst.c:226-371](), [src/psst.c:316-319](), [src/psst.c:285-287]()\n\n## Power Shape Patterns Visualized\n\nHere's a visualization of how different power shapes would affect CPU utilization over time:\n\n```mermaid\ngraph LR\n    subgraph \"Power Shape Load Patterns\"\n        SS[\"SINGLE_STEP:\"] --- SSL[\"_____\"]\n        SIN[\"SINOSOID:\"] --- SINL[\"~~~~~\"]\n        SC[\"STAIR_CASE:\"] --- SCL[\"_┐_┐_┐\"]\n        SP[\"SINGLE_PULSE:\"] --- SPL[\"_┐_\"]\n        LR[\"LINEAR_RAMP:\"] --- LRL[\"／___\"]\n        ST[\"SAW_TOOTH:\"] --- STL[\"／╲／╲\"]\n    end\n```\n\nSources: [src/psst.h:35-45](), [src/psst.c:143-221]()\n\n## Usage in the Codebase\n\nThe power shaping functionality is used in the following workflow:\n\n1. The main program parses user configuration, including the power shape specification\n2. Worker threads are created with the specified power shape parameters\n3. Each worker thread calls `power_shaping()` in its work loop to determine the duty cycle\n4. The duty cycle controls the active/idle ratio for CPU work\n\n```mermaid\nflowchart LR\n    Config[\"Configuration Parsing\"] --\u003e MainThread[\"Main Thread\"]\n    MainThread --\u003e CreateThreads[\"Create Worker Threads\"]\n    CreateThreads --\u003e WorkLoop[\"Worker Thread Loop\"]\n    WorkLoop --\u003e PowerShaping[\"power_shaping()\"]\n    PowerShaping --\u003e DutyCycle[\"Update duty_cycle\"]\n    DutyCycle --\u003e WorkCalc[\"Calculate on_time/off_time\"]\n    WorkCalc --\u003e Work[\"Perform CPU Work\"]\n    Work --\u003e Sleep[\"Sleep\"]\n    Sleep --\u003e WorkLoop\n```\n\nSources: [src/psst.c:394-545](), [src/psst.c:226-371](), [src/psst.c:316-319]()\n\n## Relationships to Other Subsystems\n\nThe power shaping functionality interacts with several other components of the PSST system:\n\n```mermaid\nflowchart TD\n    PS[\"Power Shaping Functions\"] --\u003e WT[\"Worker Threads\"]\n    PS --\u003e CPUWork[\"CPU Work Generation\"]\n    PS --\u003e Config[\"Configuration Parser\"]\n    PS --\u003e Log[\"Logging System\"]\n    \n    subgraph \"Thread System\"\n        WT --\u003e Loop[\"Work/Sleep Loop\"]\n    end\n    \n    subgraph \"Monitoring\"\n        Log --\u003e Perf[\"Performance Monitoring\"]\n        Log --\u003e Power[\"Power Measurement (RAPL)\"]\n    end\n    \n    Config --\u003e PS\n    Loop --\u003e PS\n    PS --\u003e Loop\n```\n\nSources: [src/psst.c:226-371](), [src/psst.c:316-319](), [src/psst.c:143-221]()\n\n## Technical Implementation Details\n\nThe power shaping function performs calculations at defined intervals (typically 50ms minimum polling period) to avoid excessive recalculation while still providing smooth patterns. The implementation uses the CLOCK_MONOTONIC time source to track time progression accurately.\n\nEach power shape pattern implements its own algorithm to calculate the next duty cycle value:\n\n| Shape | Algorithm Approach |\n|-------|-------------------|\n| SINGLE_STEP | Constant value |\n| LINEAR_RAMP | Linear increment based on elapsed time and slope |\n| SAW_TOOTH | Linear increment with direction reversal at boundaries |\n| STAIR_CASE | Step increment at fixed intervals |\n| SINOSOID | Sine wave calculation based on elapsed time and wavelength |\n| SINGLE_PULSE | Binary high/low based on elapsed time comparison |\n\nSources: [src/psst.c:143-221](), [src/psst.c:142]()\n\n## Practical Application\n\nPower shaping functions enable PSST to simulate various real-world workload scenarios:\n\n1. **SINGLE_STEP**: Baseline power consumption at fixed utilization\n2. **LINEAR_RAMP**: Gradual load increase for thermal ramp testing\n3. **SAW_TOOTH**: Alternating load patterns to test power management response\n4. **STAIR_CASE**: Stepped increases to identify power/thermal thresholds\n5. **SINOSOID**: Oscillating workloads to test dynamic frequency scaling\n6. **SINGLE_PULSE**: Spike testing to evaluate transient system response\n\nBy combining these patterns with PSST's monitoring capabilities, users can analyze how system power management, thermal controls, and performance scaling respond to different load profiles.\n\nSources: [src/psst.c:143-221](), [src/psst.h:35-45]()"])</script><script>self.__next_f.push([1,"21:T3677,"])</script><script>self.__next_f.push([1,"# Shape Function Examples\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [README.md](README.md)\n- [images/sinewave.png](images/sinewave.png)\n- [src/psst.c](src/psst.c)\n\n\u003c/details\u003e\n\n\n\nThis document provides detailed examples and visualizations of the various power shape functions supported by PSST. Power shape functions control the CPU utilization patterns that PSST creates when stressing a system, allowing users to simulate different workload scenarios. For information about implementing new power shape functions, see [Adding New Power Shapes](#8.1).\n\n## Power Shaping Overview\n\nPSST's power shaping functionality enables precise control over CPU utilization patterns. The tool translates mathematical functions into duty cycles that determine when the CPU performs work versus when it idles. This capability allows users to simulate a wide variety of workload patterns for power, thermal, and performance testing.\n\nThe `power_shaping()` function in PSST implements these patterns and dynamically adjusts the duty cycle parameter based on the selected shape function and its parameters.\n\n```mermaid\nflowchart TD\n    subgraph \"Power Shaping System\"\n        PS[\"power_shaping() Function\"]\n        DC[\"Duty Cycle Calculation\"]\n        Work[\"work_fn() Thread\"]\n    end\n\n    subgraph \"Shape Functions\"\n        SS[\"SINGLE_STEP\"]\n        SIN[\"SINOSOID\"]\n        SC[\"STAIR_CASE\"]\n        SP[\"SINGLE_PULSE\"]\n        LR[\"LINEAR_RAMP\"]\n        ST[\"SAW_TOOTH\"]\n    end\n    \n    CLI[\"Command Line Interface\"] --\u003e PS\n    PS --\u003e DC\n    SS --\u003e PS\n    SIN --\u003e PS\n    SC --\u003e PS\n    SP --\u003e PS\n    LR --\u003e PS\n    ST --\u003e PS\n    DC --\u003e Work\n    Work --\u003e CPU[\"CPU Utilization\"]\n```\n\nSources: [src/psst.c:143-222](), [src/psst.c:226-371]()\n\n## Shape Function Types and Parameters\n\nPSST supports six different power shape functions, each with its own parameters and behavior patterns. The table below summarizes these functions and their parameters:\n\n| Shape Function | Parameters | Description |\n|----------------|------------|-------------|\n| single-step    | v          | Constant load at specified percentage (v) |\n| sinosoid       | w, a       | Sinusoidal wave with wavelength w seconds and amplitude a% |\n| stair-case     | v, u       | Step increases of height v% every u seconds |\n| single-pulse   | v, u       | Single spike of v% load for u seconds |\n| linear-ramp    | m          | Linear increase at m% per second |\n| saw-tooth      | m, a       | Linear increase at m% per second until reaching a%, then reset |\n\nEach of these shape functions is implemented within the `power_shaping()` function in the source code.\n\nSources: [src/psst.c:143-222](), [README.md:96-102]()\n\n## Visual Representation of Shape Functions\n\nThe following diagram illustrates the CPU load patterns generated by each power shape function over time:\n\n```mermaid\ngraph LR\n    subgraph \"Shape Function Output Patterns\"\n        direction TB\n        \n        subgraph \"single-step\"\n            SS[\" \"] --- SSPattern[\"___________\"]\n        end\n        \n        subgraph \"sinosoid\"\n            SIN[\" \"] --- SINPattern[\"~~~~~\"]\n        end\n        \n        subgraph \"stair-case\"\n            SC[\" \"] --- SCPattern[\"_/‾\\_/‾\\_/‾\\_\"]\n        end\n        \n        subgraph \"single-pulse\"\n            SP[\" \"] --- SPPattern[\"_/‾\\________\"]\n        end\n        \n        subgraph \"linear-ramp\"\n            LR[\" \"] --- LRPattern[\"___/////////\"]\n        end\n        \n        subgraph \"saw-tooth\"\n            ST[\" \"] --- STPattern[\"_/|_/|_/|_/|\"]\n        end\n    end\n```\n\nSources: [src/psst.c:143-222](), [README.md:96-102]()\n\n## Single-Step Pattern\n\nThe single-step pattern maintains a constant CPU load at a specified percentage. This is the simplest shape function and is useful for baseline power and thermal measurements.\n\n### Implementation Details\n\nThe single-step function is implemented as the default case in the `power_shaping()` function. It simply sets the duty cycle to a constant value specified by the user.\n\n```mermaid\ngraph LR\n    subgraph \"Single-Step Function\"\n        direction LR\n        Time[\"Time →\"] --- Load[\"Load %\"]\n        \n        Load --- |\"v%\"| FlatLine[\"_________________\"]\n    end\n```\n\n### Usage Example\n\nTo run PSST with a single-step pattern at 10% CPU load:\n\n```\nsudo ./psst -s single-step,10\n```\n\nThe parameter `v` represents the fixed load percentage, which in this case is 10%.\n\nSources: [src/psst.c:211-214](), [README.md:97]()\n\n## Sinusoidal Pattern\n\nThe sinusoidal pattern creates a wave-like CPU load that follows a sine function, oscillating between a minimum load and the specified amplitude.\n\n### Implementation Details\n\nThe sinusoidal function calculates the duty cycle based on the sine of the current time, scaled to the specified amplitude and wavelength. The implementation uses `sinf()` to generate the wave pattern.\n\n```mermaid\ngraph LR\n    subgraph \"Sinusoidal Function\"\n        direction LR\n        Time[\"Time →\"] --- Load[\"Load %\"]\n        \n        Load --- SineWave[\"~~~~~~~\"]\n        \n        Annotations[\"Parameters:\n        w = wavelength (seconds)\n        a = amplitude (max load %)\"]\n    end\n```\n\n### Usage Example\n\nTo run PSST with a sinusoidal pattern with a 15-second wavelength and 50% maximum amplitude:\n\n```\nsudo ./psst -s sinosoid,15,50\n```\n\nThis creates a sine wave that completes one full cycle every 15 seconds, with the CPU load varying between approximately 1% and 51%.\n\nSources: [src/psst.c:180-192](), [README.md:98]()\n\n## Stair-Case Pattern\n\nThe stair-case pattern creates step-wise increases in CPU load at regular intervals. This pattern is useful for testing system response to graduated load increases.\n\n### Implementation Details\n\nThe stair-case function increases the duty cycle by a fixed amount (`y_height`) after each fixed time interval (`x_length`). The implementation checks if the specified time has elapsed before applying the increment.\n\n```mermaid\ngraph LR\n    subgraph \"Stair-Case Function\"\n        direction LR\n        Time[\"Time →\"] --- Load[\"Load %\"]\n        \n        Load --- StairPattern[\"_/‾\\_/‾\\_/‾\\_/‾\\\"]\n        \n        Annotations[\"Parameters:\n        v = step height (%)\n        u = step length (seconds)\"]\n    end\n```\n\n### Usage Example\n\nTo run PSST with a stair-case pattern that increases by 10% every 5 seconds:\n\n```\nsudo ./psst -s stair-case,10,5\n```\n\nThis creates a pattern where CPU load increases by 10% every 5 seconds until it reaches the maximum allowed load, at which point it will be capped.\n\nSources: [src/psst.c:171-179](), [README.md:99]()\n\n## Single-Pulse Pattern\n\nThe single-pulse pattern creates a single spike of CPU load for a specified duration, then returns to minimal load. This pattern is useful for testing system response to sudden, short-duration loads.\n\n### Implementation Details\n\nThe single-pulse function sets the duty cycle to the specified height (`y_height`) for a specified duration (`x_length`), then returns to the minimum load. It uses a rising edge detection to track when the pulse should start and a falling edge detection to determine when it should end.\n\n```mermaid\ngraph LR\n    subgraph \"Single-Pulse Function\"\n        direction LR\n        Time[\"Time →\"] --- Load[\"Load %\"]\n        \n        Load --- PulsePattern[\"_/‾\\___________\"]\n        \n        Annotations[\"Parameters:\n        v = pulse height (%)\n        u = pulse duration (seconds)\"]\n    end\n```\n\n### Usage Example\n\nTo run PSST with a single-pulse pattern that creates a 60% CPU load for 2 seconds:\n\n```\nsudo ./psst -s single-pulse,60,2\n```\n\nThis creates a pattern where CPU load jumps to 60% for 2 seconds, then returns to the minimum load.\n\nSources: [src/psst.c:193-208](), [README.md:100]()\n\n## Linear-Ramp Pattern\n\nThe linear-ramp pattern creates a gradually increasing CPU load at a constant rate. This pattern is useful for testing system response to steadily increasing load.\n\n### Implementation Details\n\nThe linear-ramp function increases the duty cycle by a fixed increment calculated from the specified slope (`slope_y_per_sec`) every polling interval. It recalculates the load at regular intervals defined by `PS_MIN_POLL_MS`.\n\n```mermaid\ngraph LR\n    subgraph \"Linear-Ramp Function\"\n        direction LR\n        Time[\"Time →\"] --- Load[\"Load %\"]\n        \n        Load --- RampPattern[\"______///////\"]\n        \n        Annotations[\"Parameter:\n        m = slope (% per second)\"]\n    end\n```\n\n### Usage Example\n\nTo run PSST with a linear-ramp pattern that increases CPU load by 3% per second:\n\n```\nsudo ./psst -s linear-ramp,3\n```\n\nThis creates a pattern where CPU load increases by 3% every second until it reaches the maximum allowed load, at which point it will be capped.\n\nSources: [src/psst.c:149-158](), [README.md:101]()\n\n## Saw-Tooth Pattern\n\nThe saw-tooth pattern creates a repeating pattern where CPU load increases linearly to a maximum value, then immediately drops back to the minimum. This pattern is useful for testing system response to repeated load spikes.\n\n### Implementation Details\n\nThe saw-tooth function increases the duty cycle like the linear-ramp function, but when it reaches either the specified maximum (`max_y`) or the minimum load, it reverses the sign of the slope to create the saw-tooth pattern.\n\n```mermaid\ngraph LR\n    subgraph \"Saw-Tooth Function\"\n        direction LR\n        Time[\"Time →\"] --- Load[\"Load %\"]\n        \n        Load --- SawtoothPattern[\"_/|_/|_/|_/|\"]\n        \n        Annotations[\"Parameters:\n        m = slope (% per second)\n        a = maximum load (%)\"]\n    end\n```\n\n### Usage Example\n\nTo run PSST with a saw-tooth pattern that increases CPU load by 5% per second up to a maximum of 70%:\n\n```\nsudo ./psst -s saw-tooth,5,70\n```\n\nThis creates a pattern where CPU load increases by 5% every second until it reaches 70%, then drops back to the minimum load and starts rising again.\n\nSources: [src/psst.c:159-170](), [README.md:102]()\n\n## Using Multiple Shape Functions\n\nPSST allows running different shape functions on different CPU cores simultaneously. This capability enables complex testing scenarios where different parts of the system are subjected to different load patterns.\n\nThe following diagram illustrates how different shape functions can be applied to different CPU cores:\n\n```mermaid\ngraph TD\n    subgraph \"Multi-Core Power Shaping\"\n        direction LR\n        \n        subgraph \"CPU Cores\"\n            Core0[\"Core 0\"]\n            Core1[\"Core 1\"] \n            Core2[\"Core 2\"]\n            Core3[\"Core 3\"]\n        end\n        \n        LR[\"Linear-Ramp\"] --\u003e Core0\n        SIN[\"Sinusoidal\"] --\u003e Core1\n        SS[\"Single-Step\"] --\u003e Core2\n        SP[\"Single-Pulse\"] --\u003e Core3\n        \n        subgraph \"Resulting System Load\"\n            SL[\"Combined Load Pattern\"]\n        end\n        \n        Core0 --\u003e SL\n        Core1 --\u003e SL\n        Core2 --\u003e SL\n        Core3 --\u003e SL\n    end\n```\n\n### Multi-Pattern Example\n\nTo apply different patterns to different CPU cores, run multiple instances of PSST, each targeting a specific core:\n\n```\n# Linear ramp on CPU 0\nsudo ./psst -C 0 -d 30000 -s linear-ramp,2 \u0026\n\n# Sinusoidal wave on CPU 1\nsudo ./psst -C 1 -d 30000 -s sinosoid,15,50 \u0026\n\n# Constant load on CPU 2\nsudo ./psst -C 2 -d 30000 -s single-step,20 \u0026\n\n# Single pulse on CPU 3\nsudo ./psst -C 3 -d 30000 -s single-pulse,60,2 \u0026\n```\n\nThis creates a complex system load pattern where each core behaves according to its assigned shape function. The `-C` option specifies which CPU core to target, and the `-d` option sets the duration in milliseconds.\n\nSources: [README.md:120-128](), [src/psst.c:395-545]()\n\n## Implementation Mapping\n\nThe following diagram maps the command-line shape function parameters to their internal implementation in the codebase:\n\n```mermaid\nflowchart TD\n    subgraph \"Command Line Interface\"\n        SS_CLI[\"single-step,v\"]\n        SIN_CLI[\"sinosoid,w,a\"]\n        SC_CLI[\"stair-case,v,u\"]\n        SP_CLI[\"single-pulse,v,u\"]\n        LR_CLI[\"linear-ramp,m\"]\n        ST_CLI[\"saw-tooth,m,a\"]\n    end\n    \n    subgraph \"parse_power_shape()\"\n        Parser[\"Parameter Parsing\"]\n    end\n    \n    subgraph \"power_shaping() Function\"\n        SS_IMPL[\"SINGLE_STEP case (default)\"]\n        SIN_IMPL[\"SINOSOID case\"]\n        SC_IMPL[\"STAIR_CASE case\"]\n        SP_IMPL[\"SINGLE_PULSE case\"]\n        LR_IMPL[\"LINEAR_RAMP case\"]\n        ST_IMPL[\"SAW_TOOTH case\"]\n    end\n    \n    SS_CLI --\u003e Parser\n    SIN_CLI --\u003e Parser\n    SC_CLI --\u003e Parser\n    SP_CLI --\u003e Parser\n    LR_CLI --\u003e Parser\n    ST_CLI --\u003e Parser\n    \n    Parser --\u003e SS_IMPL\n    Parser --\u003e SIN_IMPL\n    Parser --\u003e SC_IMPL\n    Parser --\u003e SP_IMPL\n    Parser --\u003e LR_IMPL\n    Parser --\u003e ST_IMPL\n    \n    SS_IMPL --\u003e OnTime[\"Calculate on_time_us\"]\n    SIN_IMPL --\u003e OnTime\n    SC_IMPL --\u003e OnTime\n    SP_IMPL --\u003e OnTime\n    LR_IMPL --\u003e OnTime\n    ST_IMPL --\u003e OnTime\n    \n    OnTime --\u003e Work[\"CPU Work Execution\"]\n```\n\nSources: [src/psst.c:143-222](), [src/psst.c:226-371](), [src/psst.c:436-443]()\n\n## Practical Applications\n\nDifferent power shape functions are useful for different testing scenarios:\n\n1. **Single-Step**: Baseline measurements, steady-state thermal testing, minimizing monitoring overhead\n2. **Sinusoidal**: Testing dynamic power management, thermal response to oscillating loads\n3. **Stair-Case**: Evaluating frequency scaling behavior, governor response to gradual load increases\n4. **Single-Pulse**: Measuring response to sudden workload spikes, thermal capacity testing\n5. **Linear-Ramp**: Testing system behavior under gradually increasing load, identifying performance thresholds\n6. **Saw-Tooth**: Testing rapid transitions between load levels, evaluating power management responsiveness\n\nBy choosing the appropriate shape function and parameters, users can simulate a wide variety of real-world workload scenarios for comprehensive system analysis.\n\nSources: [README.md:3-12](), [README.md:27-38](), [README.md:104-106]()"])</script><script>self.__next_f.push([1,"22:T23f6,"])</script><script>self.__next_f.push([1,"# Performance Monitoring Subsystem\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [src/perf_msr.c](src/perf_msr.c)\n- [src/perf_msr.h](src/perf_msr.h)\n\n\u003c/details\u003e\n\n\n\n## Purpose and Scope\n\nThe Performance Monitoring Subsystem in PSST provides a mechanism to access and interpret CPU performance metrics through Intel's Model-Specific Registers (MSRs). This subsystem enables accurate measurement of CPU frequency, utilization, and performance counters during stress testing operations. It forms a critical component for correlating power consumption with CPU performance states.\n\nFor information about power monitoring capabilities, see [Power Monitoring with RAPL](#7).\n\nSources: [src/perf_msr.h:15-38](), [src/perf_msr.c:1-16]()\n\n## MSR Interface Architecture\n\nThe Performance Monitoring Subsystem accesses CPU performance data through the MSR interface provided by the Linux kernel.\n\n```mermaid\nflowchart TD\n    subgraph \"Performance Monitoring Subsystem\"\n        initialize[\"initialize_dev_msr()\"]\n        readmsr[\"read_msr()\"]\n        initHFM[\"initialize_cpu_hfm_mhz()\"]\n        diffCalc[\"cpu_get_diff_aperf()/mperf()/pperf()/tsc()\"]\n    end\n\n    initialize --\u003e |\"Opens /dev/cpu/N/msr\"| msrDevice[\"/dev/cpu/N/msr Device\"]\n    msrDevice --\u003e readmsr\n    readmsr --\u003e |\"MSR_PLATFORM_INFO\"| initHFM\n    readmsr --\u003e diffCalc\n    \n    subgraph \"CPU Hardware\"\n        aperf[\"MSR_IA32_APERF (0xe8)\"]\n        mperf[\"MSR_IA32_MPERF (0xe7)\"]\n        pperf[\"MSR_IA32_PPERF (0x64e)\"]\n        tsc[\"MSR_IA32_TSC (0x10)\"]\n        platform[\"MSR_PLATFORM_INFO (0xce)\"]\n    end\n    \n    readmsr --\u003e aperf\n    readmsr --\u003e mperf\n    readmsr --\u003e pperf\n    readmsr --\u003e tsc\n    readmsr --\u003e platform\n```\n\n**MSR Interface System Diagram**\n\nSources: [src/perf_msr.c:26-49](), [src/perf_msr.h:22-27]()\n\n## Key Performance Counters\n\nThe subsystem uses several Model-Specific Registers (MSRs) to collect performance data:\n\n| MSR Name | Register Address | Description |\n|----------|------------------|-------------|\n| MSR_IA32_APERF | 0xe8 | Actual Performance Frequency Clock Count |\n| MSR_IA32_MPERF | 0xe7 | Maximum Performance Frequency Clock Count |\n| MSR_IA32_PPERF | 0x64e | Processor Performance Count |\n| MSR_IA32_TSC | 0x10 | Time Stamp Counter |\n| MSR_PLATFORM_INFO | 0xce | Platform Information (contains HFM) |\n| MSR_PERF_STATUS | 0x198 | Performance Status Information |\n\nThese counters provide the raw data needed to calculate metrics like CPU frequency, utilization, and performance efficiency.\n\nSources: [src/perf_msr.h:22-27]()\n\n## Initialization Process\n\nThe subsystem follows a specific initialization sequence to set up MSR access and prepare for performance monitoring.\n\n```mermaid\nsequenceDiagram\n    participant Main as \"Main Program\"\n    participant PerfMSR as \"Performance Monitoring Subsystem\"\n    participant MSRFile as \"/dev/cpu/N/msr\"\n    participant CPU as \"CPU Hardware\"\n    \n    Main-\u003e\u003ePerfMSR: init_delta_vars(num_cpus)\n    Note over PerfMSR: Allocate memory for tracking\u003cbr\u003ecounter differences\n    \n    loop For each CPU core\n        Main-\u003e\u003ePerfMSR: initialize_dev_msr(cpu_id)\n        PerfMSR-\u003e\u003eMSRFile: open(\"/dev/cpu/N/msr\")\n        MSRFile--\u003e\u003ePerfMSR: Return file descriptor\n        \n        Main-\u003e\u003ePerfMSR: initialize_cpu_hfm_mhz(fd)\n        PerfMSR-\u003e\u003eMSRFile: read_msr(MSR_PLATFORM_INFO)\n        MSRFile-\u003e\u003eCPU: Read register\n        CPU--\u003e\u003eMSRFile: Return register value\n        MSRFile--\u003e\u003ePerfMSR: Return register value\n        Note over PerfMSR: Extract HFM from bits 8:15\u003cbr\u003ecpu_hfm_mhz = ((msr_val \u003e\u003e 8) \u0026 0xff) * 100\n    end\n```\n\n**MSR Initialization Sequence**\n\nSources: [src/perf_msr.c:37-65](), [src/perf_msr.c:83-94]()\n\n## Performance Metric Calculation\n\nThe subsystem uses a differential approach to calculate performance metrics, where the difference between consecutive counter readings is used rather than absolute values.\n\n```mermaid\nflowchart TD\n    subgraph \"Counter Tracking Mechanism\"\n        direction LR\n        Read1[\"Read MSRs\\nTime t1\"] --\u003e DiffCalc[\"Calculate Differences\\nusing cpu_get_diff functions\"]\n        DiffCalc --\u003e Metrics[\"Calculate Metrics\\n- CPU Frequency\\n- Utilization\"]\n        Read1 --\u003e Store[\"Store values as\\nlast_aperf[cpu]\\nlast_mperf[cpu]\\nlast_pperf[cpu]\\nlast_tsc[cpu]\"]\n        Store --\u003e Read2[\"Read MSRs\\nTime t2\"]\n        Read2 --\u003e DiffCalc\n    end\n    \n    subgraph \"Metric Calculations\"\n        aperf_diff[\"aperf_diff = cpu_get_diff_aperf(aperf, cpu_id)\"]\n        mperf_diff[\"mperf_diff = cpu_get_diff_mperf(mperf, cpu_id)\"]\n        pperf_diff[\"pperf_diff = cpu_get_diff_pperf(pperf, cpu_id)\"]\n        tsc_diff[\"tsc_diff = cpu_get_diff_tsc(tsc, cpu_id)\"]\n        \n        freq_calc[\"CPU Frequency = (aperf_diff/mperf_diff) * cpu_hfm_mhz\"]\n        util_calc[\"CPU Utilization = (mperf_diff/tsc_diff) * 100%\"]\n    end\n    \n    DiffCalc --\u003e aperf_diff\n    DiffCalc --\u003e mperf_diff\n    DiffCalc --\u003e pperf_diff\n    DiffCalc --\u003e tsc_diff\n    \n    aperf_diff --\u003e freq_calc\n    mperf_diff --\u003e freq_calc\n    mperf_diff --\u003e util_calc\n    tsc_diff --\u003e util_calc\n```\n\n**Performance Metric Calculation Flow**\n\nSources: [src/perf_msr.c:67-121]()\n\n## Delta Tracking System\n\nTo accurately measure CPU performance metrics, the subsystem needs to track the differences between consecutive MSR readings. This is handled by a set of specialized macros and functions.\n\n### Counter Difference Calculation\n\nThe subsystem defines macro generators that create functions for tracking the delta between successive readings of each performance counter:\n\n```\ncpu_generate_msr_diff(aperf);\ncpu_generate_msr_diff(mperf);\ncpu_generate_msr_diff(pperf);\ncpu_generate_msr_diff(tsc);\n```\n\nThese macros expand to generate functions like `cpu_get_diff_aperf()`, which:\n1. Calculate the difference between the current reading and the previous one\n2. Store the current reading for the next iteration\n3. Return the calculated difference\n\nSources: [src/perf_msr.c:108-121]()\n\n### Memory Management\n\nThe subsystem allocates arrays to track the last value of each counter for each CPU core:\n\n```mermaid\nclassDiagram\n    class MemoryStructure {\n        last_aperf[num_cpus]\n        last_mperf[num_cpus]\n        last_pperf[num_cpus]\n        last_tsc[num_cpus]\n    }\n    \n    class init_delta_vars {\n        +init_delta_vars(int n)\n        Allocates memory for counter arrays\n        Returns 1 on success, 0 on failure\n    }\n    \n    MemoryStructure -- init_delta_vars\n```\n\n**Delta Variable Memory Structure**\n\nSources: [src/perf_msr.c:78-94]()\n\n## Hardware Errata Handling\n\nThe subsystem includes special handling for known hardware bugs, demonstrating the robustness of the implementation.\n\n### Alderlake Errata Workaround\n\nThe code includes a workaround for Intel Alderlake hardware errata #ADL026, where bits 31:64 of the pperf register may be incorrect:\n\n```mermaid\nflowchart TD\n    Start[\"Calculate difference\"] --\u003e Check{\"Is current \u003c previous?\"}\n    Check --\u003e|Yes| Wraparound[\"Handle 32-bit wraparound:\\n(0xFFFFFFFF - prev + curr)\"]\n    Check --\u003e|No| Normal[\"Standard difference:\\ncurr - prev\"]\n    Wraparound --\u003e Return[\"Return difference\"]\n    Normal --\u003e Return\n```\n\n**Errata Handling Logic**\n\nThe `u64diff` macro implements this workaround by assuming real differences are less than MAX(uint32) and handling potential wraparound scenarios.\n\nSources: [src/perf_msr.c:96-104]()\n\n## Integration with PSST\n\nThe Performance Monitoring Subsystem is used by the main PSST program to gather performance data while applying controlled CPU stress. This data is then logged alongside power measurements for analysis.\n\n```mermaid\nflowchart TD\n    subgraph \"PSST Main Program\"\n        Config[\"Configuration Parsing\"]\n        Workers[\"Worker Threads\"]\n        Logging[\"Logging System\"]\n    end\n    \n    subgraph \"Performance Monitoring\"\n        MSRInit[\"initialize_dev_msr()\\ninitialize_cpu_hfm_mhz()\"]\n        ReadMSR[\"read_msr()\"]\n        CalcDiff[\"cpu_get_diff_*()\"]\n        CalcMetrics[\"Calculate Performance Metrics\"]\n    end\n    \n    subgraph \"Hardware Interface\"\n        MSRFiles[\"/dev/cpu/*/msr Files\"]\n        CPUMSR[\"CPU MSR Registers\"]\n    end\n    \n    Config --\u003e Workers\n    Workers --\u003e Logging\n    \n    Workers --\u003e MSRInit\n    Workers --\u003e ReadMSR\n    ReadMSR --\u003e CalcDiff\n    CalcDiff --\u003e CalcMetrics\n    CalcMetrics --\u003e Logging\n    \n    MSRInit --\u003e MSRFiles\n    ReadMSR --\u003e MSRFiles\n    MSRFiles --\u003e CPUMSR\n```\n\n**Performance Monitoring Integration**\n\nSources: [src/perf_msr.c:1-122](), [src/perf_msr.h:15-38]()\n\n## Performance Metrics Provided\n\nThe subsystem enables the calculation of several important CPU performance metrics:\n\n1. **CPU Frequency** - Calculated using the ratio of APERF and MPERF counters multiplied by the high frequency mode (HFM) value\n2. **CPU Utilization** - Calculated using the ratio of MPERF and TSC counters\n3. **Performance Efficiency** - Can be derived using PPERF counter data\n4. **Timestamp** - Provided by the TSC counter for accurate timing references\n\nThese metrics provide a comprehensive view of CPU behavior during stress testing, enabling detailed analysis of power and performance characteristics.\n\nSources: [src/perf_msr.h:22-27](), [src/perf_msr.c:50-65]()"])</script><script>self.__next_f.push([1,"23:T26cf,"])</script><script>self.__next_f.push([1,"# Power Monitoring with RAPL\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [src/logger.c](src/logger.c)\n- [src/perf_msr.c](src/perf_msr.c)\n- [src/psst.c](src/psst.c)\n\n\u003c/details\u003e\n\n\n\n## Introduction\n\nThis document explains how the PSST (Power Stress and Shaping Tool) utilizes Intel's Running Average Power Limit (RAPL) interface to monitor power consumption across various hardware domains. RAPL is a feature available in modern Intel processors that provides energy consumption data, which can be used to calculate power usage over time.\n\nFor information about power shaping functions that control CPU utilization patterns, see [Power Shaping Functions](#5).\n\nSources: [src/logger.c:364-405](), [src/psst.c:343-366]()\n\n## RAPL Overview\n\nRunning Average Power Limit (RAPL) is an Intel hardware feature introduced with the Sandy Bridge architecture that provides energy consumption counters accessible through Model Specific Registers (MSRs) or the Linux sysfs interface. PSST uses the sysfs interface to access these energy counters, which allows the tool to monitor power consumption without requiring direct MSR access.\n\nRAPL exposes energy information for multiple power domains:\n\n| Domain | Description | sysfs Path Pattern |\n|--------|-------------|-------------------|\n| Package | Total SoC power domain (up to 4 packages) | intel-rapl:X/energy_uj |\n| Core (PP0) | CPU cores power domain | intel-rapl:X/intel-rapl:X:0/energy_uj |\n| Uncore/GPU (PP1) | Integrated graphics and uncore components | intel-rapl:X/intel-rapl:X:1/energy_uj |\n| DRAM | Memory controller and DRAM | intel-rapl:X/intel-rapl:X:2/energy_uj |\n\nSources: [src/logger.c:67-78](), [src/logger.c:364-405]()\n\n## RAPL Architecture in PSST\n\n### RAPL Domain Access Diagram\n\n```mermaid\ngraph TD\n    PSST[\"PSST Application\"]\n    Logger[\"logger.c: Logging System\"]\n    RAPL[\"rapl.c: Power Measurement\"]\n    Sysfs[\"Linux sysfs Interface\"]\n    \n    PSST --\u003e Logger\n    Logger --\u003e RAPL\n    RAPL --\u003e Sysfs\n    \n    subgraph \"RAPL Energy Domains\"\n        Package[\"Package Energy (0-3)\"]\n        Core[\"Core Energy (PP0)\"]\n        Uncore[\"Uncore/GPU Energy (PP1)\"]\n        DRAM[\"DRAM Energy\"]\n    end\n    \n    Sysfs --\u003e Package\n    Sysfs --\u003e Core\n    Sysfs --\u003e Uncore\n    Sysfs --\u003e DRAM\n```\n\nPSST accesses RAPL data through a structured approach:\n\n1. During initialization, PSST discovers available RAPL domains using the `find_path` function\n2. File descriptors for each domain are opened and stored in the column descriptors\n3. The logging subsystem periodically reads energy values from these file descriptors\n4. Power calculations are performed based on energy differences between readings\n\nSources: [src/logger.c:364-405](), [src/logger.c:521-667]()\n\n## RAPL Initialization\n\nDuring startup, PSST checks for the availability of each RAPL domain by searching for the corresponding sysfs entries:\n\n```mermaid\nsequenceDiagram\n    participant Initialization as \"initialize_logger()\"\n    participant FileSystem as \"Linux Filesystem\"\n    \n    Initialization-\u003e\u003eFileSystem: find_path(BASE_PATH_RAPL, \"name\", \"package-0\", \"energy_uj\", path)\n    FileSystem--\u003e\u003eInitialization: Return path or error\n    \n    alt Path found\n        Initialization-\u003e\u003eInitialization: Set rapl_pp0_supported = 1\n        Initialization-\u003e\u003eFileSystem: Open file descriptor for reading\n    else Path not found\n        Initialization-\u003e\u003eInitialization: Set report_enabled = 0 for this column\n        Initialization-\u003e\u003eInitialization: Set rapl_pp0_supported = 0\n    end\n    \n    Note over Initialization,FileSystem: Similar checks for other domains (package 1-3, core, uncore, dram)\n```\n\nThis process repeats for each RAPL domain. If a domain is not available on the current system, the corresponding column in the log output will be disabled.\n\nSources: [src/logger.c:336-428]()\n\n## Power Calculation from Energy Readings\n\nRAPL provides energy counters, not direct power readings. PSST calculates power consumption by measuring the change in energy over time:\n\n### Power Calculation Process\n\n```mermaid\nflowchart TD\n    Start[\"Start do_logging()\"]\n    ReadEnergy[\"Read Current Energy Value\"]\n    CalcDiff[\"Calculate Energy Difference:\n    diff = current_energy - initial_energy\"]\n    CalcPower[\"Calculate Power:\n    power = diff / poll_period\"]\n    Convert[\"Convert to mWatt\"]\n    Store[\"Store in Column Value\"]\n    \n    Start --\u003e ReadEnergy\n    ReadEnergy --\u003e CalcDiff\n    CalcDiff --\u003e CalcPower\n    CalcPower --\u003e Convert\n    Convert --\u003e Store\n```\n\nFor each RAPL domain, PSST:\n\n1. Reads the current energy value in microjoules (uJ)\n2. Calculates the difference from the previous or initial reading\n3. Divides by the poll period to get power in watts\n4. Converts to milliwatts for logging\n\nThe code for package power calculation looks like this:\n```c\n// For Package 0 power\nif (first_log)\n    soc_initial_energy[pkg_num] = atoll(buf);\n\nsoc_diff_uj[pkg_num] = atoll(buf) - soc_initial_energy[pkg_num];\n\ncol_desc[i].value = (float) rapl_ediff_pkg0(atoll(buf))/\n                    configpv.poll_period;\n```\n\nSources: [src/logger.c:611-667]()\n\n## RAPL Data in Logging System\n\nPSST logs the calculated power values in a structured CSV format. The relevant columns for RAPL data include:\n\n| Column Name | Description | Units | Definition |\n|-------------|-------------|-------|------------|\n| pwrPkg0-3 | Package power (up to 4 packages) | mWatt | Total SoC power consumption |\n| PwrCore | Core power (PP0) | mWatt | Power consumed by CPU cores |\n| PwrGpu | Uncore/GPU power (PP1) | mWatt | Power consumed by integrated graphics |\n| PwrDram | DRAM power | mWatt | Power consumed by memory controller and DRAM |\n\nThese columns are defined in the `col_desc` array with appropriate formatting:\n\n```c\nINIT_COL(1, pwrPkg0, [mWatt], 8.2, 1, NORMAL_FD, 0),\nINIT_COL(1, PwrCore, [mWatt], 8.2, 1, NORMAL_FD, 0),\nINIT_COL(1, PwrGpu, [mWatt], 8.2, 1, NORMAL_FD, 0),\nINIT_COL(1, PwrDram, [mWatt], 7.2, 1, NORMAL_FD, 0),\n```\n\nSources: [src/logger.c:51-83](), [src/logger.c:675-836]()\n\n## Energy Summary and Reporting\n\nAt the end of a run, PSST calculates and reports a summary of energy consumption:\n\n```mermaid\nsequenceDiagram\n    participant WorkThread as \"Worker Thread\"\n    participant Logger as \"Logger System\"\n    participant Output as \"Console Output\"\n    \n    WorkThread-\u003e\u003eLogger: Calculate total energy statistics\n    \n    Logger-\u003e\u003eOutput: Print duration summary\n    Note over Logger,Output: \"Duration: X ms. poll: Y ms. samples: Z\"\n    \n    alt RAPL PP0 supported\n        Logger-\u003e\u003eOutput: Print average SOC power\n        Logger-\u003e\u003eOutput: Print total SOC energy\n        Logger-\u003e\u003eOutput: Print average CPU power\n        Logger-\u003e\u003eOutput: Print total CPU energy\n    end\n```\n\nThe summary displays:\n- Total duration of the test\n- Polling period and number of samples collected\n- Average power consumption (in watts)\n- Total energy consumed (in millijoules)\n\nExample output:\n```\nDuration: 5000 ms. poll: 100 ms. samples: 50\nApplicable to SOC\n    Avg soc power: 15.423 W\n    Energy consumed (soc): 77115.000 mJ\nApplicable to CPU\n    Avg cpu power: 9.871 W\n    Energy consumed (cpu): 49355.000 mJ\n```\n\nSources: [src/psst.c:343-367]()\n\n## RAPL Limitations and Considerations\n\nWhen working with the RAPL interface in PSST, consider the following:\n\n1. **Domain Availability**: Not all RAPL domains are available on all processors. PSST checks availability during initialization and disables columns for unsupported domains.\n\n2. **Energy Counter Wrapping**: RAPL energy counters are typically 32-bit registers that can wrap around. The `rapl_ediff_*` functions handle this wrapping to provide accurate energy differences.\n\n3. **Sampling Resolution**: The accuracy of power measurements depends on the polling interval configured (`poll_period`). Shorter intervals provide more granular data but may increase system overhead.\n\n4. **System Requirements**: RAPL access through sysfs requires:\n   - Linux kernel with RAPL support enabled\n   - User with sufficient privileges (typically root)\n\nSources: [src/logger.c:107-133](), [src/psst.c:400-418]()\n\n## Integration with Performance Metrics\n\nPSST correlates RAPL power data with performance metrics collected through MSRs:\n\n```mermaid\ngraph TD\n    RAPL[\"RAPL Power Monitoring\"]\n    Perf[\"Performance Monitoring\"]\n    Logger[\"Logging System\"]\n    Analysis[\"Energy Efficiency Analysis\"]\n    \n    RAPL --\u003e|\"Power data\"| Logger\n    Perf --\u003e|\"Performance data\"| Logger\n    Logger --\u003e Analysis\n    \n    subgraph \"Performance Metrics\"\n        Freq[\"CPU Frequency\"]\n        Load[\"CPU Utilization\"]\n        ScaleFactor[\"Performance Scaling Factor\"]\n        NormPerf[\"Normalized Performance\"]\n    end\n    \n    subgraph \"Power Metrics\"\n        PkgPower[\"Package Power\"]\n        CorePower[\"Core Power\"]\n        UncorePower[\"Uncore Power\"]\n        DRAMPower[\"DRAM Power\"]\n    end\n    \n    Perf --\u003e Freq\n    Perf --\u003e Load\n    Perf --\u003e ScaleFactor\n    Perf --\u003e NormPerf\n    \n    RAPL --\u003e PkgPower\n    RAPL --\u003e CorePower\n    RAPL --\u003e UncorePower\n    RAPL --\u003e DRAMPower\n```\n\nThis integration allows users to analyze the relationship between power consumption and performance, enabling optimization of power-performance tradeoffs.\n\nSources: [src/logger.c:457-518](), [src/perf_msr.c:26-121]()\n\n## Conclusion\n\nThe RAPL power monitoring capabilities in PSST provide detailed insights into power consumption across various hardware domains. This information is valuable for:\n\n1. Understanding the power characteristics of workloads\n2. Evaluating the effects of different power shaping patterns on energy consumption\n3. Identifying potential areas for power optimization\n4. Testing the thermal and power behavior of Intel processors under controlled stress conditions\n\nFor information about how to use this data in the context of power shaping and stress testing, see [Use Cases and Examples](#9).\n\nSources: [src/psst.c:353-367]()"])</script><script>self.__next_f.push([1,"24:T2c28,"])</script><script>self.__next_f.push([1,"# Developer Guide\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [Makefile](Makefile)\n- [src/psst.c](src/psst.c)\n- [src/psst.h](src/psst.h)\n\n\u003c/details\u003e\n\n\n\nThis developer guide provides detailed instructions for modifying and extending the Power Stress and Shaping Tool (PSST). It is intended for developers who want to contribute to the codebase or customize PSST for specific testing scenarios. For basic usage instructions, refer to [Getting Started](#1.2).\n\n## Development Environment Setup\n\nTo set up your environment for PSST development:\n\n1. Clone the repository:\n   ```bash\n   git clone https://github.com/intel/psst.git\n   cd psst\n   ```\n\n2. Install dependencies:\n   - GCC compiler\n   - pthread library\n   - math library (libm)\n   - rt library\n\n3. Build the project:\n   ```bash\n   make\n   ```\n\nThe build process uses the Makefile in the root directory to compile source files from the `src` directory.\n\nSources: [Makefile:1-41]()\n\n## Code Organization\n\n### Directory Structure\n\n```\npsst/\n├── src/                  # Source code files\n│   ├── psst.c            # Main program logic\n│   ├── psst.h            # Common structures and definitions\n│   ├── parse_config.c    # Configuration parsing\n│   ├── logger.c          # Logging system\n│   ├── rapl.c            # Power measurement via RAPL\n│   └── perf_msr.c        # Performance counters via MSR\n└── Makefile              # Build configuration\n```\n\n### Component Architecture\n\n```mermaid\ngraph TB\n    subgraph \"Core Components\"\n        PSSTMain[\"psst.c - Main Program\"]\n        PSSTHeader[\"psst.h - Data Structures\"]\n        ConfigParser[\"parse_config.c - Configuration\"]\n    end\n    \n    subgraph \"Monitoring Components\"\n        Logger[\"logger.c - Logging System\"]\n        RAPL[\"rapl.c - Power Measurement\"]\n        PerfMSR[\"perf_msr.c - Performance Counters\"]\n    end\n    \n    PSSTMain --\u003e PSSTHeader\n    PSSTMain --\u003e ConfigParser\n    PSSTMain --\u003e Logger\n    PSSTMain --\u003e RAPL\n    PSSTMain --\u003e PerfMSR\n    \n    Logger --\u003e RAPL\n    Logger --\u003e PerfMSR\n```\n\nSources: [src/psst.c:1-40](), [src/psst.h:1-18]()\n\n## Core Data Structures\n\nPSST uses several key data structures to manage power shaping and thread execution:\n\n### Power Shape Structures\n\n```mermaid\nclassDiagram\n    class \"power_shape_name\" {\n        \u003c\u003cenum\u003e\u003e\n        SINGLE_STEP\n        SINOSOID\n        STAIR_CASE\n        SINGLE_PULSE\n        LINEAR_RAMP\n        SAW_TOOTH\n        GROWTH_CURVE\n        DECAY_CURVE\n        NONE\n    }\n    \n    class \"power_shape_attr_t\" {\n        \u003c\u003cunion\u003e\u003e\n        +single_step_t single_step\n        +staircase_t staircase\n        +sinosoid_t sinosoid\n        +singlepulse_t single_pulse\n        +linear_ramp_t linear_ramp\n        +saw_tooth_t saw_tooth\n        +growth_curve_t growth_curve\n        +decay_curve_t decay_curve\n    }\n    \n    class \"ps_t\" {\n        +power_shape_name psn\n        +power_shape_attr_t psa\n        +timespec last\n        +timespec begin\n    }\n    \n    class \"data_t\" {\n        +float duty_cycle\n        +int affinity_pr\n        +power_shape_name psn\n        +power_shape_attr_t psa\n    }\n    \n    \"ps_t\" --\u003e \"power_shape_name\"\n    \"ps_t\" --\u003e \"power_shape_attr_t\"\n    \"data_t\" --\u003e \"power_shape_name\"\n    \"data_t\" --\u003e \"power_shape_attr_t\"\n```\n\nSources: [src/psst.h:35-88]()\n\n## Thread Model and Execution Flow\n\nPSST uses a multi-threaded architecture to manage CPU stress and logging:\n\n```mermaid\nsequenceDiagram\n    participant Main as \"main()\"\n    participant Worker as \"work_fn()\"\n    participant PowerShape as \"power_shaping()\"\n    participant Logging as \"do_logging()\"\n    participant IOThread as \"page_write_disk()\"\n    \n    Main-\u003e\u003eMain: Parse command line args\n    Main-\u003e\u003eMain: Initialize MSR interfaces\n    Main-\u003e\u003eIOThread: Create I/O thread\n    \n    loop For each CPU in mask\n        Main-\u003e\u003eWorker: Create worker thread\n    end\n    \n    loop Until exit_cpu_thread\n        Worker-\u003e\u003ePowerShape: Calculate duty cycle\n        PowerShape-\u003e\u003eWorker: Return updated duty cycle\n        Worker-\u003e\u003eWorker: Perform CPU work\n        Worker-\u003e\u003eLogging: Log performance data\n        Worker-\u003e\u003eWorker: Sleep during off-time\n    end\n    \n    Main-\u003e\u003eMain: Clean up resources\n    Main-\u003e\u003eIOThread: Signal exit\n```\n\nSources: [src/psst.c:226-371](), [src/psst.c:394-545]()\n\n## Power Shaping Implementation\n\nThe power shaping module is a key component that controls CPU utilization patterns. Understanding this module is essential for developers who want to modify or extend PSST's capabilities.\n\n### Power Shape Functions\n\nThe `power_shaping()` function in [src/psst.c:143-222]() implements different algorithmic patterns to control CPU duty cycles over time:\n\n| Shape Type | Description | Implementation |\n|------------|-------------|----------------|\n| SINGLE_STEP | Constant load at specified duty cycle | Returns fixed value |\n| SINOSOID | Sinusoidal wave pattern | Uses sine function with configurable amplitude and wavelength |\n| STAIR_CASE | Step increases at regular intervals | Increments duty cycle by step height at each interval |\n| SINGLE_PULSE | Single spike of activity | Raises to specified height for duration, then returns to minimum |\n| LINEAR_RAMP | Linear increase/decrease | Applies linear slope over time |\n| SAW_TOOTH | Triangle wave pattern | Implements linear ramp with direction reversal at boundaries |\n| NONE | No shaping | Used for logging-only threads |\n\nThe function takes a `ps_t` structure containing the shape type and parameters, and updates the duty cycle value based on the elapsed time and shape algorithm.\n\nSources: [src/psst.c:143-222](), [src/psst.h:35-44]()\n\n## Extending PSST\n\n### Adding a New Power Shape\n\nTo add a new power shape function to PSST, follow these steps:\n\n1. **Update the power_shape_name enum** in [src/psst.h:35-44]() by adding your new shape type:\n\n   ```c\n   enum power_shape_name {\n       SINGLE_STEP,\n       /* existing shapes */\n       YOUR_NEW_SHAPE,  /* Add your shape here */\n       NONE\n   };\n   ```\n\n2. **Define parameters** for your shape by adding a new struct to the `power_shape_attr_t` union in [src/psst.h:47-74]():\n\n   ```c\n   typedef union {\n       /* existing structs */\n       struct your_new_shape_t {\n           float param1;\n           int param2;\n           /* Add parameters needed for your shape */\n       } your_new_shape;\n   } power_shape_attr_t;\n   ```\n\n3. **Implement the shape algorithm** in the `power_shaping()` function in [src/psst.c:143-222]() by adding a new case:\n\n   ```c\n   switch (ps-\u003epsn) {\n       /* existing cases */\n       case YOUR_NEW_SHAPE:\n           /* Your implementation here */\n           /* Calculate new duty cycle (*v_unit) based on time and parameters */\n           break;\n   ```\n\n4. **Update the command-line parsing** in `parse_power_shape()` (in parse_config.c) to recognize your shape.\n\n### Example: Shape Function Implementation Flow\n\n```mermaid\nflowchart TD\n    subgraph \"Power Shape Implementation\"\n        Start[\"Entry: power_shaping()\"]\n        Switch[\"Switch on shape type (ps-\u003epsn)\"]\n        CalcTime[\"Calculate elapsed time\"]\n        UpdateDuty[\"Update duty cycle\"]\n        ReturnFlag[\"Return change flag\"]\n        \n        Start --\u003e Switch\n        Switch --\u003e |\"Case: YOUR_NEW_SHAPE\"| CalcTime\n        CalcTime --\u003e UpdateDuty\n        UpdateDuty --\u003e ReturnFlag\n    end\n    \n    subgraph \"Integration Points\"\n        Config[\"Parse config\"]\n        WorkFn[\"work_fn() calls power_shaping()\"]\n        Apply[\"Apply duty cycle to CPU\"]\n        \n        Config --\u003e WorkFn\n        WorkFn --\u003e Apply\n    end\n```\n\nSources: [src/psst.c:143-222](), [src/psst.h:35-74]()\n\n### Adding a New CPU Work Function\n\nThe current `cpu_work()` function in [src/psst.c:54-58]() is a placeholder. To implement a different type of CPU workload:\n\n1. Modify the `cpu_work()` function to perform your desired type of stress:\n\n   ```c\n   static void cpu_work(int on_time_us)\n   {\n       /* Your CPU-intensive work here */\n       /* Use on_time_us to scale work if needed */\n   }\n   ```\n\n2. Alternatively, add a new work function and call it from the appropriate place in `work_fn()` [src/psst.c:226-371]().\n\n## Thread Management\n\nThe thread management system in PSST coordinates worker threads (one per CPU) and an I/O thread for logging:\n\n```mermaid\nflowchart LR\n    subgraph \"Thread Creation\"\n        Main[\"main()\"]\n        IOThread[\"I/O Thread\\npage_write_disk()\"]\n        WorkerThreads[\"Worker Threads\\nwork_fn()\"]\n        \n        Main --\u003e |\"pthread_create()\"| IOThread\n        Main --\u003e |\"pthread_create() for each CPU\"| WorkerThreads\n    end\n    \n    subgraph \"Thread Communication\"\n        Buffer[
