\",\"static/chunks/2921-a0fb53c5b64283c9.js?dpl=dpl_7Y76KdZ6v8HdrAdxiSqwvSsgiD7k\",\"5389\",\"static/chunks/5389-6bf4a485c219de8a.js?dpl=dpl_7Y76KdZ6v8HdrAdxiSqwvSsgiD7k\",\"2933\",\"static/chunks/app/%5Borg%5D/%5Brepo%5D/layout-9163ebec1dd61782.js?dpl=dpl_7Y76KdZ6v8HdrAdxiSqwvSsgiD7k\"],\"HeaderWrapperWithSuspense\"]\n"])</script><script>self.__next_f.push([1,"16:I[90140,[\"1146\",\"static/chunks/1146-010edb6118c49ebe.js?dpl=dpl_7Y76KdZ6v8HdrAdxiSqwvSsgiD7k\",\"9255\",\"static/chunks/9255-9a6edc798663d27f.js?dpl=dpl_7Y76KdZ6v8HdrAdxiSqwvSsgiD7k\",\"1603\",\"static/chunks/1603-ae4cc6db2f20d70a.js?dpl=dpl_7Y76KdZ6v8HdrAdxiSqwvSsgiD7k\",\"2180\",\"static/chunks/2180-84d78667b8e3c90e.js?dpl=dpl_7Y76KdZ6v8HdrAdxiSqwvSsgiD7k\",\"1224\",\"static/chunks/1224-8478446f51f3559e.js?dpl=dpl_7Y76KdZ6v8HdrAdxiSqwvSsgiD7k\",\"2543\",\"static/chunks/2543-c77192614e6cf8fc.js?dpl=dpl_7Y76KdZ6v8HdrAdxiSqwvSsgiD7k\",\"2921\",\"static/chunks/2921-a0fb53c5b64283c9.js?dpl=dpl_7Y76KdZ6v8HdrAdxiSqwvSsgiD7k\",\"5389\",\"static/chunks/5389-6bf4a485c219de8a.js?dpl=dpl_7Y76KdZ6v8HdrAdxiSqwvSsgiD7k\",\"2933\",\"static/chunks/app/%5Borg%5D/%5Brepo%5D/layout-9163ebec1dd61782.js?dpl=dpl_7Y76KdZ6v8HdrAdxiSqwvSsgiD7k\"],\"WikiContextProvider\"]\n"])</script><script>self.__next_f.push([1,"17:T26e4,"])</script><script>self.__next_f.push([1,"# Overview\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [README.md](README.md)\n- [psst.1](psst.1)\n- [src/psst.c](src/psst.c)\n\n\u003c/details\u003e\n\n\n\nPSST (Power Stress and Shaping Tool) is a controlled power \"virus\" designed for stress testing and analyzing Intel x86 SoCs (System on Chips). The tool allows users to subject CPUs to different run-time-varying utilization levels following specific patterns for power and thermal analysis. PSST implements a controlled duty-cycling approach to create precise CPU load patterns while simultaneously monitoring system behavior with minimal observation impact.\n\nFor detailed installation instructions, see [Installation and Building](#1.1). For getting started with basic usage, see [Getting Started](#1.2).\n\n## Architecture Overview\n\nPSST is built around a multi-threaded architecture that implements controlled CPU stress patterns while collecting performance and power metrics. The system creates worker threads with specific CPU affinities to perform configurable duty-cycling, following various power shaping patterns.\n\n### Component Architecture\n\n```mermaid\ngraph TD\n    Main[\"psst.c - Main Program\"] --\u003e Config[\"parse_config.c - Configuration Parser\"]\n    Main --\u003e Logger[\"logger.c - Logging System\"]\n    Main --\u003e PerfMSR[\"perf_msr.c - Performance Counters\"]\n    Main --\u003e RAPL[\"rapl.c - Power Measurement\"]\n    \n    Config --\u003e Main\n    Logger --\u003e PerfMSR\n    PerfMSR --\u003e RAPL\n    \n    subgraph \"Core Components\"\n        Main\n        Config\n        Logger\n    end\n    \n    subgraph \"Hardware Interface Components\"\n        PerfMSR\n        RAPL\n    end\n```\n\nSources: [src/psst.c:18-40](), [README.md:130-143]()\n\n## Key Features\n\n### Power Shaping Functions\n\nPSST's primary feature is its ability to generate controlled CPU load patterns using various \"power shaping functions\". These functions determine how CPU utilization varies over time, allowing for precise testing of system response under different load conditions.\n\n```mermaid\ngraph TD\n    PS[\"power_shaping() Function\"]\n    \n    PS --\u003e Functions[\"Power Shape Functions\"]\n    Functions --\u003e SS[\"SINGLE_STEP\"]\n    Functions --\u003e SIN[\"SINOSOID\"]\n    Functions --\u003e SC[\"STAIR_CASE\"]\n    Functions --\u003e SP[\"SINGLE_PULSE\"]\n    Functions --\u003e LR[\"LINEAR_RAMP\"]\n    Functions --\u003e ST[\"SAW_TOOTH\"]\n    \n    PS --\u003e DutyCycle[\"CPU Duty Cycle\"]\n    DutyCycle --\u003e CPULoad[\"CPU Load\"]\n    \n    subgraph \"Load Patterns\"\n        SS --- SSP[\"Flat constant load\"]\n        SIN --- SINP[\"Sinusoidal wave\"]\n        SC --- SCP[\"Step increases\"]\n        SP --- SPP[\"Single spike\"]\n        LR --- LRP[\"Linear increase\"]\n        ST --- STP[\"Sawtooth pattern\"]\n    end\n```\n\nSources: [src/psst.c:143-222](), [README.md:96-102]()\n\nThe power shaping functionality is implemented in the `power_shaping()` function in [src/psst.c:143-222](). Each shape type generates a different pattern of CPU utilization:\n\n| Shape Function | Description | Parameters |\n|----------------|-------------|------------|\n| SINGLE_STEP | Constant load at specified level | v: load step height [C0%] |\n| SINOSOID | Sinusoidal wave pattern | w: wavelength [seconds], a: amplitude (max load %) |\n| STAIR_CASE | Step increases in load | v: load step height [C0%], u: step length (sec) |\n| SINGLE_PULSE | Single spike of load | v: load step height [C0%], u: step length (sec) |\n| LINEAR_RAMP | Linear increase in load | m: slope (load/sec) |\n| SAW_TOOTH | Sawtooth pattern of load | m: slope (load/sec), a: max amplitude (load %) |\n\nSources: [psst.1:49-71](), [README.md:96-102]()\n\n### Multi-Threading Model\n\nPSST employs a multi-threaded architecture with dedicated worker threads for CPU stress and a separate I/O thread for logging.\n\n```mermaid\nsequenceDiagram\n    participant Main as \"Main Thread\"\n    participant Worker as \"Worker Threads\"\n    participant IO as \"I/O Thread\"\n    participant CPU as \"CPU Hardware\"\n    participant Logger as \"Logger System\"\n    \n    Main-\u003e\u003eMain: Parse configuration\n    Main-\u003e\u003eWorker: Create worker threads with CPU affinity\n    Main-\u003e\u003eIO: Create I/O thread for logging\n    \n    loop Until completion or signal\n        Worker-\u003e\u003eWorker: Calculate duty cycle via power_shaping()\n        Worker-\u003e\u003eCPU: Perform cpu_work() during on-time\n        Worker-\u003e\u003eLogger: Collect \u0026 buffer data (do_logging())\n        Worker-\u003e\u003eWorker: Sleep during off-time\n    end\n    \n    Logger-\u003e\u003eIO: Signal when buffer full\n    IO-\u003e\u003eLogger: Write buffer to disk\n    \n    Main-\u003e\u003eMain: Wait for threads to complete\n    Main-\u003e\u003eMain: Clean up resources\n```\n\nSources: [src/psst.c:226-371](), [src/psst.c:394-545]()\n\nThe main thread initializes the system, parses configuration, and creates worker threads with specific CPU affinities. Each worker thread executes cycles of work and sleep periods based on the configured power shape function, controlling the CPU load. The logging system collects performance and power data, which is buffered and written to disk by a dedicated I/O thread.\n\n### Data Flow\n\n```mermaid\nflowchart LR\n    User[\"User\"] --\u003e |\"Command Line Arguments\"| Config[\"Configuration Parsing\"]\n    Config --\u003e Main[\"Main Program\"]\n    \n    Main --\u003e |\"Creates\"| WorkerThreads[\"Worker Threads\"]\n    Main --\u003e |\"Creates\"| IOThread[\"I/O Thread\"]\n    \n    WorkerThreads --\u003e |\"CPU Work\"| Hardware[\"CPU Hardware\"]\n    WorkerThreads --\u003e |\"Read Counters\"| MSR[\"MSR Interface\"]\n    WorkerThreads --\u003e |\"Read Power\"| RAPL[\"RAPL Interface\"]\n    \n    WorkerThreads --\u003e |\"Log Data\"| Buffer[\"Log Buffer\"]\n    Buffer --\u003e IOThread\n    IOThread --\u003e |\"Write\"| LogFile[\"Log File\"]\n    \n    MSR --\u003e Hardware\n    RAPL --\u003e Hardware\n```\n\nSources: [src/psst.c:394-545](), [README.md:52-66]()\n\n## System Requirements and Dependencies\n\nPSST has dependencies on certain x86 model-specific registers, which requires loading the msr.ko kernel module:\n\n```bash\nsudo modprobe msr\n```\n\nAdditionally, for power monitoring functionality, the system needs an up-to-date kernel with the intel_rapl driver that supports the specific Intel platform being used.\n\nSources: [README.md:11-24]()\n\n## Command Line Options\n\nPSST supports various command-line options to control its behavior:\n\n| Option | Description |\n|--------|-------------|\n| `-C, --cpumask CPUMASK` | Hexadecimal bit mask of CPU selected (e.g., a1 selects CPU 0, 5, 7) |\n| `-p, --poll-period PERIOD` | Specifies logging period in milliseconds (default: 500 ms) |\n| `-d, --duration DURATION` | Specifies run duration in milliseconds (default: 3600000, 1 hour) |\n| `-l, --log-file PATH` | Specifies the log file path (default: /var/log/psst.csv) |\n| `-s, --shape-func SHAPE,ARG` | Specifies power shape function and arguments |\n| `-v, --verbose` | Enables verbose mode |\n| `-V, --version` | Prints version information |\n| `-T, --track-max-cpu` | Tracks the CPU with maximum frequency during polling |\n| `-h, --help` | Prints help information |\n\nSources: [psst.1:20-72](), [README.md:80-109]()\n\n## Logging and Monitoring System\n\nPSST collects performance metrics from various sources (MSRs, RAPL, sysfs) and logs them to a CSV file. The logging system uses a double-buffering mechanism for efficient, asynchronous logging that minimizes impact on the monitoring process.\n\n```mermaid\ngraph TD\n    Logger[\"do_logging() Function\"]\n    \n    subgraph \"Data Sources\"\n        MSR[\"MSR Registers\"]\n        RAPL[\"RAPL Interface\"]\n        Sysfs[\"Sysfs Entries\"]\n    end\n    \n    subgraph \"Metrics Collected\"\n        Time[\"Timestamp\"]\n        Freq[\"CPU Frequency\"]\n        Load[\"CPU Load\"]\n        PkgPower[\"Package Power\"]\n        CorePower[\"Core Power\"]\n        DRAMPower[\"DRAM Power\"]\n        Temp[\"Temperature\"]\n    end\n    \n    subgraph \"Logging System\"\n        Buffer[\"Memory Buffer\"]\n        IOThread[\"I/O Thread\"]\n        LogFile[\"CSV Log File\"]\n    end\n    \n    MSR --\u003e Logger\n    RAPL --\u003e Logger\n    Sysfs --\u003e Logger\n    \n    Logger --\u003e Metrics[\"Collected Metrics\"]\n    Logger --\u003e Buffer\n    \n    Buffer --\u003e |\"When full\"| IOThread\n    IOThread --\u003e LogFile\n```\n\nSources: [README.md:39-66]()\n\nThe log file contains columns for various metrics, including:\n- Time (ms)\n- CPU Frequency (MHz)\n- CPU Load (C0%)\n- Package Power (mWatt)\n- Core Power (mWatt)\n- GPU Power (mWatt)\n- DRAM Power (mWatt)\n- CPU Temperature (°C)\n- SoC Temperature (°C)\n\nFor detailed information about the log file format and its contents, see [Log File Format](#3.1).\n\n## Use Cases\n\nPSST can be used for various purposes, including:\n\n1. **Low-overhead Logging**: Using minimal CPU resources to log system parameters at small polling intervals (milliseconds)\n2. **Power Management Analysis**: Studying CPU power management and governor behavior under different load patterns\n3. **Thermal Analysis**: Monitoring thermal characteristics under controlled load conditions\n4. **Performance Scaling Analysis**: Examining how the system responds to different load patterns\n\nFor more detailed use cases and examples, see [Use Cases and Examples](#9).\n\nSources: [README.md:26-32](), [psst.1:8-19]()\n\n## Summary\n\nPSST provides a flexible framework for creating controlled, reproducible CPU stress patterns while simultaneously monitoring system behavior. Its key strengths include:\n\n1. **Modular Design**: Clear separation between configuration parsing, power shaping, worker thread management, and logging functions\n2. **Asynchronous Logging**: Efficient I/O that minimizes monitoring overhead\n3. **Flexible Power Shaping**: Multiple algorithmic patterns for creating varied CPU load profiles\n4. **Multi-threaded Architecture**: Parallel execution with dedicated worker threads and separate I/O thread\n5. **Low-level Hardware Access**: Direct interfacing with MSRs and RAPL for accurate measurements\n\nThis design makes PSST particularly useful for analyzing power management, thermal characteristics, and performance scaling of Intel processors under various load conditions.\n\nSources: [src/psst.c:1-16](), [README.md:1-10](), [psst.1:8-19]()"])</script><script>self.__next_f.push([1,"18:T186d,"])</script><script>self.__next_f.push([1,"# Installation and Building\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [Makefile](Makefile)\n- [README.md](README.md)\n\n\u003c/details\u003e\n\n\n\nThis document provides detailed instructions for installing and building the PSST (Power Stress and Shaping Tool) from source code. For information on how to use PSST after installation, see [Getting Started](#1.2).\n\n## System Requirements\n\nPSST is designed to run on x86 platforms, specifically targeting Intel processors. The tool requires access to model-specific registers (MSRs) and relies on Intel's Running Average Power Limit (RAPL) interface for power monitoring.\n\n### Hardware Requirements\n\n- Intel x86 processor that supports MSRs and RAPL\n- Sufficient permissions to access MSR devices and system information\n\n### Software Requirements\n\n- Linux operating system\n- GCC compiler or compatible alternative\n- Make build system\n- Required libraries: pthread, rt, math (typically included in standard Linux installations)\n\nSources: [Makefile:6-11]()\n\n## Dependencies\n\nPSST has several key dependencies that must be addressed before building and using the tool:\n\n### MSR Kernel Module\n\nThe tool relies on the MSR kernel module to access CPU model-specific registers. Load this module with:\n\n```bash\nsudo modprobe msr\n```\n\n### RAPL Support\n\nFor power monitoring functionality, ensure your kernel includes an up-to-date version of the intel_rapl driver that supports your CPU model. If you see the following message in dmesg output, you need to update your kernel or intel_rapl driver:\n\n```\nintel_rapl: driver does not support CPU family xxx model yyy\n```\n\nSources: [README.md:11-24]()\n\n## Build Process\n\nThe following diagram illustrates the build process for PSST:\n\n```mermaid\nflowchart TD\n    Clone[\"Clone Repository\"] --\u003e Make[\"Run Make\"]\n    Make --\u003e Compile[\"Compile Source Files\"]\n    Compile --\u003e Link[\"Link Object Files\"]\n    Link --\u003e Binary[\"Generate 'psst' Binary\"]\n    \n    subgraph \"Source Files\"\n        Parse[\"parse_config.c\"]\n        Logger[\"logger.c\"]\n        RAPL[\"rapl.c\"]\n        PerfMSR[\"perf_msr.c\"]\n        PSST[\"psst.c\"]\n    end\n    \n    Parse --\u003e Compile\n    Logger --\u003e Compile\n    RAPL --\u003e Compile\n    PerfMSR --\u003e Compile\n    PSST --\u003e Compile\n```\n\nSources: [Makefile:16-22]()\n\n### Building the Tool\n\n1. Clone the repository:\n   ```bash\n   git clone https://github.com/intel/psst.git\n   cd psst\n   ```\n\n2. Build the application:\n   ```bash\n   make\n   ```\n\nThe build process compiles the following source files and links them into the final executable:\n- parse_config.c - Command-line argument parsing\n- logger.c - Logging system\n- rapl.c - Power measurement via RAPL\n- perf_msr.c - Performance counters via MSR\n- psst.c - Main program logic\n\nSources: [Makefile:16-22](), [README.md:146-148]()\n\n## Installation\n\nAfter building PSST, you can install it system-wide using the following command:\n\n```bash\nsudo make install\n```\n\nThis will:\n1. Install the `psst` binary to `/usr/bin/`\n2. Install the man page to `/usr/share/man/man1/`\n\nThe installation process is depicted in the following diagram:\n\n```mermaid\nflowchart TD\n    Build[\"Build 'psst' Binary\"] --\u003e Install[\"sudo make install\"]\n    Install --\u003e Binary[\"Copy Binary to /usr/bin/psst\"]\n    Install --\u003e ManPage[\"Install Man Page to /usr/share/man/man1/psst.1.gz\"]\n    \n    Binary --\u003e Verify[\"Verify Installation\"]\n    ManPage --\u003e Verify\n    \n    Verify --\u003e|\"Success\"| Usage[\"Ready for Use\"]\n    Verify --\u003e|\"Failure\"| Troubleshoot[\"Troubleshooting\"]\n```\n\nSources: [Makefile:24-28]()\n\n## Verification\n\nTo verify that PSST has been built and installed correctly:\n\n1. Run the executable with the help flag:\n   ```bash\n   psst --help\n   ```\n\n2. You should see the usage information, similar to what's shown in the README.\n\n3. Check if the man page is installed correctly:\n   ```bash\n   man psst\n   ```\n\nSources: [README.md:80-103]()\n\n## Uninstallation\n\nIf you need to uninstall PSST, you can use:\n\n```bash\nsudo make uninstall\n```\n\nThis will remove the binary from `/usr/bin/psst`.\n\nTo clean build artifacts without uninstalling:\n\n```bash\nmake clean\n```\n\nSources: [Makefile:30-35]()\n\n## Build System Structure\n\nThe PSST build system is organized as follows:\n\n```mermaid\nflowchart LR\n    Makefile[\"Makefile\"] --\u003e |\"Defines\"| BuildRules[\"Build Rules\"]\n    BuildRules --\u003e CompileStep[\"Compile Step:\\n.c → .o\"]\n    BuildRules --\u003e LinkStep[\"Link Step:\\n.o → psst binary\"]\n    BuildRules --\u003e InstallStep[\"Install Step:\\npsst → /usr/bin\"]\n    \n    subgraph \"Source Tree\"\n        SRC[\"./src/\"]\n        SRC --\u003e PC[\"parse_config.c/.h\"]\n        SRC --\u003e LOG[\"logger.c/.h\"]\n        SRC --\u003e RAPL[\"rapl.c/.h\"]\n        SRC --\u003e PERF[\"perf_msr.c/.h\"]\n        SRC --\u003e PSST[\"psst.c/.h\"]\n    end\n    \n    CompileStep --\u003e |\"Uses\"| SRC\n```\n\nSources: [Makefile:1-41](), [README.md:130-143]()\n\n## Troubleshooting\n\n### Common Issues and Solutions\n\n1. **Missing MSR Module**\n   - Error: \"Failed to open /dev/cpu/x/msr\"\n   - Solution: Load the MSR module with `sudo modprobe msr`\n\n2. **RAPL Support Issues**\n   - Error: \"intel_rapl: driver does not support CPU family xxx model yyy\"\n   - Solution: Update your kernel to a version that supports your CPU model with RAPL\n\n3. **Compilation Errors**\n   - If you encounter compilation errors, ensure you have all required development packages installed:\n     ```bash\n     sudo apt-get install build-essential\n     ```\n\n4. **Permission Issues**\n   - PSST requires root permissions to access MSRs and some system files\n   - Always run with `sudo` when using the tool\n\nSources: [README.md:11-24]()\n\n## Build Configuration Options\n\nThe Makefile includes several configuration options that can be customized:\n\n| Option | Default | Description |\n|--------|---------|-------------|\n| VERSION | 2.1 | Current version of PSST |\n| BINDIR | /usr/bin | Installation directory for the binary |\n| MANDIR | /usr/share/man/man1 | Installation directory for the man page |\n| CC | gcc | C compiler to use |\n| CFLAGS | -D_LINUX_ -Wall -O2 -Wfloat-equal | Compiler flags |\n| DBG_CFLAGS | -DDEBUG -g -O0 | Debug compiler flags |\n\nTo override any of these settings, you can specify them on the command line:\n\n```bash\nmake CC=clang\n```\n\nSources: [Makefile:1-11]()"])</script><script>self.__next_f.push([1,"19:T2071,"])</script><script>self.__next_f.push([1,"# Getting Started\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [README.md](README.md)\n- [psst.1](psst.1)\n\n\u003c/details\u003e\n\n\n\nThis guide provides a quick start for using the Power Stress and Shaping Tool (PSST), a controlled power stress testing and monitoring utility for Intel SoCs. You'll learn how to run basic commands, apply different CPU load patterns, and monitor system power metrics. For detailed system architecture information, see [System Architecture](#2), and for comprehensive configuration options, see [Configuration and Command Line Options](#4).\n\n## Prerequisites\n\nBefore using PSST, ensure your system meets the following requirements:\n\n1. A relatively modern Intel x86 processor\n2. Linux operating system with root access\n3. MSR kernel module loaded\n4. Up-to-date intel_rapl driver (for power monitoring)\n\nTo load the MSR module, run:\n\n```bash\nsudo modprobe msr\n```\n\nIf you need to monitor power parameters, verify RAPL support:\n\n```bash\ndmesg | grep rapl\n```\n\nIf you see \"intel_rapl: driver does not support CPU family xxx model yyy,\" you'll need to update your kernel or intel_rapl driver.\n\nSources: [README.md:12-24]()\n\n## Basic Command Structure\n\nPSST follows a simple command-line syntax with various options to control its behavior:\n\n```bash\nsudo psst [options \u003cvalue\u003e]\n```\n\nRunning PSST without any arguments applies default settings:\n- Single-step power shape with 0.1 (10%) load\n- 500ms polling interval\n- 1-hour runtime\n- Logging to `/var/log/psst.csv`\n- Verbose mode enabled\n\n```mermaid\nflowchart LR\n    User[\"User Command\"]\n    Parse[\"parse_config.c\n    Parse Arguments\"]\n    Main[\"psst.c\n    Main Program\"]\n    Workers[\"Worker Threads\"]\n    Logger[\"logger.c\n    Log Data\"]\n    \n    User --\u003e Parse\n    Parse --\u003e Main\n    Main --\u003e Workers\n    Workers --\u003e |\"do_logging()\"| Logger\n    \n    subgraph \"Command Flow\"\n    Parse\n    Main\n    Workers\n    Logger\n    end\n```\n\n**Diagram: PSST Command Processing Flow**\n\nSources: [psst.1:4-19](), [README.md:80-109]()\n\n## Common Usage Scenarios\n\n### 1. System Monitoring with Minimal Overhead\n\nTo use PSST primarily for monitoring power and thermal parameters with minimal system impact:\n\n```bash\nsudo psst\n```\n\nThis applies a 10% CPU load while logging system metrics every 500ms.\n\n### 2. Controlled CPU Load Testing\n\nTo apply specific load patterns to selected CPUs:\n\n```bash\nsudo psst -s \u003cshape-function,parameters\u003e -C \u003ccpu-mask\u003e -p \u003cpoll-period\u003e -d \u003cduration\u003e\n```\n\n### 3. Multi-CPU Testing with Different Patterns\n\nTo stress different CPUs with different patterns simultaneously, launch multiple instances:\n\n```bash\nsudo psst -C 1 -s sinusoid,10,50 \u0026\nsudo psst -C 2 -s stair-case,20,5 \u0026\n```\n\nSources: [README.md:103-128](), [psst.1:73-84]()\n\n## Power Shaping Functions\n\nPSST supports various power shaping functions to create controlled CPU utilization patterns:\n\n```mermaid\nflowchart TD\n    Start[\"power_shaping()\"]\n    \n    Start --\u003e CheckType{\"Shape Type\"}\n    \n    CheckType --\u003e SS[\"single_step()\n    Fixed Constant Load\"]\n    CheckType --\u003e SIN[\"sinosoid()\n    Wave Pattern\"]\n    CheckType --\u003e SC[\"stair_case()\n    Stepped Increases\"]\n    CheckType --\u003e SP[\"single_pulse()\n    One-time Spike\"]\n    CheckType --\u003e LR[\"linear_ramp()\n    Gradual Increase\"]\n    CheckType --\u003e ST[\"saw_tooth()\n    Triangle Pattern\"]\n    \n    SS --\u003e DC[\"Duty Cycle\n    Controls CPU Usage\"]\n    SIN --\u003e DC\n    SC --\u003e DC\n    SP --\u003e DC\n    LR --\u003e DC\n    ST --\u003e DC\n```\n\n**Diagram: Power Shaping Functions and Their Patterns**\n\nThe table below summarizes available shape functions:\n\n| Shape Function | Arguments | Description | Example |\n|----------------|-----------|-------------|---------|\n| single-step | v | Fixed load at v% | `-s single-step,10` |\n| sinosoid | w,a | Sinusoidal wave with wavelength w seconds and amplitude a% | `-s sinosoid,15,50` |\n| stair-case | v,u | Stepped increases of v% every u seconds | `-s stair-case,10,5` |\n| single-pulse | v,u | Single spike of v% for u seconds | `-s single-pulse,80,3` |\n| linear-ramp | m | Linear increase at rate m% per second | `-s linear-ramp,2` |\n| saw-tooth | m,a | Ramp up at m% per second to max a%, then down | `-s saw-tooth,5,90` |\n\nSources: [psst.1:47-72](), [README.md:96-102]()\n\n## Key Command-Line Options\n\n| Option | Long Option | Description | Default |\n|--------|-------------|-------------|---------|\n| -C | --cpumask | Hexadecimal bit mask of CPUs to use | All online CPUs |\n| -p | --poll-period | Log polling interval in milliseconds | 500 ms |\n| -d | --duration | Total run duration in milliseconds | 3600000 (1 hour) |\n| -l | --log-file | Path to the output log file | /var/log/psst.csv |\n| -v | --verbose | Enable verbose output | Disabled unless no args |\n| -T | --track-max-cpu | Track CPU with max frequency | Disabled |\n| -s | --shape-func | Power shape function and arguments | single-step,0.1 |\n\nSources: [psst.1:20-72](), [README.md:85-102]()\n\n## Example Commands\n\n### Basic Monitoring\nMonitor system with minimal (10%) overhead:\n```bash\nsudo psst\n```\n\n### Linear CPU Load Ramp\nApply a linear ramp (3% increase per second) to CPUs 0, 1, and 3 for 33 seconds:\n```bash\nsudo psst -s linear-ramp,3 -C b -p 700 -d 33000 -v\n```\n\n### Sinusoidal Wave Pattern\nApply a sinusoidal wave pattern with 15-second wavelength and 50% maximum amplitude:\n```bash\nsudo psst -s sinosoid,15,50 -C 1 -d 60000\n```\n\nSources: [README.md:103-128](), [psst.1:73-84]()\n\n## Understanding Output\n\nWhen running with verbose mode, PSST displays:\n1. Selected CPUs\n2. Poll period and duration\n3. Log file path\n4. Power shape function\n5. Column headers for metrics\n6. Real-time data rows\n\nExample output:\n```\nVerbose mode ON\nCPU domain. Following 4 cpu selected:\n    cpu 0    [was online or chosen]\n    cpu 1    [was online or chosen]\n    cpu 2    [was online or chosen]\n    cpu 3    [was online or chosen]\n\npoll period 500ms\nrun duration 3600000ms\nLog file path: /var/log/psst.csv\npower curve shape: single-step,0.1\n#     Time,     FreqReal,     LoadIn,     LoadOut,      PkgPwr,       PwrCore,      PwrGpu,      PwrDram,     CpuDts,     SocDts\n#     [ms],        [MHz],     [C0_%],      [C0_%],      [mWatt],      [mWatt],      [mWatt],     [mWatt],     [DegC],     [DegC]\n#--------------------------------------------------------------------------------------------------------------------------------\n        0,         2914,       0.10,        1.00,         0.00,         0.00,         0.00,        0.00,      24.00,      24.00\n      506,         2903,       6.31,        6.56,      1466.67,       868.53,         0.00,      284.18,      24.00,      22.00\n```\n\nThe metrics collected include:\n- Time (ms): Elapsed time\n- FreqReal (MHz): Actual CPU frequency\n- LoadIn (C0_%): Requested CPU utilization\n- LoadOut (C0_%): Measured CPU utilization\n- PkgPwr (mWatt): Package power consumption\n- PwrCore (mWatt): CPU core power consumption\n- PwrGpu (mWatt): GPU power consumption (if applicable)\n- PwrDram (mWatt): Memory power consumption\n- CpuDts (DegC): CPU temperature\n- SocDts (DegC): SoC temperature\n\nSources: [README.md:39-60]()\n\n## Visualizing Results\n\nThe CSV log file can be analyzed using various tools. For quick visualization with gnuplot:\n\n```bash\nsudo apt-get install gnuplot-x11\ngnuplot\ngnuplot\u003e cd '/var/log'\ngnuplot\u003e set datafile separator ','\ngnuplot\u003e plot 'psst.csv' using 1:4 w lines, 'psst.csv' using 1:9 w lines\n```\n\nThis plots the CPU utilization and temperature over time.\n\n```mermaid\nflowchart LR\n    PSST[\"PSST\n    do_logging()\"]\n    CSV[\"/var/log/psst.csv\n    Log File\"]\n    Analysis[\"Analysis Tools\n    (gnuplot, etc)\"]\n    \n    PSST --\u003e |\"Writes\"| CSV\n    CSV --\u003e |\"Input to\"| Analysis\n    \n    subgraph \"Data Workflow\"\n    PSST\n    CSV\n    Analysis\n    end\n```\n\n**Diagram: PSST Data Collection and Analysis Workflow**\n\nSources: [README.md:67-78]()\n\n## Next Steps\n\nNow that you've learned the basics of PSST, you might want to explore:\n\n- [Power Shaping Functions](#5) for more details on creating custom load patterns\n- [Logging System](#3) for understanding the logging architecture\n- [Performance Monitoring Subsystem](#6) to learn how metrics are collected\n- [Use Cases and Examples](#9) for real-world applications\n\nFor any issues or enhancement requests, refer to the project's GitHub repository."])</script><script>self.__next_f.push([1,"1a:T346b,"])</script><script>self.__next_f.push([1,"# System Architecture\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [Makefile](Makefile)\n- [src/logger.c](src/logger.c)\n- [src/parse_config.c](src/parse_config.c)\n- [src/psst.c](src/psst.c)\n\n\u003c/details\u003e\n\n\n\n## Purpose and Scope\n\nThis document provides a comprehensive overview of the PSST (Power Stress and Shaping Tool) architecture, describing its core components, execution model, and data flows. It focuses on how the different subsystems interact to enable controlled CPU stress patterns while monitoring power and performance metrics.\n\nFor detailed information about specific subsystems, please refer to:\n- Main program execution flow: [Main Program Flow](#2.1)\n- Threading model details: [Multi-Threading Model](#2.2)\n- Logging implementation: [Logging System](#3)\n- Power shaping algorithms: [Power Shaping Functions](#5)\n\nSources: [src/psst.c:1-15](), [Makefile:1-3]()\n\n## High-Level Component Architecture\n\nThe PSST system consists of five main components that work together to stress test and monitor Intel processors.\n\n```mermaid\ngraph TD\n    Main[\"psst.c - Main Controller\"]\n    Config[\"parse_config.c - Configuration Parser\"]\n    Logger[\"logger.c - Logging System\"]\n    PerfMSR[\"perf_msr.c - Performance Monitoring\"]\n    RAPL[\"rapl.c - Power Measurement\"]\n    \n    Main --\u003e |\"parses arguments\"| Config\n    Main --\u003e |\"initiates logging\"| Logger\n    Main --\u003e |\"monitors performance\"| PerfMSR\n    Main --\u003e |\"measures power\"| RAPL\n    \n    Config --\u003e |\"provides configuration\"| Main\n    Logger --\u003e |\"collects metrics from\"| PerfMSR\n    Logger --\u003e |\"collects metrics from\"| RAPL\n    \n    subgraph \"Core Components\"\n        Main\n        Config\n        Logger\n    end\n    \n    subgraph \"Hardware Interface Components\"\n        PerfMSR\n        RAPL\n    end\n```\n\nThe architecture follows a modular design where each component has a specific responsibility:\n\n1. **Main Controller** ([src/psst.c]()) - Orchestrates the entire process, including thread creation, worker management, and signal handling.\n2. **Configuration Parser** ([src/parse_config.c]()) - Processes command-line arguments and sets up the system configuration.\n3. **Logging System** ([src/logger.c]()) - Collects, buffers, and writes performance and power metrics to files.\n4. **Performance Monitoring** (perf_msr.c) - Interfaces with Model-Specific Registers (MSRs) to collect CPU performance data.\n5. **Power Measurement** (rapl.c) - Uses Intel's Running Average Power Limit (RAPL) interface to measure power consumption.\n\nSources: [src/psst.c:35-39](), [Makefile:17-19]()\n\n## Execution Model\n\nPSST employs a multi-threaded execution model to efficiently stress the CPU while collecting metrics.\n\n```mermaid\nsequenceDiagram\n    participant Main as \"Main Thread\"\n    participant Worker as \"Worker Threads\"\n    participant IO as \"I/O Thread\"\n    participant CPU as \"CPU Hardware\"\n    participant Logger as \"Logger System\"\n    \n    Main-\u003e\u003eMain: Parse configuration\n    Main-\u003e\u003eMain: Initialize hardware interfaces\n    Main-\u003e\u003eIO: Create I/O thread for logging\n    Main-\u003e\u003eWorker: Create worker threads with CPU affinity\n    \n    loop Until completion or interrupt signal\n        Worker-\u003e\u003eWorker: \"Calculate duty cycle (power_shaping())\"\n        Worker-\u003e\u003eCPU: \"Perform CPU work during on-time\"\n        Worker-\u003e\u003eWorker: \"Sleep during off-time\"\n        Worker-\u003e\u003eLogger: \"Collect \u0026 buffer data (do_logging())\"\n    end\n    \n    Logger-\u003e\u003eIO: Signal when buffer full\n    IO-\u003e\u003eLogger: Write buffer to disk\n    \n    Main-\u003e\u003eMain: Wait for threads to complete\n    Main-\u003e\u003eMain: Clean up resources\n```\n\nKey aspects of the execution model:\n\n1. **Main Thread** - Initializes the system, creates worker threads, handles signals, and performs cleanup.\n2. **Worker Threads** - Execute stress patterns on specific CPU cores using configurable power shaping functions.\n3. **I/O Thread** - Asynchronously writes log data to disk to minimize impact on measurement.\n4. **Thread Synchronization** - Uses condition variables and mutexes to coordinate logging activities.\n\nSources: [src/psst.c:226-371](), [src/psst.c:390-544]()\n\n## Thread Management and CPU Affinity\n\nWorker threads are created with specific CPU affinities to control which cores are stressed.\n\n```mermaid\ngraph LR\n    Main[\"Main Thread\"]\n    \n    Main --\u003e Worker0[\"Worker Thread 0\u003cbr\u003e(CPU 0)\"]\n    Main --\u003e Worker1[\"Worker Thread 1\u003cbr\u003e(CPU 1)\"]\n    Main --\u003e WorkerN[\"Worker Thread N\u003cbr\u003e(CPU N)\"]\n    Main --\u003e IO[\"I/O Thread\"]\n    \n    subgraph \"Worker Threads\"\n        Worker0\n        Worker1\n        WorkerN\n    end\n    \n    Worker0 --\u003e |\"do_logging()\"| Buffer[\"Log Buffer\"]\n    Worker1 --\u003e |\"do_logging()\"| Buffer\n    WorkerN --\u003e |\"do_logging()\"| Buffer\n    \n    Buffer --\u003e IO\n    IO --\u003e |\"write\"| LogFile[\"CSV Log File\"]\n```\n\nThread management details:\n- CPU affinity is set using `sched_setaffinity()` ([src/psst.c:104-113]())\n- Worker thread creation and management occurs in the main function ([src/psst.c:506-521]())\n- The CPU0 thread has special behavior - it can optionally act only as a work submitter without being stressed\n- Each worker thread runs the same pattern but on different cores\n\nSources: [src/psst.c:104-128](), [src/psst.c:390-545](), [src/parse_config.c:85-119]()\n\n## Power Shaping Mechanism\n\nA key feature of PSST is its ability to generate controlled CPU load patterns through the power shaping mechanism.\n\n```mermaid\ngraph TD\n    PS[\"power_shaping() Function\"]\n    \n    PS --\u003e |\"Type\"| Functions[\"Power Shape Functions\"]\n    Functions --\u003e SS[\"SINGLE_STEP\"]\n    Functions --\u003e SIN[\"SINOSOID\"]\n    Functions --\u003e SC[\"STAIR_CASE\"]\n    Functions --\u003e SP[\"SINGLE_PULSE\"]\n    Functions --\u003e LR[\"LINEAR_RAMP\"]\n    Functions --\u003e ST[\"SAW_TOOTH\"]\n    \n    PS --\u003e |\"Output\"| DC[\"CPU Duty Cycle\"]\n    DC --\u003e |\"Controls\"| Work[\"Worker Thread Work Cycle\"]\n    Work --\u003e |\"On Time\"| CPUactive[\"CPU Active Work\"]\n    Work --\u003e |\"Off Time\"| CPUsleep[\"CPU Sleep\"]\n    \n    subgraph \"Pattern Descriptions\"\n        SS --\u003e |\"Generates\"| SS_Desc[\"Constant load\"]\n        SIN --\u003e |\"Generates\"| SIN_Desc[\"Sinusoidal wave pattern\"]\n        SC --\u003e |\"Generates\"| SC_Desc[\"Step increases\"]\n        SP --\u003e |\"Generates\"| SP_Desc[\"Single spike pattern\"]\n        LR --\u003e |\"Generates\"| LR_Desc[\"Linear increase\"]\n        ST --\u003e |\"Generates\"| ST_Desc[\"Sawtooth pattern\"]\n    end\n```\n\nThe power shaping mechanism:\n1. Applies mathematical functions to control CPU duty cycles\n2. Translates duty cycle into active work vs. sleep time\n3. Adjusts in real-time based on the selected pattern\n4. Supports six different patterns for varied testing scenarios\n\nPower shaping functions are implemented in `power_shaping()` ([src/psst.c:143-222]()) which calculates the appropriate duty cycle based on the specified pattern and timing parameters.\n\nSources: [src/psst.c:143-222](), [src/parse_config.c:356-467]()\n\n## Data Flow Architecture\n\nPSST implements a sophisticated data flow for collecting, buffering, and logging performance and power metrics.\n\n```mermaid\nflowchart LR\n    User[\"User\"] --\u003e |\"Command Line Arguments\"| Config[\"Configuration Parsing\"]\n    Config --\u003e Main[\"Main Program\"]\n    \n    Main --\u003e |\"Creates\"| WorkerThreads[\"Worker Threads\"]\n    Main --\u003e |\"Creates\"| IOThread[\"I/O Thread\"]\n    \n    WorkerThreads --\u003e |\"CPU Stress\"| Hardware[\"CPU Hardware\"]\n    Hardware --\u003e |\"MSR Readings\"| MSR[\"MSR Interface\"]\n    Hardware --\u003e |\"RAPL Readings\"| RAPL[\"RAPL Interface\"]\n    \n    MSR --\u003e |\"Performance Data\"| DoLogging[\"do_logging() Function\"]\n    RAPL --\u003e |\"Power Data\"| DoLogging\n    \n    DoLogging --\u003e |\"Write Records\"| Buffer[\"Double Buffer\u003cbr\u003e(Active/Dirty Pages)\"]\n    Buffer --\u003e |\"Signal Full Buffer\"| IOThread\n    IOThread --\u003e |\"Write\"| LogFile[\"CSV Log File\"]\n```\n\nThe data flow process:\n1. User configures test parameters via command line\n2. Main program creates workers and I/O threads\n3. Worker threads stress the CPU and collect metrics\n4. Metrics are buffered in a double-buffering mechanism\n5. I/O thread asynchronously writes data to log file\n\nKey implementation details:\n- Double-buffering implemented with active and dirty pages ([src/logger.c:222-332]())\n- Asynchronous I/O with thread signaling ([src/logger.c:240-246]())\n- Data collection in `do_logging()` function ([src/logger.c:527-837]())\n\nSources: [src/logger.c:222-332](), [src/logger.c:527-837]()\n\n## Logging System Architecture\n\nThe logging system uses a double-buffering approach to efficiently collect and store metrics with minimal impact on measurement accuracy.\n\n```mermaid\ngraph TD\n    DoLogging[\"do_logging() Function\"]\n    \n    subgraph \"Data Sources\"\n        MSR[\"MSR Registers\"]\n        RAPL[\"RAPL Interface\"]\n        SYS[\"Sysfs Entries\"]\n    end\n    \n    subgraph \"Metrics Collected\"\n        TS[\"Timestamp\"]\n        FREQ[\"CPU Frequency\"]\n        LOAD[\"CPU Load\"]\n        PKG[\"Package Power\"]\n        CORE[\"Core Power\"]\n        DRAM[\"DRAM Power\"]\n        TEMP[\"Temperature\"]\n    end\n    \n    subgraph \"Double Buffer System\"\n        AP[\"Active Page\"]\n        DP[\"Dirty Page\"]\n        MUTEX[\"pthread_mutex_t\"]\n        COND[\"pthread_cond_t\"]\n    end\n    \n    MSR --\u003e DoLogging\n    RAPL --\u003e DoLogging\n    SYS --\u003e DoLogging\n    \n    DoLogging --\u003e TS\n    DoLogging --\u003e FREQ\n    DoLogging --\u003e LOAD\n    DoLogging --\u003e PKG\n    DoLogging --\u003e CORE\n    DoLogging --\u003e DRAM\n    DoLogging --\u003e TEMP\n    \n    DoLogging --\u003e |\"Write Record\"| AP\n    AP --\u003e |\"When Full\"| DP\n    DP --\u003e |\"Signal via\"| COND\n    MUTEX --\u003e |\"Protects\"| COND\n    \n    COND --\u003e IOThread[\"I/O Thread\"]\n    IOThread --\u003e LogFile[\"CSV Log File\"]\n```\n\nKey features of the logging architecture:\n- **Column Descriptors** - Predefined metrics structure ([src/logger.c:50-83]())\n- **Double Buffering** - Active page accumulates records while dirty page is written to disk\n- **Thread Synchronization** - Uses pthread mutexes and condition variables\n- **Asynchronous I/O** - Separate thread for disk writes\n- **Flexible Metrics** - Automatically detects available hardware counters\n\nSources: [src/logger.c:50-83](), [src/logger.c:221-332](), [src/logger.c:526-837]()\n\n## Configuration Subsystem\n\nThe configuration subsystem handles command-line arguments and establishes the test parameters.\n\n```mermaid\nflowchart TD\n    CMD[\"Command Line Arguments\"] --\u003e ParseCmd[\"parse_cmd_config()\"]\n    ParseCmd --\u003e Options[\"Long Options Array\"]\n    ParseCmd --\u003e Config[\"Config Structure\"]\n    \n    Config --\u003e CPUMask[\"CPU Mask\"]\n    Config --\u003e ShapeFunc[\"Shape Function\"]\n    Config --\u003e Duration[\"Duration\"]\n    Config --\u003e PollPeriod[\"Poll Period\"]\n    Config --\u003e LogFile[\"Log File\"]\n    \n    ParseCmd --\u003e ParseShape[\"parse_power_shape()\"]\n    ParseShape --\u003e ShapeType[\"Power Shape Type\"]\n    ParseShape --\u003e ShapeParams[\"Shape Parameters\"]\n    \n    Config --\u003e PopulateDefault[\"populate_default_config()\"]\n    PopulateDefault --\u003e InitLogger[\"initialize_logger()\"]\n```\n\nKey components of the configuration subsystem:\n- Command-line option parsing using getopt_long ([src/parse_config.c:259-324]())\n- Default configuration settings ([src/parse_config.c:82-147]())\n- Power shape function parsing ([src/parse_config.c:356-467]())\n- CPU mask configuration for thread affinity ([src/parse_config.c:223-255]())\n\nSources: [src/parse_config.c:31-78](), [src/parse_config.c:82-147](), [src/parse_config.c:223-255](), [src/parse_config.c:356-467]()\n\n## Hardware Interaction Model\n\nPSST interacts with hardware through multiple interfaces to measure power and performance.\n\n```mermaid\ngraph TD\n    PSST[\"PSST Application\"]\n    \n    subgraph \"Hardware Interfaces\"\n        MSR[\"Model-Specific Registers\u003cbr\u003e/dev/cpu/*/msr\"]\n        RAPL[\"RAPL Interface\u003cbr\u003e/sys/class/powercap/intel-rapl\"]\n        TEMP[\"Temperature Sensors\u003cbr\u003e/sys/class/thermal\"]\n    end\n    \n    PSST --\u003e |\"Performance Counters\"| MSR\n    PSST --\u003e |\"Power Measurement\"| RAPL\n    PSST --\u003e |\"Temperature Monitoring\"| TEMP\n    \n    subgraph \"Measurement Data\"\n        PERF[\"CPU Performance\u003cbr\u003e- Frequency\u003cbr\u003e- C0 Residency\u003cbr\u003e- Scale Factor\"]\n        PWR[\"Power Consumption\u003cbr\u003e- Package Power\u003cbr\u003e- Core Power\u003cbr\u003e- DRAM Power\"]\n        TMP[\"Thermal Data\u003cbr\u003e- CPU Temperature\u003cbr\u003e- SoC Temperature\"]\n    end\n    \n    MSR --\u003e PERF\n    RAPL --\u003e PWR\n    TEMP --\u003e TMP\n```\n\nHardware interaction details:\n- MSR access for CPU performance metrics ([src/logger.c:348-362]())\n- RAPL interface for power measurements ([src/logger.c:364-405]())\n- Temperature sensor access via sysfs ([src/logger.c:406-415]())\n- Automatic detection of hardware capabilities ([src/logger.c:336-427]())\n\nSources: [src/logger.c:336-427](), [src/psst.c:472-484]()\n\n## Summary\n\nPSST's architecture is designed around a modular approach with separate components for configuration, power shaping, metric collection, and logging. The multi-threaded design enables efficient CPU stress testing while accurately measuring performance and power metrics through direct hardware interfaces. The double-buffering logging mechanism ensures minimal impact on the measurements by offloading disk I/O to a separate thread.\n\nThe key architectural strengths of PSST include:\n1. Flexible power shaping capabilities\n2. Precise CPU targeting through thread affinity\n3. Comprehensive metrics collection\n4. Efficient asynchronous logging\n5. Minimal measurement overhead\n\nTogether, these architectural features make PSST an effective tool for stress testing and power analysis of x86 processors in a controlled, reproducible manner."])</script><script>self.__next_f.push([1,"1b:T2f26,"])</script><script>self.__next_f.push([1,"# Main Program Flow\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [src/psst.c](src/psst.c)\n- [src/psst.h](src/psst.h)\n\n\u003c/details\u003e\n\n\n\nThis document details the execution flow of the Power Stress and Shaping Tool (PSST), focusing on the main program initialization, thread management, worker execution, and power shaping implementation. For information about the multi-threading architecture, see [Multi-Threading Model](#2.2), and for details about logging functionality, see [Logging System](#3).\n\n## Program Initialization\n\nThe PSST tool begins in the `main()` function which processes command-line arguments, initializes required data structures, and creates worker threads to execute the stress patterns.\n\n```mermaid\nflowchart TD\n    Start[\"Program Start\"]\n    ParseCmd[\"parse_cmd_config()\n    Parse command line arguments\"]\n    CheckRoot[\"Check for root privileges\"]\n    PopDefaults[\"populate_default_config()\n    Set default configuration\"]\n    ParsePowerShape[\"parse_power_shape()\n    Configure power shaping pattern\"]\n    InitThreads[\"Initialize thread structures\"]\n    InitMSR[\"Initialize MSR access\n    for performance monitoring\"]\n    CreateIO[\"Create I/O thread\n    for asynchronous logging\"]\n    CreateWorkers[\"Create worker threads\n    with CPU affinity\"]\n    SignalHandler[\"Set up signal handler\"]\n    JoinThreads[\"Join threads and clean up\"]\n    End[\"Program End\"]\n    \n    Start --\u003e ParseCmd\n    ParseCmd --\u003e CheckRoot\n    CheckRoot --\u003e PopDefaults\n    PopDefaults --\u003e ParsePowerShape\n    ParsePowerShape --\u003e InitThreads\n    InitThreads --\u003e InitMSR\n    InitMSR --\u003e CreateIO\n    CreateIO --\u003e CreateWorkers\n    CreateWorkers --\u003e SignalHandler\n    SignalHandler --\u003e JoinThreads\n    JoinThreads --\u003e End\n```\n\nSources: [src/psst.c:394-545]()\n\nThe initialization sequence follows these key steps:\n\n1. **Configuration Parsing**: The program parses command-line arguments to configure behavior\n2. **Permission Check**: Verifies root privileges (required for MSR access)\n3. **Power Shape Configuration**: Parses the power shape function that controls CPU stress patterns\n4. **Thread Creation**: Initializes worker threads with CPU affinity and an I/O thread for logging\n5. **Signal Handling**: Sets up signal handlers for graceful termination\n6. **Thread Management**: Manages thread execution and cleanup\n\n## Worker Thread Execution Flow\n\nEach worker thread executes the `work_fn()` function which implements the duty cycle pattern based on the configured power shaping function.\n\n```mermaid\nflowchart TD\n    Start[\"Thread Start\"]\n    InitThread[\"Initialize thread:\n    - Block signals\n    - Set CPU affinity\n    - Set scheduler priority\"]\n    \n    CalcInitDuty[\"Calculate initial duty cycle\n    - on_time = tick_usec * duty_cycle/100\n    - off_time = tick_usec - on_time\"]\n    \n    subgraph \"Main Execution Loop\"\n        OnCycle[\"Execute CPU work during on-time\"]\n        PowerShape[\"power_shaping()\n        Recalculate duty cycle based on shape\"]\n        UpdateDuty[\"Update on_time/off_time\n        based on new duty cycle\"]\n        Logging[\"do_logging()\n        Collect metrics\"]\n        Sleep[\"Sleep during off-time\n        (nanosleep)\"]\n    end\n    \n    CleanUp[\"Clean up and report energy statistics\"]\n    End[\"Thread Exit\"]\n    \n    Start --\u003e InitThread\n    InitThread --\u003e CalcInitDuty\n    CalcInitDuty --\u003e OnCycle\n    OnCycle --\u003e PowerShape\n    PowerShape --\u003e UpdateDuty\n    UpdateDuty --\u003e Logging\n    Logging --\u003e Sleep\n    Sleep --\u003e OnCycle\n    \n    OnCycle --\u003e|\"exit_cpu_thread set\"| CleanUp\n    CleanUp --\u003e End\n```\n\nSources: [src/psst.c:226-371]()\n\nThe worker thread execution involves:\n\n1. **Initialization**: Setting CPU affinity and thread priority\n2. **Duty Cycle Calculation**: Determining work/sleep periods based on the power shape\n3. **Main Loop**:\n   - Performing CPU work during the \"on-time\"\n   - Applying power shaping algorithms to adjust duty cycle\n   - Collecting metrics (primary thread only)\n   - Sleeping during the \"off-time\"\n4. **Termination**: Reporting energy statistics and exiting\n\n## Power Shaping Implementation\n\nThe `power_shaping()` function is a core component that dynamically adjusts the CPU duty cycle according to the selected pattern.\n\n```mermaid\nflowchart TD\n    Start[\"power_shaping() called\"]\n    CheckPattern[\"Determine power shape pattern\"]\n    \n    subgraph \"Power Shape Functions\"\n        Linear[\"LINEAR_RAMP:\n        Linearly increase/decrease load\"]\n        Sawtooth[\"SAW_TOOTH:\n        Ramp up then reset when max reached\"]\n        Staircase[\"STAIR_CASE:\n        Step increases at fixed intervals\"]\n        Sinusoid[\"SINOSOID:\n        Sinusoidal wave pattern\"]\n        SinglePulse[\"SINGLE_PULSE:\n        One-time pulse of specified length\"]\n        SingleStep[\"SINGLE_STEP:\n        Constant load at fixed value\"]\n    end\n    \n    UpdateTime[\"Update timestamp for next calculation\"]\n    Return[\"Return duty cycle value\"]\n    \n    Start --\u003e CheckPattern\n    CheckPattern --\u003e|\"LINEAR_RAMP\"| Linear\n    CheckPattern --\u003e|\"SAW_TOOTH\"| Sawtooth\n    CheckPattern --\u003e|\"STAIR_CASE\"| Staircase\n    CheckPattern --\u003e|\"SINOSOID\"| Sinusoid\n    CheckPattern --\u003e|\"SINGLE_PULSE\"| SinglePulse\n    CheckPattern --\u003e|\"Others\"| SingleStep\n    \n    Linear --\u003e UpdateTime\n    Sawtooth --\u003e UpdateTime\n    Staircase --\u003e UpdateTime\n    Sinusoid --\u003e UpdateTime\n    SinglePulse --\u003e UpdateTime\n    SingleStep --\u003e UpdateTime\n    \n    UpdateTime --\u003e Return\n```\n\nSources: [src/psst.c:143-221](), [src/psst.h:35-45]()\n\nThe power shaping module implements several algorithms:\n\n| Pattern | Description | Parameters |\n|---------|-------------|------------|\n| SINGLE_STEP | Constant load at fixed value | v_units (load percentage) |\n| LINEAR_RAMP | Linear increase/decrease in load | slope_y_per_sec (rate of change) |\n| SAW_TOOTH | Ramp up then reset when max reached | slope_y_per_sec, max_y |\n| STAIR_CASE | Step increases at fixed intervals | y_height (step size), x_length (step duration) |\n| SINOSOID | Sinusoidal wave pattern | y_amplitude, x_wavelength |\n| SINGLE_PULSE | One-time pulse of specified length | y_height, x_length |\n| NONE | No active power shaping | - |\n\n## Thread-to-CPU Mapping \n\nThe program maps worker threads to CPUs based on the configured CPU mask. Each thread is assigned to a specific CPU core through affinity settings.\n\n```mermaid\nsequenceDiagram\n    participant Main as \"Main Thread\"\n    participant CPUMask as \"CPU Mask\"\n    participant Worker as \"Worker Threads\"\n    participant MSR as \"MSR Devices\"\n    \n    Main-\u003e\u003eCPUMask: Check which CPUs to use\n    \n    loop For each selected CPU\n        Main-\u003e\u003eMSR: initialize_dev_msr(cpu)\n        MSR--\u003e\u003eMain: Return MSR file descriptor\n        Main-\u003e\u003eWorker: Create worker thread\n        Main-\u003e\u003eWorker: Set thread data (CPU affinity, duty cycle, power shape)\n    end\n    \n    Worker-\u003e\u003eWorker: set_affinity()\n    Worker-\u003e\u003eWorker: set_sched_priority()\n    Worker-\u003e\u003eWorker: Begin execution loop\n```\n\nSources: [src/psst.c:469-521](), [src/psst.c:104-113](), [src/psst.c:115-128]()\n\nKey aspects of thread-to-CPU mapping:\n\n1. The program identifies CPUs to use from the CPU mask in the configuration\n2. For each selected CPU, it:\n   - Initializes an MSR device for performance monitoring\n   - Creates a worker thread with data containing CPU affinity information\n   - Sets thread affinity to assign the thread to the specific CPU core\n\n## Signal Handling and Program Termination\n\nPSST handles signals for graceful termination, ensuring proper cleanup of resources.\n\n```mermaid\nflowchart LR\n    Signal[\"External Signal\n    (SIGINT, SIGTERM, SIGKILL)\"]\n    Handler[\"psst_signal_handler()\"]\n    Flag[\"Set exit_cpu_thread = 1\"]\n    ThreadExit[\"Worker threads\n    detect flag and exit\"]\n    IOFlag[\"Set exit_io_thread = 1\"]\n    FlushLogs[\"Trigger disk I/O\n    to flush remaining logs\"]\n    JoinThreads[\"Join threads\"]\n    Exit[\"Program exit\"]\n    \n    Signal --\u003e Handler\n    Handler --\u003e Flag\n    Flag --\u003e ThreadExit\n    ThreadExit --\u003e IOFlag\n    IOFlag --\u003e FlushLogs\n    FlushLogs --\u003e JoinThreads\n    JoinThreads --\u003e Exit\n```\n\nSources: [src/psst.c:375-388](), [src/psst.c:523-545]()\n\nThe termination sequence involves:\n\n1. **Signal Reception**: External signals trigger the `psst_signal_handler`\n2. **Flag Setting**: Setting the `exit_cpu_thread` flag that worker threads check during execution\n3. **Thread Termination**: Worker threads detect the flag and exit their execution loops\n4. **I/O Thread Termination**: Setting the `exit_io_thread` flag and triggering final log writes\n5. **Resource Cleanup**: Joining all threads and closing file descriptors\n\n## Integration with Hardware Monitoring\n\nThe main program initializes hardware interfaces for performance and power monitoring through MSR registers.\n\n```mermaid\nflowchart TD\n    Main[\"main()\"]\n    InitMSR[\"initialize_dev_msr()\n    Open /dev/cpuX/msr device\"]\n    InitHFM[\"initialize_cpu_hfm_mhz()\n    Read CPU frequency info\"]\n    \n    WorkerThread[\"work_fn()\"]\n    PowerShaping[\"power_shaping()\"]\n    DoLogging[\"do_logging()\"]\n    \n    RAPLInterface[\"RAPL Interface\n    Power measurement\"]\n    MSRInterface[\"MSR Interface\n    Performance counters\"]\n    \n    Main --\u003e InitMSR\n    Main --\u003e InitHFM\n    Main --\u003e WorkerThread\n    \n    WorkerThread --\u003e PowerShaping\n    WorkerThread --\u003e DoLogging\n    \n    DoLogging --\u003e RAPLInterface\n    DoLogging --\u003e MSRInterface\n```\n\nSources: [src/psst.c:469-486](), [src/psst.c:330]()\n\nThe hardware monitoring integration includes:\n\n1. **MSR Device Initialization**: Opening MSR device files for each CPU\n2. **CPU Frequency Information**: Reading maximum frequency information\n3. **Logging Integration**: Collecting performance and power metrics via RAPL and MSR interfaces during thread execution\n\n## Program Data Flow\n\nThe following diagram shows how data flows through the main program components:\n\n```mermaid\nflowchart TD\n    CmdArgs[\"Command Line Arguments\"] --\u003e ConfigParser[\"parse_cmd_config()\"]\n    ConfigParser --\u003e Config[\"Configuration (struct config)\"]\n    \n    Config --\u003e PowerShapeParser[\"parse_power_shape()\"]\n    PowerShapeParser --\u003e PowerShapeData[\"Power Shape Data (ps_t)\"]\n    \n    Config --\u003e ThreadData[\"Thread Data (data_t)\"]\n    PowerShapeData --\u003e ThreadData\n    \n    ThreadData --\u003e WorkerThreads[\"Worker Threads (work_fn)\"]\n    \n    WorkerThreads --\u003e PowerShaping[\"power_shaping()\"]\n    PowerShaping --\u003e DutyCycle[\"Duty Cycle\"]\n    DutyCycle --\u003e WorkerThreads\n    \n    WorkerThreads --\u003e Logging[\"do_logging()\"]\n    Logging --\u003e IOThread[\"I/O Thread\"]\n    IOThread --\u003e LogFile[\"Log File\"]\n```\n\nSources: [src/psst.c:394-521](), [src/psst.h:83-88](), [src/psst.h:76-81]()\n\nKey data flows:\n\n1. **Configuration**: Command-line arguments → configuration structure\n2. **Power Shape**: Configuration → power shape parameters\n3. **Thread Data**: Configuration and power shape → thread-specific data\n4. **Execution**: Thread data → worker thread execution and duty cycle adjustments\n5. **Logging**: Metrics collection → I/O thread → log file\n\n## Performance Monitoring Integration\n\nThe main program initializes performance monitoring components that worker threads use to collect metrics.\n\n```mermaid\nflowchart TD\n    Main[\"main()\"] --\u003e InitMSR[\"Initialize MSR access\"]\n    InitMSR --\u003e PerfStats[\"Performance Stats (perf_stats_t)\"]\n    \n    WorkerThreads[\"Worker Threads\"] --\u003e Logging[\"do_logging()\"]\n    \n    PerfStats --\u003e Logging\n    \n    Logging --\u003e RAPL[\"rapl.c\n    Power measurements\"]\n    Logging --\u003e PerfMSR[\"perf_msr.c\n    Performance counters\"]\n    \n    RAPL --\u003e LogData[\"Log Data\"]\n    PerfMSR --\u003e LogData\n```\n\nSources: [src/psst.c:469-486](), [src/psst.h:96-104]()\n\nPerformance monitoring includes:\n\n1. **MSR Initialization**: Setting up MSR device access for each CPU\n2. **Performance Stats Structure**: Creating and initializing data structures for tracking performance metrics\n3. **Metrics Collection**: Integrating with RAPL and performance counter systems during thread execution\n4. **Logging**: Recording metrics to the log file through the asynchronous logging system"])</script><script>self.__next_f.push([1,"1c:T2cb7,"])</script><script>self.__next_f.push([1,"# Multi-Threading Model\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [src/logger.c](src/logger.c)\n- [src/psst.c](src/psst.c)\n\n\u003c/details\u003e\n\n\n\n## Purpose and Overview\n\nThis document explains the multi-threading architecture used in the PSST (Power Stress and Shaping Tool). It covers the thread types, their creation, management, synchronization mechanisms, and the asynchronous I/O model used for efficient logging. This page focuses specifically on the threading architecture; for information about the main program flow, see [Main Program Flow](#2.1), and for details about the logging system, see [Logging System](#3).\n\n## Thread Types and Roles\n\nPSST employs a multi-threaded architecture with three distinct thread types:\n\n1. **Main Thread**: Initializes the system, creates worker threads and the I/O thread, waits for them to complete, and handles cleanup.\n2. **Worker Threads**: Run on specific CPUs to generate controlled load patterns according to configured power shaping functions and collect performance metrics.\n3. **I/O Thread**: Handles asynchronous disk I/O for logging, allowing worker threads to continue processing without waiting for slow disk operations.\n\n### Thread Architecture Diagram\n\n```mermaid\ngraph TD\n    Main[\"Main Thread\n    (Thread Creation \u0026 Management)\"]\n    \n    Worker1[\"Worker Thread 1\n    (CPU Work \u0026 Monitoring)\"]\n    \n    Worker2[\"Worker Thread 2\n    (CPU Work \u0026 Monitoring)\"]\n    \n    WorkerN[\"Worker Thread N\n    (CPU Work \u0026 Monitoring)\"]\n    \n    IO[\"I/O Thread\n    (Asynchronous Logging)\"]\n    \n    Main --\u003e|\"Creates\"| Worker1\n    Main --\u003e|\"Creates\"| Worker2\n    Main --\u003e|\"Creates\"| WorkerN\n    Main --\u003e|\"Creates\"| IO\n    \n    Worker1 --\u003e|\"Signal when buffer full\"| IO\n    Worker2 --\u003e|\"Signal when buffer full\"| IO\n    WorkerN --\u003e|\"Signal when buffer full\"| IO\n    \n    Main --\u003e|\"Join threads on completion\"| Worker1\n    Main --\u003e|\"Join threads on completion\"| Worker2\n    Main --\u003e|\"Join threads on completion\"| WorkerN\n    Main --\u003e|\"Join threads on completion\"| IO\n```\n\nSources: [src/psst.c:487-492](), [src/psst.c:506-521](), [src/psst.c:529-533]()\n\n## Thread Creation and Management\n\nThe main thread in PSST is responsible for creating and managing all other threads in the system. It creates one worker thread for each CPU specified in the CPU mask and a single I/O thread for asynchronous logging.\n\n### Thread Creation Process\n\n1. **System Initialization**: The main thread initializes the system, parses configuration, and prepares resources.\n2. **I/O Thread Creation**: A dedicated I/O thread is created to handle asynchronous logging operations.\n3. **Worker Thread Creation**: Worker threads are created for each logical CPU specified in the configuration.\n4. **Thread Joining**: The main thread waits for all worker threads to complete before terminating the program.\n\n```mermaid\nsequenceDiagram\n    participant M as \"Main Thread\"\n    participant W as \"Worker Threads\"\n    participant IO as \"I/O Thread\"\n    \n    M-\u003e\u003eM: Parse configuration\n    M-\u003e\u003eM: Initialize system\n    M-\u003e\u003eIO: Create I/O thread (page_write_disk)\n    \n    loop For each CPU in mask\n        M-\u003e\u003eW: Create worker thread (work_fn)\n        W-\u003e\u003eW: Set CPU affinity\n        W-\u003e\u003eW: Set scheduling priority\n    end\n    \n    M-\u003e\u003eM: Set up signal handlers\n    M-\u003e\u003eM: Wait for threads to complete\n    \n    W-\u003e\u003eW: Perform CPU work\n    W-\u003e\u003eW: Collect metrics\n    \n    IO-\u003e\u003eIO: Write log data to disk\n    \n    M-\u003e\u003eM: Join all threads\n    M-\u003e\u003eM: Clean up resources\n```\n\nSources: [src/psst.c:394-545](), [src/psst.c:487-492](), [src/psst.c:506-521]()\n\n## Worker Thread Implementation\n\nWorker threads are the core of PSST's stress testing capability. Each worker thread:\n\n1. Sets CPU affinity to run on a specific core\n2. Sets high scheduling priority\n3. Executes work cycles based on configured duty cycle\n4. Collects performance metrics\n5. Implements power shaping functions\n\n### Worker Thread Execution Flow\n\n```mermaid\nflowchart TD\n    Start[\"Thread Start (work_fn)\"] --\u003e Init[\"Initialize:\n    - Set CPU affinity\n    - Set scheduling priority\n    - Get initial timestamps\"]\n    \n    Init --\u003e WorkCycle[\"Start work cycle\"]\n    \n    WorkCycle --\u003e OnTime[\"ON time:\n    - Execute CPU work\n    - Collect metrics\n    - Apply power shaping\"]\n    \n    OnTime --\u003e OffTime[\"OFF time:\n    - Sleep\"]\n    \n    OffTime --\u003e CheckExit{\"Exit\n    requested?\"}\n    \n    CheckExit --\u003e|\"No\"| WorkCycle\n    CheckExit --\u003e|\"Yes\"| Exit[\"Thread Exit\"]\n```\n\nSources: [src/psst.c:226-371](), [src/psst.c:104-113]()\n\nThe worker thread function (`work_fn`) implements a cycle-based approach with active work and idle periods to create controlled load patterns:\n\n```\n1. Set CPU affinity and scheduling priority\n2. Initialize duty cycle and timing parameters\n3. Loop until exit is requested:\n   a. ON time: Perform CPU work for the calculated time\n   b. Apply power shaping to adjust duty cycle\n   c. Collect and log performance metrics\n   d. OFF time: Sleep for the calculated time\n4. Clean up and exit\n```\n\nThe `work_fn` function blocks signals in each worker thread to ensure they're handled by the main thread, setting up a controlled environment for stress testing.\n\nSources: [src/psst.c:226-371]()\n\n## CPU Affinity and Scheduling\n\nPSST uses CPU affinity to ensure worker threads run on specific cores, which is critical for controlled stress testing. The `set_affinity` function binds a thread to a specific CPU:\n\n```mermaid\nflowchart LR\n    Main[\"Main Thread\"] --\u003e|\"Create thread for CPU 0\"| Worker0[\"Worker Thread on CPU 0\"]\n    Main --\u003e|\"Create thread for CPU 1\"| Worker1[\"Worker Thread on CPU 1\"]\n    Main --\u003e|\"Create thread for CPU N\"| WorkerN[\"Worker Thread on CPU N\"]\n    \n    Worker0 --\u003e|\"set_affinity(0)\"| CPU0[\"CPU 0\"]\n    Worker1 --\u003e|\"set_affinity(1)\"| CPU1[\"CPU 1\"]\n    WorkerN --\u003e|\"set_affinity(N)\"| CPUN[\"CPU N\"]\n```\n\nSources: [src/psst.c:104-113](), [src/psst.c:506-521]()\n\nEach worker thread also sets its scheduling priority to maximum using `set_sched_priority(1)` to ensure it gets sufficient CPU time for accurate stress testing.\n\nSources: [src/psst.c:115-128](), [src/psst.c:256-257]()\n\n## Data Collection and Logging\n\nWorker threads collect performance metrics and send them to the logging system. The thread running on CPU 0 has special responsibilities for overall system monitoring and log orchestration.\n\n### Data Collection Flow\n\n```mermaid\nsequenceDiagram\n    participant WT as \"Worker Thread\"\n    participant LS as \"Logging System\"\n    participant IOT as \"I/O Thread\"\n    \n    WT-\u003e\u003eWT: Perform CPU work\n    WT-\u003e\u003eWT: Calculate duty cycle\n    WT-\u003e\u003eLS: Call do_logging()\n    LS-\u003e\u003eLS: Collect performance metrics\n    LS-\u003e\u003eLS: Format log record\n    LS-\u003e\u003eLS: Add to active buffer (accumulate_flush_record)\n    \n    alt Buffer Full\n        LS-\u003e\u003eLS: Swap active and dirty buffers\n        LS-\u003e\u003eIOT: Signal I/O thread (trigger_disk_io)\n        IOT-\u003e\u003eIOT: Write dirty buffer to disk\n    end\n```\n\nSources: [src/logger.c:527-837](), [src/psst.c:327-332]()\n\n## Asynchronous Logging Model\n\nPSST implements an efficient double-buffering mechanism for logging to avoid I/O operations blocking worker threads. This architecture allows for continuous data collection while minimizing the impact of disk operations.\n\n### Double-Buffer Logging Mechanism\n\n```mermaid\ngraph TD\n    subgraph \"Worker Threads\"\n        WT[\"Worker Threads\"]\n    end\n    \n    subgraph \"Memory Buffers\"\n        ActiveBuffer[\"Active Buffer\n        (Accumulating Data)\"]\n        DirtyBuffer[\"Dirty Buffer\n        (Ready for I/O)\"]\n    end\n    \n    subgraph \"I/O Thread\"\n        IOThread[\"I/O Thread\n        (page_write_disk)\"]\n    end\n    \n    WT --\u003e|\"Write log records\"| ActiveBuffer\n    \n    ActiveBuffer --\u003e|\"When full:\n    1. Swap buffers\n    2. Signal I/O thread\"| DirtyBuffer\n    \n    DirtyBuffer --\u003e|\"Read for writing\"| IOThread\n    IOThread --\u003e|\"Write to\"| LogFile[\"Log File\"]\n```\n\nSources: [src/logger.c:222-228](), [src/logger.c:248-288](), [src/logger.c:290-332]()\n\nThe double-buffering mechanism works as follows:\n\n1. Two memory buffers are allocated: active and dirty\n2. Worker threads write log data to the active buffer\n3. When the active buffer is full:\n   - The active and dirty buffers are swapped\n   - The I/O thread is signaled\n4. The I/O thread writes the dirty buffer to disk asynchronously\n5. This cycle continues, allowing worker threads to continue without waiting for I/O\n\nSources: [src/logger.c:232-288]()\n\n## Thread Synchronization\n\nPSST uses mutexes and condition variables for thread synchronization, particularly for coordinating the I/O thread with worker threads.\n\n### Synchronization Mechanism\n\n```mermaid\nsequenceDiagram\n    participant WT as \"Worker Thread\"\n    participant AB as \"Active Buffer\"\n    participant DB as \"Dirty Buffer\"\n    participant IO as \"I/O Thread\"\n    \n    Note over WT,IO: Initial state: I/O thread waiting on condition\n    WT-\u003e\u003eAB: Write log data\n    \n    alt Buffer Full\n        WT-\u003e\u003eWT: Swap active and dirty buffers\n        WT-\u003e\u003eWT: Lock mutex (pthread_mutex_lock)\n        WT-\u003e\u003eIO: Signal condition variable (pthread_cond_signal)\n        WT-\u003e\u003eWT: Unlock mutex (pthread_mutex_unlock)\n        IO-\u003e\u003eIO: Wake up from condition wait\n        IO-\u003e\u003eIO: Lock mutex\n        IO-\u003e\u003eIO: Unlock mutex\n        IO-\u003e\u003eDB: Write dirty buffer to disk\n        IO-\u003e\u003eIO: Reset io_inprogress flag\n        IO-\u003e\u003eIO: Wait on condition again\n    end\n```\n\nSources: [src/logger.c:229-230](), [src/logger.c:240-246](), [src/logger.c:290-332]()\n\nKey synchronization mechanisms:\n\n1. **Mutex (`pmutex`)**: Protects critical sections during buffer swapping and signaling\n2. **Condition Variable (`pcond`)**: Used by the I/O thread to wait for signals from worker threads\n3. **Flags**:\n   - `io_inprogress`: Indicates when the I/O thread is actively writing\n   - `active_pg_filled` and `dirty_pg_filled`: Track buffer fill levels\n   - `exit_cpu_thread` and `exit_io_thread`: Signal thread termination\n\nSources: [src/logger.c:221-227](), [src/logger.c:229-230]()\n\n## Thread Termination\n\nPSST implements a controlled thread termination process:\n\n1. **Signal Handling**: The main thread sets up signal handlers for SIGINT, SIGTERM, and SIGKILL\n2. **Termination Flag**: When a termination signal is received, the `exit_cpu_thread` flag is set\n3. **Worker Thread Exit**: Worker threads check this flag and exit their main loop\n4. **Thread Joining**: The main thread waits for all worker threads to complete\n5. **I/O Thread Termination**: The I/O thread is signaled to exit after all worker threads have completed\n6. **Cleanup**: Resources are freed and file descriptors are closed\n\nSources: [src/psst.c:374-388](), [src/psst.c:529-541]()\n\n## Conclusion\n\nThe multi-threading model in PSST provides an efficient architecture for controlled CPU stress testing and power analysis. By separating CPU work, performance monitoring, and I/O operations into different threads with appropriate synchronization mechanisms, PSST can generate precise load patterns while collecting accurate performance metrics with minimal measurement overhead.\n\nThe worker threads focus on generating controlled CPU loads according to configurable power shaping functions, while the asynchronous I/O thread handles logging operations that would otherwise impact the accuracy of the stress tests. This separation of concerns makes PSST a powerful tool for analyzing system behavior under various load conditions."])</script><script>self.__next_f.push([1,"1d:T2af5,"])</script><script>self.__next_f.push([1,"# Logging System\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [src/logger.c](src/logger.c)\n- [src/logger.h](src/logger.h)\n\n\u003c/details\u003e\n\n\n\nThe Logging System in PSST (Power Stress and Shaping Tool) provides comprehensive data collection and recording capabilities for monitoring CPU performance, power consumption, and thermal metrics during stress testing. This documentation covers the architecture, components, and functionality of the logging subsystem, focusing on its efficient design using double-buffering and asynchronous I/O.\n\nFor information on the specific metrics captured in log files, see [Log File Format](#3.1).\n\n## 1. Overview\n\nThe PSST Logging System collects multiple categories of performance and power metrics while minimizing its own impact on the system being monitored. It achieves this through:\n\n1. **Asynchronous logging** with a dedicated I/O thread\n2. **Double-buffering mechanism** to separate data collection from disk writes\n3. **Configurable polling intervals** to control logging frequency\n4. **Extensive metric collection** from various hardware interfaces\n\nThe logging system operates independently from the stress-testing functionality, allowing accurate monitoring without interfering with the workload patterns being tested.\n\nSources: [src/logger.c:17-33](), [src/logger.h:15-29]()\n\n## 2. Logging System Architecture\n\n```mermaid\nflowchart TB\n    subgraph \"Data Collection\"\n        direction TB\n        do_logging[\"do_logging()\"]\n        \n        subgraph \"Data Sources\"\n            direction LR\n            msr[\"MSR Registers\"]\n            rapl[\"RAPL Interface\"]\n            sysfs[\"Sysfs Entries\"]\n        end\n        \n        Data[\"Log Data Records\"]\n    end\n    \n    subgraph \"Memory Management\"\n        direction TB\n        ActiveBuffer[\"Active Buffer\\n(page[0])\"]\n        DirtyBuffer[\"Dirty Buffer\\n(page[1])\"]\n        SwapBuffers[\"Swap Buffers\"]\n    end\n    \n    subgraph \"Disk I/O\"\n        direction TB\n        IoThread[\"I/O Thread\\n(page_write_disk)\"]\n        LogFile[\"CSV Log File\"]\n    end\n    \n    msr --\u003e do_logging\n    rapl --\u003e do_logging\n    sysfs --\u003e do_logging\n    \n    do_logging --\u003e Data\n    Data --\u003e ActiveBuffer\n    \n    ActiveBuffer --\u003e |\"When full\"| SwapBuffers\n    SwapBuffers --\u003e DirtyBuffer\n    SwapBuffers -.-\u003e |\"Reset\"| ActiveBuffer\n    \n    DirtyBuffer --\u003e |\"Signal via pthread_cond_signal\"| IoThread\n    IoThread --\u003e |\"Write\"| LogFile\n```\n\nThis diagram illustrates the three main components of the logging system:\n1. **Data Collection**: Gathers metrics from hardware interfaces\n2. **Memory Management**: Handles buffering of log data\n3. **Disk I/O**: Performs asynchronous writes to the log file\n\nData flows from various sources through the collection process into memory buffers. When the active buffer fills up, it's swapped with the dirty buffer, and the I/O thread is signaled to write the dirty buffer to disk.\n\nSources: [src/logger.c:221-332](), [src/logger.c:527-837]()\n\n## 3. Metrics Collection\n\nThe logging system collects a wide range of metrics, defined by the column descriptors in the code. Each metric has several attributes including whether it's enabled, its header name, unit of measurement, and formatting details.\n\n### 3.1 Supported Metrics\n\n| Metric Category | Examples | Description | Source |\n|----------------|----------|-------------|--------|\n| **Timing** | Time | Timestamp in milliseconds | System clock |\n| **CPU Performance** | Freq, Load, ScaleF, Qperf | CPU frequency, utilization, scaling, performance | MSR registers |\n| **Power Consumption** | pwrPkg0-3, PwrCore, PwrGpu, PwrDram | Package, core, GPU, and DRAM power consumption | RAPL interface |\n| **Thermal** | CpuDts, SocDts | CPU and SoC temperature in degrees Celsius | Sysfs entries |\n\nThe metrics are initialized in the `col_desc` array, which defines all attributes for each metric column that will appear in log files.\n\nSources: [src/logger.c:40-83](), [src/logger.h:33-50]()\n\n## 4. Double-Buffering Mechanism\n\n```mermaid\nsequenceDiagram\n    participant Worker as \"Worker Thread\"\n    participant ActiveBuf as \"Active Buffer\"\n    participant DirtyBuf as \"Dirty Buffer\"\n    participant IO as \"I/O Thread\"\n    participant File as \"Log File\"\n    \n    Note over Worker,File: Initial Buffer Setup\n    Worker-\u003e\u003eActiveBuf: Initialize active_pg = page[0]\n    Worker-\u003e\u003eDirtyBuf: Initialize dirty_pg = page[1]\n    \n    loop Logging Cycle\n        Worker-\u003e\u003eWorker: Collect metrics via do_logging()\n        Worker-\u003e\u003eActiveBuf: accumulate_flush_record(final_buf, sz)\n        \n        alt Buffer Full\n            Worker-\u003e\u003eWorker: Swap active_pg and dirty_pg\n            Worker-\u003e\u003eDirtyBuf: Set dirty_pg_filled\n            Worker-\u003e\u003eActiveBuf: Reset active_pg_filled = 0\n            Worker-\u003e\u003eIO: trigger_disk_io() - Signal via pthread_cond_signal\n            IO-\u003e\u003eIO: pthread_cond_wait() unblocks\n            IO-\u003e\u003eDirtyBuf: Read buffer contents\n            IO-\u003e\u003eFile: Write buffer to disk\n        end\n    end\n```\n\nThe double-buffering mechanism is a key architectural feature that enables efficient, non-blocking logging:\n\n1. Two memory pages (`page[0]` and `page[1]`) are allocated during initialization\n2. The `active_pg` pointer references the buffer currently being filled with new log records\n3. The `dirty_pg` pointer references the buffer being written to disk\n4. When the active buffer fills up, the pointers are swapped, and the I/O thread is signaled\n5. The I/O thread writes the dirty buffer to disk while new data collection continues in the new active buffer\n\nThis approach prevents logging operations from blocking due to disk I/O, ensuring that performance measurements remain accurate.\n\nSources: [src/logger.c:221-288](), [src/logger.c:290-332]()\n\n## 5. Core Functions\n\n### 5.1 Logging Initialization\n\nThe logging system is initialized through several functions:\n\n- `initialize_logger()`: Sets up file descriptors for metrics collection and initializes the log pages\n- `initialize_log_page()`: Allocates memory for the double-buffering system\n- `initialize_log_clock()`: Sets up timing for the logging process\n\nDuring initialization, the system determines which metrics are available on the current hardware by checking for the presence of various files and interfaces (MSR, RAPL, sysfs).\n\nSources: [src/logger.c:232-239](), [src/logger.c:336-428](), [src/logger.c:436-443]()\n\n### 5.2 Data Collection\n\nThe `do_logging()` function is the core of the logging system. It:\n\n1. Checks if it's time to log based on the configured polling interval\n2. Collects performance metrics via the `update_perf_diffs()` function\n3. Gathers power and thermal metrics from RAPL and sysfs\n4. Formats the data into a CSV record\n5. Adds the record to the active buffer via `accumulate_flush_record()`\n\nOn the first call, it also generates and writes the log header with column names and units.\n\nSources: [src/logger.c:527-837](), [src/logger.c:457-518]()\n\n### 5.3 Asynchronous I/O\n\nThe I/O thread runs the `page_write_disk()` function, which:\n\n1. Waits on a condition variable for a signal from the data collection thread\n2. When signaled, writes the contents of the dirty buffer to the log file\n3. Returns to waiting for the next signal\n\nThis asynchronous approach ensures that disk I/O operations don't block the data collection process.\n\nSources: [src/logger.c:290-332]()\n\n## 6. Integration with Other Components\n\n```mermaid\nflowchart LR\n    subgraph \"Main System Components\"\n        Main[\"Main Program\\n(psst.c)\"]\n        Config[\"Configuration Parser\\n(parse_config.c)\"]\n        Worker[\"Worker Threads\"]\n    end\n    \n    subgraph \"Logging System\"\n        Logger[\"Logger\\n(logger.c)\"]\n        IoThread[\"I/O Thread\"]\n        LogBuffer[\"Log Buffers\"]\n        LogFile[\"Log File\"]\n    end\n    \n    subgraph \"Hardware Interface\"\n        PerfMSR[\"Performance Counters\\n(perf_msr.c)\"]\n        RAPL[\"Power Measurement\\n(rapl.c)\"]\n    end\n    \n    Main --\u003e |\"Creates\"| Worker\n    Main --\u003e |\"Initializes\"| Logger\n    Main --\u003e |\"Creates\"| IoThread\n    \n    Worker --\u003e |\"Calls do_logging()\"| Logger\n    \n    Logger --\u003e |\"Reads\"| PerfMSR\n    Logger --\u003e |\"Reads\"| RAPL\n    \n    Logger --\u003e |\"Writes to\"| LogBuffer\n    LogBuffer --\u003e |\"Signaled when full\"| IoThread\n    IoThread --\u003e |\"Writes to\"| LogFile\n    \n    Config --\u003e |\"Provides logging settings\"| Logger\n```\n\nThe logging system interacts with several other components of PSST:\n\n1. **Main Program**: Initializes the logging system and creates the I/O thread\n2. **Worker Threads**: Call `do_logging()` to record metrics during their execution\n3. **Performance Counters**: Provide CPU performance metrics through MSR registers\n4. **RAPL Interface**: Provides power consumption metrics\n\nThe asynchronous nature of the logging system ensures that these interactions have minimal impact on the stress testing being performed.\n\nSources: [src/logger.c:527-837](), [src/logger.h:70-78]()\n\n## 7. Log File Format\n\nThe log file is formatted as a CSV file with:\n- A header row containing column names\n- A second header row containing units of measurement\n- Data rows with the collected metrics\n\nThe format of each column is defined in the `col_desc` array, which specifies the header name, unit, and format string for each metric.\n\nExample log file structure:\n```\n#Time,    Freq,      MaxCPU, LoadRq,  Load,     ScaleF,   Qperf,     pwrPkg0,   pwrPkg1,   pwrCore,   PwrGpu,    PwrDram,   CpuDts,   SocDts\n#[ms],    [MHz],     [#],    [C0_%],  [C0_%],   [%],      [perf/uS], [mWatt],   [mWatt],   [mWatt],   [mWatt],   [mWatt],   [DegC],   [DegC]\n0.00,     2300.25,   0,      75.00,   74.82,    98.75,    12456.87,  15250.32,  15125.65,  10240.55,  2350.45,   1875.25,   65.75,    63.50\n1000.13,  2400.18,   1,      75.00,   74.95,    99.12,    12789.34,  15780.45,  15680.25,  10580.85,  2450.32,   1925.45,   67.25,    65.00\n...\n```\n\nSources: [src/logger.c:682-787](), [src/logger.c:788-836]()\n\n## 8. Thread Synchronization\n\nThe logging system uses POSIX threads and synchronization primitives:\n\n- `pthread_mutex_t pmutex`: Mutex for protecting shared data\n- `pthread_cond_t pcond`: Condition variable for signaling the I/O thread\n- `trigger_disk_io()`: Signals the I/O thread to write data to disk\n\nThese mechanisms ensure thread-safe operation of the double-buffering system, preventing race conditions between the data collection and I/O threads.\n\nSources: [src/logger.c:229-246](), [src/logger.c:290-332]()\n\n## 9. Error Handling\n\nThe logging system includes several error handling mechanisms:\n\n- Checking for failed file operations and reporting via `perror()`\n- Disabling metrics that are not available on the current hardware\n- Detecting buffer overflow conditions and reporting them\n- Handling program termination by flushing any remaining log data\n\nThese mechanisms ensure that the logging system remains robust, even in the face of hardware limitations or unexpected conditions.\n\nSources: [src/logger.c:85-160](), [sr
