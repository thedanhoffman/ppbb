\"Log Buffers\"]\n        Signal[\"Signal Mechanism\\nexit_cpu_thread/exit_io_thread\"]\n        \n        WorkerThreads --\u003e |\"write logs\"| Buffer\n        Buffer --\u003e |\"triggers\"| IOThread\n        Main --\u003e |\"sets\"| Signal\n        Signal --\u003e |\"monitored by\"| WorkerThreads\n        Signal --\u003e |\"monitored by\"| IOThread\n    end\n```\n\nSources: [src/psst.c:394-545](), [src/psst.c:226-371]()\n\n### Worker Thread Implementation\n\nThe `work_fn()` function [src/psst.c:226-371]() implements the worker thread logic:\n\n1. Sets up thread-specific configurations (CPU affinity, priority)\n2. Enters a loop that alternates between:\n   - Active periods (on_time_us) where CPU work is performed\n   - Idle periods (off_time_us) where the thread sleeps\n3. Periodically calls `power_shaping()` to update the duty cycle\n4. Performs logging via `do_logging()` (for the thread on CPU 0)\n5. Exits when the `exit_cpu_thread` global variable is set\n\n## Building and Testing\n\n### Build Process\n\nThe PSST Makefile [Makefile:1-41]() defines the build process:\n\n```bash\n# Standard build\nmake\n\n# Install\nsudo make install\n\n# Create a distribution package\nmake dist\n```\n\n### Version Control\n\nVersion information is stored in the Makefile [Makefile:1]() and displayed by the `print_version()` function [src/psst.c:42-45]().\n\nWhen releasing a new version:\n\n1. Update the VERSION variable in the Makefile\n2. Use `make dist` to create a distribution package with the new version tag\n\n## Debugging Tips\n\n1. **Enable Debug Mode**: Modify the Makefile to use debug flags:\n   ```\n   CFLAGS += $(DBG_CFLAGS)  # Add this line to enable debug flags\n   ```\n\n2. **Trace Execution**:\n   - The `dbg_print()` function (defined in a header file) can be used to print debug information\n   - Add additional debug output in key functions like `power_shaping()` or `work_fn()`\n\n3. **Common Issues**:\n   - MSR access failures: Ensure kernel CONFIG_X86_MSR is enabled\n   - Thread creation failures: Check system resource limits\n   - Shape function issues: Add debugging to `power_shaping()` to verify parameter calculations\n\nSources: [Makefile:9](), [src/psst.c:394-545]()\n\n## Conclusion\n\nThis guide covered the key aspects of developing and extending PSST. The modular architecture makes it straightforward to add new power shaping functions, work types, and monitoring capabilities. By understanding the thread model and power shaping mechanisms, developers can customize PSST for specific testing scenarios.\n\nWhen contributing changes, please follow the existing code style and ensure that your modifications are properly tested on target hardware configurations."])</script><script>self.__next_f.push([1,"25:T268b,"])</script><script>self.__next_f.push([1,"# Adding New Power Shapes\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [src/parse_config.c](src/parse_config.c)\n- [src/psst.c](src/psst.c)\n- [src/psst.h](src/psst.h)\n\n\u003c/details\u003e\n\n\n\nThis document provides instructions for developers who want to extend PSST's functionality by implementing new power shaping algorithms. Power shapes define patterns of CPU utilization over time, allowing for controlled stress testing of power management, thermal characteristics, and performance scaling of Intel processors. For details about existing power shapes and their usage, see [Power Shaping Functions](#5) and [Shape Function Examples](#5.1).\n\n## Power Shaping Architecture\n\nThe power shaping system consists of several interconnected components that work together to control CPU utilization patterns.\n\n### Power Shaping Component Diagram\n\n```mermaid\nflowchart TD\n    subgraph \"Command Line Interface\"\n        CLI[\"Command Line Args\"] --\u003e CP[\"parse_cmd_config()\"]\n        CP --\u003e PPS[\"parse_power_shape()\"]\n    end\n    \n    subgraph \"Data Structures\"\n        PSN[\"enum power_shape_name\"] \n        PSA[\"power_shape_attr_t Union\"]\n        PST[\"ps_t Struct\"]\n    end\n    \n    subgraph \"Implementation\"\n        PS[\"power_shaping()\"] --\u003e WF[\"work_fn()\"]\n        WF --\u003e CPU[\"CPU Duty Cycle Control\"]\n    end\n    \n    PPS --\u003e PST\n    PST --\u003e PS\n    PSN --\u003e PST\n    PSA --\u003e PST\n```\n\nSources: [src/psst.h:35-81](), [src/psst.c:143-221](), [src/parse_config.c:356-467]()\n\nThe power shaping system has three main components:\n1. **Command Line Interface**: Parses user-specified power shape parameters\n2. **Data Structures**: Define the available power shapes and their attributes\n3. **Implementation**: Applies the power shape algorithm to control CPU utilization\n\n### Power Shape Data Flow\n\n```mermaid\nsequenceDiagram\n    participant User\n    participant Parser as \"parse_power_shape()\"\n    participant DataStruct as \"ps_t Structure\"\n    participant Algorithm as \"power_shaping()\"\n    participant CPU as \"CPU Duty Cycle\"\n    \n    User-\u003e\u003eParser: Specify shape (e.g., \"linear-ramp,3\")\n    Parser-\u003e\u003eDataStruct: Set psn=LINEAR_RAMP, slope=3\n    \n    loop Until completion\n        Algorithm-\u003e\u003eDataStruct: Check shape type \u0026 parameters\n        Algorithm-\u003e\u003eAlgorithm: Calculate new duty cycle\n        Algorithm-\u003e\u003eCPU: Set duty cycle (v_unit)\n    end\n```\n\nSources: [src/psst.c:143-221](), [src/parse_config.c:356-467]()\n\n## Adding a New Power Shape\n\nTo add a new power shape to PSST, you need to modify several files to define, implement, and expose the new shape to users.\n\n### Step 1: Add a New Shape Type to the Enum\n\nAdd your new shape name to the `power_shape_name` enum in `psst.h`:\n\nSources: [src/psst.h:35-45]()\n\n### Step 2: Define Shape Attributes\n\nAdd a new structure to the `power_shape_attr_t` union in `psst.h` to define the parameters for your shape:\n\nSources: [src/psst.h:47-74]()\n\n### Step 3: Implement the Shape Algorithm\n\nAdd a new case to the switch statement in the `power_shaping()` function in `psst.c`:\n\nSources: [src/psst.c:143-221]()\n\n### Step 4: Add Command Line Parsing Logic\n\nAdd a new condition to the `parse_power_shape()` function in `parse_config.c`:\n\nSources: [src/parse_config.c:356-467]()\n\n### Step 5: Update Usage Documentation\n\nAdd help text to the `print_usage()` function in `parse_config.c`:\n\nSources: [src/parse_config.c:45-77]()\n\n## Example: Adding a Triangle Wave Shape\n\nLet's walk through implementing a new \"triangle wave\" power shape that linearly rises to a peak and then linearly falls back to the base level.\n\n### Data Structure Modifications\n\n```mermaid\nflowchart LR\n    subgraph \"Add to enum power_shape_name\"\n        SINGLE_STEP --\u003e SINOSOID --\u003e STAIR_CASE --\u003e SINGLE_PULSE\n        SINGLE_PULSE --\u003e LINEAR_RAMP --\u003e SAW_TOOTH --\u003e TRIANGLE\n        TRIANGLE[\"TRIANGLE_WAVE (new)\"] --\u003e GROWTH_CURVE\n    end\n    \n    subgraph \"Add to power_shape_attr_t union\"\n        TWS[\"struct triangle_wave_t {\n            float max_amplitude;\n            int period_seconds;\n        } triangle_wave;\"]\n    end\n```\n\nSources: [src/psst.h:35-45](), [src/psst.h:47-74]()\n\n### Algorithm Implementation\n\n```mermaid\nflowchart TD\n    START[\"Start\"] --\u003e CHECK_TIME[\"Check if time to update\"]\n    CHECK_TIME -- \"No\" --\u003e RETURN_NO_CHANGE[\"Return 0 (no change)\"]\n    CHECK_TIME -- \"Yes\" --\u003e CALC_POSITION[\"Calculate position in cycle\"]\n    CALC_POSITION --\u003e DETERMINE_PHASE[\"Determine if rising or falling phase\"]\n    DETERMINE_PHASE -- \"Rising\" --\u003e CALC_RISING[\"Calculate rising value\"]\n    DETERMINE_PHASE -- \"Falling\" --\u003e CALC_FALLING[\"Calculate falling value\"]\n    CALC_RISING --\u003e UPDATE_VALUE[\"Update v_unit\"]\n    CALC_FALLING --\u003e UPDATE_VALUE\n    UPDATE_VALUE --\u003e CAP_VALUE[\"Cap value between MIN_LOAD and MAX_LOAD\"]\n    CAP_VALUE --\u003e UPDATE_TIME[\"Update timestamp\"]\n    UPDATE_TIME --\u003e RETURN_CHANGE[\"Return 1 (changed)\"]\n```\n\nSources: [src/psst.c:143-221]()\n\n## Implementation Details\n\n### 1. Modify psst.h\n\nAdd the new shape to the enum and define its attributes:\n\n```\n// Add to enum power_shape_name (around line 36-44)\nenum power_shape_name {\n    SINGLE_STEP,\n    SINOSOID,\n    STAIR_CASE,\n    SINGLE_PULSE,\n    LINEAR_RAMP,\n    SAW_TOOTH,\n    GROWTH_CURVE,\n    DECAY_CURVE,\n    TRIANGLE_WAVE,  // New power shape\n    NONE\n};\n\n// Add to power_shape_attr_t union (around line 47-74)\ntypedef union {\n    // Existing shapes...\n    struct triangle_wave_t {\n        float max_amplitude;\n        int period_seconds;\n    } triangle_wave;\n} power_shape_attr_t;\n```\n\nSources: [src/psst.h:35-45](), [src/psst.h:47-74]()\n\n### 2. Modify psst.c\n\nAdd a case for the new shape in the `power_shaping()` function:\n\n```\n// Add to switch statement in power_shaping() (around line 148-211)\ncase TRIANGLE_WAVE:\n    x_delta = PS_MIN_POLL_MS;\n    if (is_time_remaining(CLOCK_MONOTONIC, \u0026ps-\u003elast, 0, x_delta * 1000000))\n        return 0;\n    \n    // Calculate position in the cycle (0 to 2*period)\n    time_ms = ps-\u003elast.tv_sec * 1000 + ps-\u003elast.tv_nsec/1000000;\n    int full_period_ms = ps-\u003epsa.triangle_wave.period_seconds * 2 * 1000;\n    int position_ms = time_ms % full_period_ms;\n    \n    // Determine if in rising or falling phase\n    int half_period_ms = full_period_ms / 2;\n    if (position_ms \u003c half_period_ms) {\n        // Rising phase - linear increase\n        *v_unit = MIN_LOAD + (ps-\u003epsa.triangle_wave.max_amplitude - MIN_LOAD) * \n                  ((float)position_ms / half_period_ms);\n    } else {\n        // Falling phase - linear decrease\n        *v_unit = ps-\u003epsa.triangle_wave.max_amplitude - \n                  (ps-\u003epsa.triangle_wave.max_amplitude - MIN_LOAD) * \n                  ((float)(position_ms - half_period_ms) / half_period_ms);\n    }\n    \n    // Cap to valid range\n    cap_v_unit(v_unit, MAX_LOAD, MIN_LOAD);\n    break;\n```\n\nSources: [src/psst.c:143-221]()\n\n### 3. Modify parse_config.c\n\nAdd parsing logic to `parse_power_shape()`:\n\n```\n// Add to parse_power_shape() (around line 356-467)\nelse if (!strcmp(token, \"triangle-wave\")) {\n    token = strtok(NULL, delimiter);\n    if (token) {\n        pst-\u003epsn = TRIANGLE_WAVE;\n        sscanf(token, \"%f\", \u0026pst-\u003epsa.triangle_wave.max_amplitude);\n        token = strtok(NULL, delimiter);\n        if (token) {\n            sscanf(token, \"%d\", \u0026pst-\u003epsa.triangle_wave.period_seconds);\n            dbg_print(\"triangle wave amplitude %f period %d\\n\",\n                      pst-\u003epsa.triangle_wave.max_amplitude,\n                      pst-\u003epsa.triangle_wave.period_seconds);\n        }\n        free(running);\n    } else {\n        free(running);\n        return 0;\n    }\n}\n```\n\nUpdate the usage information in `print_usage()`:\n\n```\n// Add to print_usage() (around line 60-70)\nprintf(\"\\t\\t\u003ctriangle-wave,a,p\u003e\\t\\twhere a is max amplitude (load %%) and p is half-period (sec)\\n\");\n```\n\nSources: [src/parse_config.c:356-467](), [src/parse_config.c:45-77]()\n\n## Testing Your New Power Shape\n\nAfter implementing your new power shape, test it with the following steps:\n\n1. Rebuild PSST:\n   ```\n   make clean\n   make\n   ```\n\n2. Run PSST with your new power shape:\n   ```\n   sudo ./psst -s triangle-wave,80,5 -p 100 -d 30000 -v\n   ```\n   This example creates a triangle wave with a peak of 80% CPU load and a complete cycle time of 10 seconds (5 seconds up, 5 seconds down).\n\n3. Analyze the log file to verify the shape works as expected:\n   ```\n   python3 tools/plot_power.py \u003clog-file\u003e\n   ```\n\n## Common Implementation Patterns\n\nWhen implementing new power shapes, follow these patterns observed in existing implementations:\n\n1. **Time Management:**\n   - Use `PS_MIN_POLL_MS` (typically 50ms) as the update interval\n   - Use `is_time_remaining()` to check if it's time to update the shape\n   - Update the timestamp with `clock_gettime()` after changing the shape\n\n2. **Value Constraints:**\n   - Use `cap_v_unit()` to ensure the duty cycle stays within `MIN_LOAD` and `MAX_LOAD`\n   - Return 0 if no change is made, 1 if the shape is updated\n\n3. **Performance Considerations:**\n   - Keep calculations simple to minimize overhead\n   - Avoid complex floating-point operations where possible\n\nSources: [src/psst.c:143-221]()\n\n## Summary of Available Power Shapes\n\n| Shape Name | Parameters | Description |\n|------------|------------|-------------|\n| single-step | v | Constant load at level v |\n| sinosoid | w, a | Sinusoidal wave with wavelength w seconds and amplitude a |\n| stair-case | v, u | Step increases of height v, step length u seconds |\n| single-pulse | v, u | Single spike of height v for duration u seconds |\n| linear-ramp | m | Linear increase with slope m load/sec |\n| saw-tooth | m, a | Linear increase with slope m reversed at max a% or min 0.1% |\n| triangle-wave* | a, p | Triangle wave with amplitude a and half-period p seconds |\n\n*New shape added in this example\n\nSources: [src/parse_config.c:60-70](), [src/psst.c:148-211]()"])</script><script>self.__next_f.push([1,"26:T3644,"])</script><script>self.__next_f.push([1,"# Use Cases and Examples\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [README.md](README.md)\n- [psst.1](psst.1)\n\n\u003c/details\u003e\n\n\n\nThis page provides real-world examples of using PSST (Power Stress and Shaping Tool) for power analysis and stress testing of x86 SoCs. We'll cover practical scenarios showing how to use PSST's different capabilities for various testing and monitoring requirements. For detailed information about the power shaping functions themselves, see [Power Shaping Functions](#5).\n\n## 1. Basic Monitoring and Logging\n\nPSST can be used as a lightweight monitoring tool to collect power, thermal, and performance metrics with minimal system impact.\n\n### 1.1 System Parameter Logging\n\nOne of the simplest use cases is to use PSST just for logging system parameters with minimal overhead:\n\n```bash\nsudo psst\n```\n\nThis runs PSST with default parameters (equivalent to `sudo psst -s single-step,0.1 -p 500 -v`), which:\n- Creates 0.1% (near-idle) CPU load\n- Logs power/thermal parameters every 500ms\n- Outputs data in verbose mode to the terminal and `/var/log/psst.csv`\n\nThis approach is useful for:\n- Establishing baseline power consumption\n- Monitoring thermal behavior over time\n- Tracking frequency behaviors under near-idle conditions\n\nSources: [README.md:104-105](), [psst.1:74-78]()\n\n### 1.2 Tracking CPU with Maximum Frequency\n\nTo identify which CPU cores are reaching maximum frequency:\n\n```bash\nsudo psst -T\n```\n\nThe `-T` option tracks and reports which CPU reached the maximum frequency during each polling interval. This is useful for:\n- Verifying proper load distribution in SMP systems\n- Identifying potential hotspots\n- Debugging asymmetric performance issues\n\nSources: [README.md:113-116]()\n\n## 2. Controlled Power Stress Testing\n\nPSST excels at generating controlled, reproducible workloads for system testing.\n\n### 2.1 Fixed Load Testing\n\nTo apply a constant 30% load to CPUs 0 and 1:\n\n```bash\nsudo psst -s single-step,0.3 -C 3 -d 60000\n```\n\nThis command:\n- Applies a constant 30% load using the single-step function\n- Targets CPUs 0 and 1 (binary mask 3 = 0b11)\n- Runs for 60 seconds (60000ms)\n\nThis pattern is useful for:\n- Establishing steady-state thermal behavior\n- Testing power management at fixed utilization levels\n- Benchmarking sustained performance at specific loads\n\n```mermaid\ngraph TD\n    subgraph \"Single-Step Load Pattern\"\n        Start([\"Start\"]) --\u003e Config[\"Configure single-step,0.3\"]\n        Config --\u003e Apply[\"Apply 30% load to selected CPUs\"]\n        Apply --\u003e Log[\"Log metrics every 500ms\"]\n        Log --\u003e Check[\"Check if duration exceeded\"]\n        Check --\u003e |\"No\"| Apply\n        Check --\u003e |\"Yes\"| End([\"End\"])\n    end\n```\n\nSources: [README.md:97](), [psst.1:54-56]()\n\n### 2.2 Dynamic Load Testing with Linear Ramp\n\nTo stress test with gradually increasing load:\n\n```bash\nsudo psst -s linear-ramp,3 -C b -p 700 -d 33000 -v\n```\n\nThis command:\n- Increases CPU load by 3% every second\n- Targets CPUs 0, 1, and 3 (binary mask b = 0b1011)\n- Logs data every 700ms\n- Runs for 33 seconds\n- Displays output in verbose mode\n\nLinear ramp testing helps:\n- Identify the point at which thermal throttling begins\n- Observe power management transitions\n- Test the responsiveness of cooling systems\n\n```mermaid\ngraph TD\n    subgraph \"Linear Ramp Load Pattern\"\n        Start([\"Start\"]) --\u003e Config[\"Configure linear-ramp,3\"]\n        Config --\u003e Calculate[\"Calculate load: min(0.1 + 3% * elapsed_seconds, 100%)\"]\n        Calculate --\u003e Apply[\"Apply calculated load to CPUs 0,1,3\"]\n        Apply --\u003e Log[\"Log metrics every 700ms\"]\n        Log --\u003e Check[\"Check if duration exceeded\"]\n        Check --\u003e |\"No\"| Calculate\n        Check --\u003e |\"Yes\"| End([\"End\"])\n    end\n```\n\nSources: [README.md:107-109](), [psst.1:80-84]()\n\n## 3. Testing System Response to Oscillating Loads\n\nPeriodic load patterns help test how systems respond to dynamic workloads.\n\n### 3.1 Sinusoidal Load Testing\n\nTo create a sinusoidal load pattern:\n\n```bash\nsudo psst -s sinosoid,15,50 -p 200 -d 60000\n```\n\nThis command:\n- Creates a sinusoidal load pattern with 15-second wavelength\n- Sets maximum amplitude at 50% CPU utilization\n- Logs data every 200ms\n- Runs for 60 seconds\n\nThis pattern is useful for:\n- Testing governor responsiveness to oscillating loads\n- Studying thermal inertia effects\n- Analyzing power management delays and prediction algorithms\n\n```mermaid\ngraph LR\n    subgraph \"Sinosoid Load Pattern\"\n        direction LR\n        T0[\"Time 0s\\n0.1% Load\"] --\u003e T3.75[\"Time 3.75s\\n25% Load\"] --\u003e T7.5[\"Time 7.5s\\n50% Load\"] --\u003e T11.25[\"Time 11.25s\\n25% Load\"] --\u003e T15[\"Time 15s\\n0.1% Load\"] --\u003e T18.75[\"Time 18.75s\\n25% Load\"] --\u003e T22.5[\"Time 22.5s\\n50% Load\"]\n    end\n```\n\nSources: [README.md:98](), [psst.1:57-59]()\n\n### 3.2 Sawtooth Pattern Testing\n\nFor rapid rise and fall load patterns:\n\n```bash\nsudo psst -s saw-tooth,5,80 -d 120000\n```\n\nThis command:\n- Creates a sawtooth pattern with 5% load increase per second\n- Reverses direction at maximum 80% load or minimum 0.1% load\n- Runs for 2 minutes\n\nSawtooth patterns help:\n- Test system response to rapid load changes\n- Evaluate cooling system recovery\n- Analyze power supply stability under fluctuating demands\n\n```mermaid\ngraph LR\n    subgraph \"Saw-Tooth Load Pattern\"\n        direction LR\n        T0[\"Time 0s\\n0.1% Load\"] --\u003e T16[\"Time 16s\\n80% Load\"] --\u003e T32[\"Time 32s\\n0.1% Load\"] --\u003e T48[\"Time 48s\\n80% Load\"] --\u003e T64[\"Time 64s\\n0.1% Load\"]\n    end\n```\n\nSources: [README.md:100](), [psst.1:69-71]()\n\n## 4. Multi-CPU Testing with Different Load Patterns\n\nOne of PSST's most powerful capabilities is running multiple instances with different patterns on different CPUs.\n\n### 4.1 Heterogeneous Multi-Core Testing\n\nThis example demonstrates running different patterns on different cores simultaneously:\n\n```bash\nsleep 2; sudo psst -C 1 -d 30000 -s linear-ramp,2 \u0026\nsleep 2; sudo psst -C 2 -d 30000 -s sinosoid,15,50 \u0026\nsleep 2; sudo psst -C 4 -d 30000 -s single-step,20 \u0026\nsleep 5; sudo psst -C 8 -d 30000 -s single-pulse,60,2 \u0026\n```\n\nThis script:\n- Runs a linear ramp on CPU 0 (increasing 2% per second)\n- Runs a sinusoidal pattern on CPU 1 (15s wavelength, 50% max)\n- Applies a constant 20% load on CPU 2\n- Creates a single 60% load pulse for 2 seconds on CPU 3\n\nThis complex scenario helps:\n- Test asymmetric multiprocessing behaviors\n- Evaluate power/thermal management across the entire CPU package\n- Create realistic mixed-workload scenarios\n\n```mermaid\nflowchart TD\n    subgraph \"Multi-Pattern CPU Testing\"\n        direction TB\n        Main[\"psst Main Program\"]\n        \n        subgraph \"CPU 0\"\n            LinearRamp[\"power_shaping('linear-ramp', 2)\"]\n        end\n        \n        subgraph \"CPU 1\" \n            Sinusoid[\"power_shaping('sinosoid', 15, 50)\"]\n        end\n        \n        subgraph \"CPU 2\"\n            SingleStep[\"power_shaping('single-step', 20)\"]\n        end\n        \n        subgraph \"CPU 3\"\n            SinglePulse[\"power_shaping('single-pulse', 60, 2)\"]\n        end\n        \n        Main --\u003e LinearRamp\n        Main --\u003e Sinusoid\n        Main --\u003e SingleStep\n        Main --\u003e SinglePulse\n    end\n```\n\nSources: [README.md:125-128]()\n\n## 5. Analyzing the Results\n\nPSST generates data that can be analyzed and visualized to understand system behavior.\n\n### 5.1 Log File Format\n\nThe output log file (default: `/var/log/psst.csv`) contains columns with the following data:\n\n| Column | Description | Unit |\n|--------|-------------|------|\n| Time | Elapsed time | ms |\n| FreqReal | Actual CPU frequency | MHz |\n| LoadIn | Requested CPU load | C0_% |\n| LoadOut | Realized CPU load | C0_% |\n| PkgPwr | Package power consumption | mWatt |\n| PwrCore | Core power consumption | mWatt |\n| PwrGpu | GPU power consumption | mWatt |\n| PwrDram | DRAM power consumption | mWatt |\n| CpuDts | CPU thermal sensor reading | °C |\n| SocDts | SoC thermal sensor reading | °C |\n\nSources: [README.md:52-54]()\n\n### 5.2 Visualizing Results with gnuplot\n\nPSST data can be visualized using gnuplot:\n\n```bash\nsudo apt-get install gnuplot-x11\ngnuplot\ngnuplot\u003e cd '/var/log'\ngnuplot\u003e set datafile separator ','\ngnuplot\u003e plot 'psst.csv' using 1:4 w lines, 'psst.csv' using 1:9 w lines\n```\n\nThis plots the realized load (column 4) and CPU temperature (column 9) against time.\n\n```mermaid\nflowchart LR\n    subgraph \"PSST Data Visualization Flow\"\n        PSST[\"psst process\"] --\u003e CSV[\"CSV log file\\n/var/log/psst.csv\"]\n        CSV --\u003e Parse[\"Parse CSV\\n(gnuplot)\"]\n        Parse --\u003e Plot[\"Plot metrics\\n(load, temperature,\\nfrequency, power)\"]\n        Plot --\u003e Analyze[\"Analyze system\\nbehavior\"]\n    end\n```\n\nSources: [README.md:72-76]()\n\n## 6. Practical Test Scenarios\n\nThe following are real-world test scenarios where PSST can be effectively used.\n\n### 6.1 Thermal Response Testing\n\nTo test thermal response, run a stair-case pattern with gradually increasing loads:\n\n```bash\nsudo psst -s stair-case,10,15 -d 300000\n```\n\nThis creates 10% load steps every 15 seconds, allowing:\n- Measurement of thermal response time\n- Identification of steady-state temperatures at different load levels\n- Analysis of thermal throttling thresholds\n\n```mermaid\ngraph TD\n    subgraph \"Thermal Response Testing with power_shaping('stair-case', 10, 15)\"\n        Start([\"Start\"]) --\u003e Init[\"Initialize at 0.1% load\"]\n        Init --\u003e Step1[\"Step 1: 10.1% load\\nfor 15 seconds\"]\n        Step1 --\u003e Step2[\"Step 2: 20.1% load\\nfor 15 seconds\"]\n        Step2 --\u003e Step3[\"Step 3: 30.1% load\\nfor 15 seconds\"]\n        Step3 --\u003e StepN[\"...continue stepping\\nuntil reaches 100%\\nor duration ends\"]\n        StepN --\u003e End([\"End\"])\n    end\n```\n\nSources: [psst.1:61-63]()\n\n### 6.2 Governor Response Testing\n\nTo test CPU frequency governor responsiveness:\n\n```bash\nsudo psst -s single-pulse,80,2 -p 100 -d 20000\n```\n\nThis creates a single 80% CPU load pulse for 2 seconds, then returns to idle:\n- Observe how quickly the governor ramps up frequency\n- Measure latency between load application and frequency change\n- Analyze frequency decay after the pulse completes\n\n```mermaid\ngraph TD\n    subgraph \"CPU Frequency Governor Testing Workflow\"\n        Start([\"Start\"]) --\u003e Init[\"Run 0.1% load\"]\n        Init --\u003e Pulse[\"Apply 80% load for 2 seconds\"]\n        Pulse --\u003e Return[\"Return to 0.1% load\"]\n        Return --\u003e Log[\"Continue logging for remaining duration\"]\n        Log --\u003e Analyze[\"Analyze frequency response curve\"]\n        Analyze --\u003e End([\"End\"])\n    end\n```\n\nSources: [psst.1:64-66]()\n\n### 6.3 Package Power Distribution Analysis\n\nTo analyze how power is distributed within a CPU package:\n\n```bash\nsudo psst -s linear-ramp,2 -d 60000\n```\n\nRunning a slow linear ramp helps:\n- Compare core vs. package power consumption ratios\n- Identify power allocation between CPU cores and uncore components\n- Analyze DRAM power scaling with CPU utilization\n\n```mermaid\ngraph TD\n    subgraph \"Package Power Distribution Analysis\"\n        WorkThread[\"do_cpu_work thread(s)\"] --\u003e MSR[\"MSR Reading via\\nread_msr()\"]\n        MSR --\u003e RAPL[\"RAPL Monitoring via\\nread_rapl()\"]\n        RAPL --\u003e Data[\"Data Logging to\\nLog Buffer\"]\n        \n        subgraph \"Metrics Monitored\"\n            Pkg[\"Package Power\"] \n            Core[\"Core Power\"]\n            DRAM[\"DRAM Power\"]\n            GPU[\"GPU Power (if available)\"]\n        end\n        \n        RAPL --\u003e Pkg\n        RAPL --\u003e Core\n        RAPL --\u003e DRAM\n        RAPL --\u003e GPU\n    end\n```\n\nSources: [psst.c](), [rapl.c]()\n\n## 7. Performance Tuning and Debugging\n\nPSST can also be used to debug performance issues and tune system parameters.\n\n### 7.1 Identifying Thermal Throttling Points\n\nTo find the exact utilization level that triggers thermal throttling:\n\n```bash\nsudo psst -s linear-ramp,1 -p 250 -d 120000\n```\n\nThis slow ramp (1% per second) allows precise identification of:\n- The exact CPU utilization that triggers throttling\n- Hysteresis in the thermal control system\n- Effectiveness of thermal solutions under controlled load\n\n### 7.2 Power Limit Testing\n\nTo test power limiting capabilities:\n\n```bash\nsudo psst -s single-step,90 -d 300000\n```\n\nMaintaining a high fixed load (90%) helps:\n- Verify power limit enforcement\n- Test sustained performance under power constraints\n- Evaluate cooling system effectiveness at maximum load\n\n```mermaid\ngraph TD\n    subgraph \"Power Limit and Thermal Testing Data Flow\"\n        CPUWork[\"cpu_work function\"] --\u003e|\"generates heat\"| ThermalResponse[\"Thermal Response\"]\n        ThermalResponse --\u003e|\"potentially triggers\"| Throttling[\"Throttling Events\"]\n        Throttling --\u003e|\"impacts\"| RealizedLoad[\"Realized Load %\"]\n        Throttling --\u003e|\"impacts\"| RealizedFreq[\"Realized Frequency\"]\n        \n        Logger[\"do_logging function\"] --\u003e|\"records\"| Metrics[\"Metrics Collection\"]\n        Metrics --\u003e|\"writes to\"| CSVFile[\"CSV Log File\"]\n        \n        RealizedLoad --\u003e|\"measured by\"| Logger\n        RealizedFreq --\u003e|\"measured by\"| Logger\n    end\n```\n\nSources: [psst.c](), [perf_msr.c](), [rapl.c]()\n\n## 8. Summary\n\nPSST provides a versatile platform for controlled power and thermal testing of x86 systems. By combining different power shaping functions, CPU masks, and monitoring intervals, users can create customized test scenarios for a wide range of power analysis needs. The resulting data can be used to optimize system performance, improve thermal solutions, and validate power management policies.\n\nRemember that for best results, it may be helpful to:\n- Run tests in console mode rather than X Windows to minimize background noise\n- Consider clamping CPU frequencies if needed for your specific test\n- Use the verbose mode (-v) to monitor progress in real-time\n- Collect multiple test runs to ensure data consistency\n\nFor more information about the specific power shaping functions available, see [Power Shaping Functions](#5) and [Shape Function Examples](#5.1).\n\nSources: [README.md](), [psst.1]()"])</script><script>self.__next_f.push([1,"27:T21f3,"])</script><script>self.__next_f.push([1,"# License and Legal Information\n\n\u003cdetails\u003e\n\u003csummary\u003eRelevant source files\u003c/summary\u003e\n\nThe following files were used as context for generating this wiki page:\n\n- [LICENSE](LICENSE)\n- [README.md](README.md)\n\n\u003c/details\u003e\n\n\n\n## Purpose and Scope\n\nThis document outlines the licensing, copyright, and legal considerations related to the Power Stress and Shaping Tool (PSST). It explains the rights granted to users, the obligations imposed by the license, and other legal aspects relevant to using, modifying, and distributing the software.\n\nFor information about building and installing PSST, see [Installation and Building](#1.1).\n\nSources: [LICENSE:1-340](), [README.md:1-5]()\n\n## License Overview\n\nPSST is licensed under the GNU General Public License version 2 (GPLv2), a free and open-source license published by the Free Software Foundation. This license governs the terms under which users may use, modify, and distribute the software.\n\n```mermaid\nflowchart TD\n    subgraph \"License Model\"\n        GPL[\"GNU General Public License v2\"]\n        COPYRIGHT[\"Copyright Holder: Intel\"]\n        FSF[\"Free Software Foundation\"]\n    end\n    \n    subgraph \"User Permissions\"\n        USE[\"Use PSST\"]\n        MODIFY[\"Modify PSST\"]\n        DISTRIBUTE[\"Distribute PSST\"]\n        SOURCE[\"Access Source Code\"]\n    end\n    \n    GPL --- FSF\n    COPYRIGHT --\u003e GPL\n    GPL --\u003e USE\n    GPL --\u003e MODIFY\ ed for mere usage\n\n### When Modifying PSST\n- Modified files must carry notices stating that you changed them and the date of change\n- Modified versions must be licensed under GPLv2\n\n### When Distributing PSST or Derivatives\n- Include a copy of the GPL license text\n- Ensure all copyright notices are preserved\n- Include the complete source code or a written offer to provide it\n- Apply the GPL license to the entire work\n- Document your changes\n\nSources: [LICENSE:79-121](), [LICENSE:134-171]()\n\n## Hardware Dependencies and Legal Considerations\n\nPSST interfaces with Intel hardware through kernel modules and system interfaces, which may have additional legal implications:\n\n1. **MSR Kernel Module**: PSST requires the `msr.ko` kernel module to access model-specific registers on Intel processors. Users must ensure they have appropriate system privileges to load this module.\n\n2. **RAPL Interface**: For power monitoring, PSST uses Intel's Running Average Power Limit (RAPL) interface. Users must ensure their kernel has up-to-date support for the Intel RAPL driver compatible with their processor family.\n\n```mermaid\nflowchart TD\n    subgraph \"PSST Software Components\"\n        MAIN[\"psst.c - Main Program\"]\n        MSR[\"perf_msr.c - MSR Interface\"]\n        RAPL[\"rapl.c - Power Monitoring\"]\n    end\n    \n    subgraph \"System Components\"\n        MSR_MOD[\"msr.ko Kernel Module\"]\n        RAPL_DRIVER[\"intel_rapl Kernel Driver\"]\n        HW[\"Intel x86 Hardware\"]\n    end\n    \n    MAIN --\u003e MSR\n    MAIN --\u003e RAPL\n    MSR --\u003e MSR_MOD\n    RAPL --\u003e RAPL_DRIVER\n    MSR_MOD --\u003e HW\n    RAPL_DRIVER --\u003e HW\n```\n\nSources: [README.md:11-24]()\n\n## No Warranty Disclaimer\n\nPSST is provided \"as is\" without warranty of any kind, either expressed or implied. This includes, but is not limited to, the implied warranties of merchantability and fitness for a particular purpose. The entire risk as to the quality and performance of the software is with the user.\n\nThe copyright holders and contributors to PSST will not be liable for any damages arising from the use or inability to use the program, including but not limited to:\n- General damages\n- Special damages\n- Incidental damages\n- Consequential damages\n\nThis includes data loss, inaccurate data, system failures, or incompatibility with other programs.\n\nSources: [LICENSE:258-278]()\n\n## Contributing to PSST\n\nWhen contributing to PSST, you are effectively agreeing that your contributions may be incorporated into the project under the terms of the GPLv2. This means that:\n\n1. Your contributions will be freely available to others under the same license\n2. Others may modify and redistribute your contributions\n3. Your code will be available as open source\n\nContributors should ensure they have the right to submit their contributions under the GPLv2 license. If your contribution incorporates third-party code, ensure it is compatible with GPLv2.\n\nSources: [LICENSE:282-339]()\n\n## Relationship to Other Software Components\n\n```mermaid\nflowchart LR\n    subgraph \"PSST Components\"\n        MAIN[\"psst.c\"]\n        CONFIG[\"parse_config.c\"]\n        LOGGER[\"logger.c\"]\n        PERF[\"perf_msr.c\"]\n        RAPL[\"rapl.c\"]\n    end\n    \n    subgraph \"System Components\"\n        MSR[\"msr.ko\\n(Kernel Module)\"]\n        RAPL_DRIVER[\"intel_rapl\\n(Kernel Driver)\"]\n    end\n    \n    MAIN --\u003e CONFIG\n    MAIN --\u003e LOGGER\n    MAIN --\u003e PERF\n    MAIN --\u003e RAPL\n    \n    PERF --\u003e MSR\n    RAPL --\u003e RAPL_DRIVER\n    \n    MSR --\u003e|\"Requires\\nSystem Privileges\"| SYSTEM[\"System Access\"]\n    RAPL_DRIVER --\u003e|\"Hardware\\nCompatibility\"| PROCESSOR[\"Intel Processor\"]\n```\n\nPSST interfaces with several system components that have their own licensing and legal considerations:\n\n1. **Linux Kernel Modules**: The msr.ko module is part of the Linux kernel and is licensed under
